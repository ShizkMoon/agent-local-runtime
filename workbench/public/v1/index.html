<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AICA 工作台</title>
<script>
/* pre-paint：避免主题闪烁 —— 默认 light（Anthropic 暖纸为 showcase） */
(function(){
  var t=null;
  try{ t=localStorage.getItem("aica-v1-theme"); }catch(e){}
  if(t!=="dark") t="light";
  document.documentElement.dataset.theme=t;
})();
</script>
<style>
/* ============================================================
   v1 — dir-6 summary-first 版（活数据）
   中栏只留：目标、小结、验收清单、子代理自然语言状态、状态句。
   细节唯一入口 = 点树节点 / 点产物 → 右侧滑出子代理页。
   ============================================================ */
:root{
  /* --- 角色色（跨主题恒定） --- */
  --brand:        #d97757;   /* clay —— AGENT PRESENCE only */
  --brand-active: #c6613f;

  /* --- 字体 --- */
  --f-chrome:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --f-serif:"Newsreader","Georgia","Songti SC","Noto Serif CJK SC",ui-serif,serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Microsoft YaHei",monospace;

  /* --- radius by role --- */
  --r-ctl:8px;      /* controls */
  --r-card:12px;    /* cards */
  --r-composer:14px;/* roundest surface */
  --r-pill:999px;

  /* --- motion --- */
  --e:     cubic-bezier(.165,.84,.44,1);
  --e-pop: cubic-bezier(.34,1.3,.64,1); /* overshoot: sheet/jump pops */
  --t-fast:60ms; --t-ui:120ms; --t-med:200ms;

  /* --- geometry --- */
  --sb-w:256px;
  --rp-w:380px;
}

/* ============ LIGHT —— Anthropic 暖纸（showcase 默认） ============ */
[data-theme="light"]{
  color-scheme:light;
  --s0:#f9f9f7;             /* rail */
  --s1:#fcfcfb;             /* canvas */
  --s2:#ffffff;             /* cards / bubbles */
  --s3:#ffffff;             /* composer / elevated */
  --pop:#ffffff;            /* popovers */
  --ln:    rgba(0,0,0,.08); /* hairline */
  --ln-hi: rgba(0,0,0,.16); /* hairline strong */
  --t1:#0b0b0b;             /* primary */
  --t2:#52514e;             /* secondary */
  --t3:#67655d;             /* muted —— 亮底 / accent-soft 底均 ≥4.5:1 */

  --accent:#184f95;                       /* affordance blue */
  --accent-soft:rgba(24,79,149,.09);
  --fig:#b04a6e;    --fig-soft:rgba(176,74,110,.10);
  --ok:#5f7a45;
  --warn:#b07b4f;
  --warn-soft:rgba(176,123,79,.13);
  --on-brand:#1c1a16;          /* clay 上的字：深墨 */

  --hov:rgba(0,0,0,.035);
  --bub:#f2f0ec;                        /* user bubble：暖灰实填 */
  --shadow-pop:0 8px 24px rgba(0,0,0,.14);
  --scroll:rgba(0,0,0,.2);
  --w-md:500;
}

/* ============ DARK ============ */
[data-theme="dark"]{
  color-scheme:dark;
  --s0:#0b0b0b;
  --s1:#151515;
  --s2:#1a1a19;
  --s3:#20201f;
  --pop:#2c2c2a;
  --ln:    rgba(255,255,255,.09);
  --ln-hi: rgba(255,255,255,.18);
  --t1:#f0efec;
  --t2:#c3c2b7;
  --t3:#898781;

  --accent:#86b6ef;
  --accent-soft:rgba(134,182,239,.13);
  --fig:#c46686;    --fig-soft:rgba(196,102,134,.13);
  --ok:#8fb573;
  --warn:#d4a27f;
  --warn-soft:rgba(212,162,127,.16);

  --hov:rgba(255,255,255,.045);
  --bub:#1e1e1d;
  --on-brand:#161311;
  --shadow-pop:0 8px 24px rgba(0,0,0,.35);
  --scroll:rgba(255,255,255,.16);
  --w-md:465;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-chrome);
  font-size:14px;line-height:1.5;
  background:var(--s1);
  color:var(--t1);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft)}
#app{
  width:100%;height:100%;
  display:grid;
  grid-template-columns:var(--sb-w) minmax(0,1fr) var(--rp-w);
  grid-template-rows:minmax(0,1fr);
  background:var(--s1);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button:focus:not(:focus-visible){outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ============ 左栏：rail（s0） ============ */
#sidebar{
  background:var(--s0);
  border-right:1px solid var(--ln);
  display:flex;flex-direction:column;min-height:0;
  overflow:hidden;
}
.sb-top{padding:10px 8px 2px;flex:none}
.newtask{
  display:flex;align-items:center;height:32px;width:100%;
  padding:0 10px;border-radius:var(--r-ctl);
  font-size:14px;color:var(--t2);white-space:nowrap;
  transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.newtask:hover{background:var(--hov);color:var(--t1)}

.icon-btn{
  width:28px;height:28px;border-radius:var(--r-ctl);flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--t3);transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.icon-btn:hover{background:var(--hov);color:var(--t1)}
.icon-btn svg{width:16px;height:16px}

.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 8px 12px;min-height:0}
.sb-sec{font-size:12px;color:var(--t3);padding:14px 10px 5px;white-space:nowrap}

/* Active run = 卡（serif 标题 + pill 行 + 人话 meta 行） */
.run-card{
  width:100%;border-radius:var(--r-ctl);padding:7px 10px 8px;
  display:flex;flex-direction:column;gap:3px;position:relative;
  transition:background var(--t-ui) var(--e);white-space:nowrap;
}
.run-card:hover{background:var(--hov)}
.run-card.on{background:var(--accent-soft)}
.run-card.on .ttl{color:var(--t1)}
.run-card .r1{display:flex;align-items:center;gap:6px;min-height:18px}
.run-card .ttl{font-family:var(--f-serif);font-size:15px;font-weight:400;color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.run-card:hover .ttl{color:var(--t1)}
.run-card .meta{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis}

/* 状态 —— 小圆点承载语义色，文字保持安静 t3 */
.pill{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:12px;line-height:1;color:var(--t3);
}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--t3);flex:none}
.pill.working i{background:var(--brand);animation:breath 1.9s var(--e) infinite}
.pill.input i{background:var(--brand)}   /* 兼容旧 status="input"（无 agg 时） */
.pill.blocked{color:var(--warn)} .pill.blocked i{background:var(--warn)}   /* 等你 = 琥珀，球在人这边 */
.pill.failed{color:var(--fig)} .pill.failed i{background:var(--fig)}
.run-card .cnt{font-size:12px;color:var(--warn);font-variant-numeric:tabular-nums}
@keyframes breath{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.72)}}
.dur{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}

/* Settled = 退行，可点开看节点明细 */
.set-row{
  display:flex;align-items:center;gap:10px;height:32px;width:100%;
  padding:0 10px;font-size:14px;color:var(--t2);white-space:nowrap;
  border-radius:var(--r-ctl);transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.set-row:hover{background:var(--hov);color:var(--t1)}
.set-open{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0}
.set-open .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.set-open .tm{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.set-del{flex:none;width:20px;height:20px;border-radius:var(--r-ctl);color:var(--t3);opacity:0;
  transition:opacity var(--t-ui) var(--e),color var(--t-ui) var(--e);font-size:13px;line-height:1}
.set-row:hover .set-del{opacity:1}
.set-del:hover{color:var(--fig)}

/* ============ 中栏：thread ============ */
#center{display:flex;flex-direction:column;min-width:0;background:var(--s1)}
.th-head{
  flex:none;height:48px;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--ln);
  background:var(--s1);
}
.crumb{font-size:13px;color:var(--t3);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.crumb b{font-family:var(--f-serif);font-size:16px;color:var(--t1);font-weight:400;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis}
.th-head .right{margin-left:auto;display:flex;align-items:center;flex:none}
/* 主题切换（sun/moon） */
#themeBtn .i-sun{display:none}
[data-theme="dark"] #themeBtn .i-sun{display:block}
[data-theme="dark"] #themeBtn .i-moon{display:none}

.thread-scroll{flex:1;overflow-y:auto;min-height:0;padding:20px 24px 16px}
.col-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* user bubble —— 右对齐，暖灰实填 */
.urow{display:flex;justify-content:flex-end}
.ububble{
  max-width:78%;background:var(--bub);color:var(--t1);
  border-radius:var(--r-card) var(--r-card) 4px var(--r-card);
  padding:9px 14px;font-size:14px;line-height:1.55;
}

/* assistant prose —— Newsreader 衬线（Claude voice） */
.atext{font-family:var(--f-serif);font-size:15.5px;font-weight:400;line-height:1.72;color:var(--t1);letter-spacing:.005em}

/* thinking —— working = 3 clay dots；input = 静置 */
.think{display:flex;align-items:center;gap:10px;color:var(--t3);padding:2px 2px 0}
.think .td{display:inline-flex;gap:5px;flex:none;padding:2px 0}
.think .td i{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:tdots 1.9s var(--e) infinite}
.think .td i:nth-child(2){animation-delay:.24s}
.think .td i:nth-child(3){animation-delay:.48s}
.think .td.still i{animation:none;opacity:.35}
.think .tk{font-family:var(--f-serif);font-style:italic;font-size:13.5px;color:var(--t2)}
@keyframes tdots{0%,70%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2.5px)}}

/* 验收条目 = 派工的点；子代理行挂在各自服务的条目下（S25：外面套 .aclx 折叠条） */
.acl-list{margin-top:12px;border-top:1px solid var(--ln)}
.acl-grp{border-bottom:1px solid var(--ln)}
.acl-grp:last-child{border-bottom:0}
.acl{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:7px 2px;font-size:13.5px;color:var(--t2);
}
.acl .g{width:14px;flex:none;text-align:center;font-size:12px;line-height:1}
.acl[data-s="verified"] .g{color:var(--ok)}
.acl[data-s="failed"]   .g{color:var(--fig)}
.acl[data-s="pending"]  .g{color:var(--t3)}
.acl .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 任务树 —— 子代理自然语言状态摘要，DAG 连线：竖脊线 + 横短线 */
.tree{display:flex;flex-direction:column}
.tnode{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:5px 8px;border-radius:var(--r-ctl);min-height:38px;
  transition:background var(--t-ui) var(--e);position:relative;
}
.tnode:hover{background:var(--hov)}
.tnode.sel{background:var(--accent-soft)}
.tnode.l2{padding-left:8px;min-height:40px}
.tnode.l3{--px:16px;padding-left:34px;min-height:34px}
.tnode.l4{--px:42px;padding-left:60px;min-height:30px}
.tnode.l5{--px:68px;padding-left:86px;min-height:28px}
.tnode.l3::before,.tnode.l4::before,.tnode.l5::before{ /* 竖脊线：贯穿同级，末位只到行中 */
  content:"";position:absolute;left:var(--px);top:0;bottom:0;width:1px;background:var(--ln);
}
.tnode.last::before{bottom:50%}
.tnode.l3::after,.tnode.l4::after,.tnode.l5::after{
  content:"";position:absolute;left:var(--px);top:50%;width:22px;height:1px;background:var(--ln);
}
/* 展开的子代理块：父级脊线延续 */
.kid-grp{position:relative}
.kid-grp.cont::before{content:"";position:absolute;left:var(--px);top:0;bottom:0;width:1px;background:var(--ln)}
/* 有下级的点 = 可展开 */
.tnode .dot.x{cursor:pointer}
.tnode .dot.x:hover{box-shadow:0 0 0 4px var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px}
.dot.working{background:var(--brand);animation:breath 1.9s var(--e) infinite}
.dot.input{background:var(--brand)}
.dot.done{background:var(--ok)} .dot.queued{background:var(--t3);opacity:.55}
.dot.dep{background:var(--warn)} .dot.failed{background:var(--fig)}
.tn-main{flex:1;min-width:0}
.tn-t{display:flex;align-items:baseline;gap:8px;min-width:0}
.tn-t .nm{font-family:var(--f-serif);font-size:14px;font-weight:400;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn-d{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.tn-st{flex:none;font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.tn-st.await{color:var(--t1);font-weight:var(--w-md)}
/* 下钻页签的行：主体=展开下级，›=详情入口（悬停出现） */
.tn-row{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0 26px 0 0}
.tn-go{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:var(--r-ctl);
  display:flex;align-items:center;justify-content:center;color:var(--t3);
  opacity:0;transition:opacity var(--t-ui) var(--e),background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.tnode:hover .tn-go{opacity:1}
.tn-go:hover{background:var(--hov);color:var(--t1)}
.tn-go svg{width:14px;height:14px}
/* live 节点行尾 ✕ 中止钮：常驻但安静，悬停才上色 */
.tn-x{
  position:absolute;right:30px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:var(--r-ctl);
  display:flex;align-items:center;justify-content:center;color:var(--t3);
  font-size:13px;line-height:1;opacity:.55;
  transition:opacity var(--t-ui) var(--e),background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.tnode:hover .tn-x{opacity:1}
.tn-x:hover{background:var(--hov);color:var(--fig)}
.tnode.live .tn-row{padding-right:56px}

/* 子代理页 —— 节点 / 产物点击右侧滑出 */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,15,10,.28)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,40vw);z-index:41;
  background:var(--s1);border-left:1px solid var(--ln);display:flex;flex-direction:column;
  transform:translateX(12px);opacity:0;pointer-events:none;
  transition:transform var(--t-med) var(--e),opacity var(--t-med) var(--e)}
.sheet[hidden]{display:none}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sh-h{flex:none;display:flex;align-items:flex-start;gap:10px;padding:16px 14px 12px 20px;border-bottom:1px solid var(--ln)}
.sh-tt{flex:1;min-width:0}
.sh-back{font-size:12px;color:var(--t3);margin:-2px 0 4px;padding:1px 4px 1px 0;border-radius:4px;transition:color var(--t-ui) var(--e)}
.sh-back:hover{color:var(--t1)}
.sh-t{font-family:var(--f-serif);font-size:18px;font-weight:400;color:var(--t1);line-height:1.4}
.sh-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--t3)}
.sh-meta .dot{width:6px;height:6px;margin:0}
.sh-b{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column}
.sh-sum{font-family:var(--f-serif);font-size:14.5px;line-height:1.72;color:var(--t1)}
.sh-sec{font-size:12px;color:var(--t3);margin:20px 0 6px}
.sh-act{margin-top:16px}
.sh-log{margin-top:12px;padding:10px 12px;border:1px solid var(--ln);border-radius:var(--r-ctl);
  background:var(--s0);font-family:var(--f-mono);font-size:12px;line-height:1.8;color:var(--t2);
  white-space:pre-wrap;word-break:break-word}
/* 执行过程 —— 一步一行：状态符 · 动作 / 结果 · 时间；有原始输出的行可展开 */
.steps{list-style:none;border-top:1px solid var(--ln)}
.stp{border-bottom:1px solid var(--ln)}
.stp-h{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 4px;border-radius:var(--r-ctl);transition:background var(--t-ui) var(--e)}
button.stp-h:hover{background:var(--hov)}
.stp .sg{width:12px;flex:none;text-align:center;font-size:12px;line-height:20px;color:var(--t3)}
.stp .sg i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);vertical-align:1px}
.stp[data-s="ok"] .sg{color:var(--ok)}
.stp[data-s="err"] .sg{color:var(--fig)}
.stp[data-s="run"] .sg i{animation:breath 1.9s var(--e) infinite}
.stp .sa{flex:1;min-width:0;display:flex;flex-direction:column}
.stp .sa b{font-weight:400;font-size:13px;line-height:20px;color:var(--t1)}
.stp .sa span{font-size:12px;color:var(--t3)}
.stp .tm{flex:none;font-family:var(--f-mono);font-size:12px;line-height:20px;color:var(--t3)}
.stp .chev{width:12px;height:12px;flex:none;margin-top:4px;color:var(--t3);transition:transform var(--t-med) var(--e)}
.stp.open .chev{transform:rotate(90deg)}
.stp-out{display:none;margin:0 4px 10px 26px}
.stp.open .stp-out{display:block}

/* ---------- S17 工具时间线：单行摘要（图标 · 工具名 · 参数首行 · 状态点 · 耗时）+ 展开原文 ---------- */
.stp-line{flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.stp-t .stp-h{align-items:center}
.stp-ic{flex:none;display:flex;align-items:center;justify-content:center;width:14px;height:20px;color:var(--t3)}
.stp-ic svg{width:12px;height:12px;display:block}
.stp-name{flex:none;font-family:var(--f-mono);font-size:12.5px;line-height:20px;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.stp-args{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px;line-height:20px;color:var(--t3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stp-exit{flex:none;font-family:var(--f-mono);font-size:11.5px;line-height:18px;color:var(--t3);
  border:1px solid var(--ln);border-radius:4px;padding:0 5px}
.stp[data-s="lost"] .sg{color:var(--warn)}
.stp-out .sh-log{max-height:min(320px,42vh);overflow:auto;margin:0}
.stp-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:12px;line-height:1.6;color:var(--t3)}
.stp-foot .flag{color:var(--warn)}
.stp-ref{flex:none;height:20px;padding:0 6px;border:1px solid var(--ln);border-radius:4px;
  font-family:var(--f-mono);font-size:12px;line-height:18px;color:var(--accent);transition:background var(--t-ui) var(--e)}
.stp-ref:hover{background:var(--hov);border-color:var(--ln-hi)}
/* 时间线块：与 sheet 的「执行过程」同一套 .steps 行，只在外面加一层标题 */
.tlx{margin-top:2px}
.tlx-h{display:flex;align-items:baseline;gap:8px;padding:2px 2px 6px;font-size:12px;color:var(--t3)}
.tlx-h b{font-weight:var(--w-md);color:var(--t2)}
.tlx-h .hint{margin-left:auto}
/* turn 结局闭集：完成/失败/中止/截断/中断，各自一行，颜色只借现有语义色 */
.turn{display:flex;align-items:baseline;gap:8px;font-size:12.5px;line-height:1.6;color:var(--t3);margin-top:4px}
.turn .tk{flex:none;font-weight:var(--w-md);color:var(--t2)}
.turn .tr{flex:1;min-width:0}
.turn[data-s="completed"] .tk{color:var(--ok)}
.turn[data-s="failed"] .tk,.turn[data-s="cancelled"] .tk{color:var(--fig)}
.turn[data-s="max-tokens"] .tk,.turn[data-s="interrupted"] .tk{color:var(--warn)}


/* ev_todo 清单 —— sheet 里的 checklist，done 划线 */
.todo{list-style:none;border-top:1px solid var(--ln)}
.todo li{display:flex;align-items:baseline;gap:8px;padding:6px 2px;border-bottom:1px solid var(--ln);font-size:13px;color:var(--t2)}
.todo .ck{width:14px;flex:none;text-align:center;font-size:12px;color:var(--t3)}
.todo li.done{color:var(--t3)}
.todo li.done .ck{color:var(--ok)}
.todo li.done .tt{text-decoration:line-through}

/* sheet 顶部的节点回复行（live 节点）：与 inbox opt 同款发丝线控件 */
.sh-reply{display:flex;gap:6px;margin-bottom:14px}
.sh-reply input{
  flex:1;min-width:0;height:30px;padding:0 10px;
  font:inherit;font-size:12.5px;color:var(--t1);
  background:transparent;border:1px solid var(--ln);border-radius:var(--r-ctl);outline:none;
}
.sh-reply input:focus{border-color:var(--ln-hi)}
.sh-reply input::placeholder{color:var(--t3)}
/* transcript 折叠头：与 sh-sec 同层级文字，chev 旋转向下 */
.sh-tr-h{
  display:flex;align-items:center;gap:6px;width:100%;
  font-size:12px;color:var(--t3);margin:20px 0 6px;padding:2px 0;
  transition:color var(--t-ui) var(--e);
}
.sh-tr-h:hover{color:var(--t1)}
.sh-tr-h .chev{width:12px;height:12px;color:var(--t3);transition:transform var(--t-med) var(--e)}
.sh-tr-h.open .chev{transform:rotate(90deg)}

/* ============ composer（s3，radius 14 —— 全场最圆 + 唯一阴影）—— 纯输入 ============ */
.composer-zone{flex:none;padding:0 24px 14px;max-width:764px;margin:0 auto;width:100%}
.composer{
  position:relative;
  background:var(--s3);border:1px solid var(--ln);
  border-radius:var(--r-composer);
  box-shadow:var(--shadow-pop);
}
.c-input{display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 16px}
.c-input textarea{
  flex:1;background:none;border:0;outline:none;resize:none;
  font:inherit;font-size:14px;color:var(--t1);line-height:1.5;height:32px;padding:5px 0;
  max-height:110px;overflow-y:auto;
}
.c-input textarea::placeholder{color:var(--t3)}
.send{ /* primary CTA = clay */
  width:32px;height:32px;border-radius:var(--r-pill);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--on-brand);
  transition:background var(--t-ui) var(--e),transform var(--t-ui) var(--e-pop);
}
.send:hover{background:var(--brand-active)}
/* 有未答 gate 时发送键转为「拒绝」语义（composer 的文字 = 拒绝 + 说明原因） */
.send.danger{background:var(--fig)}
.send.danger:hover{background:color-mix(in srgb,var(--fig) 86%,#000)}
.send:active{transform:scale(.92)}
.send svg{width:15px;height:15px}

/* ============ 右栏：需要你 / 产物 / 子代理 ============ */
#right{
  background:var(--s1);border-left:1px solid var(--ln);
  display:flex;flex-direction:column;min-height:0;
}
.rp-tabs{flex:none;display:flex;align-items:center;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--ln)}
.rp-tab{display:flex;align-items:center;gap:5px;padding:8px 10px;
  font-size:13px;color:var(--t3);border-bottom:2px solid transparent;
  transition:color var(--t-ui) var(--e),border-color var(--t-ui) var(--e)}
.rp-tab:hover{color:var(--t1)}
.rp-tab.on{color:var(--t1);border-bottom-color:var(--accent);font-weight:var(--w-md)}
.rp-tab .bdg{font-size:12px;font-weight:var(--w-md);min-width:17px;height:17px;padding:0 5px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.rp-tab .bdg[hidden]{display:none}
.rp-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.rp-cells{display:flex;flex-direction:column;gap:10px}
.rp-pane{display:flex;flex-direction:column;gap:6px}
.rp-pane[hidden],.rp-cells[hidden]{display:none}
.empty-note{padding:10px 4px;font-size:13px;color:var(--t3)}

/* 产物 —— 统一文件行：文件名 · 大小 */
.artl{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:1px solid var(--ln);border-radius:var(--r-ctl);background:var(--s2);transition:border-color var(--t-ui) var(--e),background var(--t-ui) var(--e);margin-bottom:6px}
.artl:hover{border-color:var(--ln-hi);background:var(--s3)}
.artl .fn{flex:1;min-width:0;font-size:13px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artl .sz{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--t3)}
/* 产物真实预览：HTML 迷你渲染 / PDF 文档页 */
.pvp{border:1px solid var(--ln);border-radius:var(--r-card);overflow:hidden;background:var(--s2)}
.pvp-bar{height:26px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--s1)}
.pvp-bar i{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ln-hi);flex:none}
.pvp-bar span{margin-left:6px;font-family:var(--f-mono);font-size:12px;color:var(--t3)}
.pvp-body{padding:16px 18px;min-height:150px}
.pvp-h{font-family:var(--f-serif);font-size:15px;color:var(--t1);margin-bottom:10px}
.pvp-l{height:7px;border-radius:3px;background:var(--ln);margin-bottom:7px}
.pvp-l.w90{width:90%}.pvp-l.w85{width:85%}.pvp-l.w80{width:80%}.pvp-l.w70{width:70%}.pvp-l.w60{width:60%}.pvp-l.w55{width:55%}
.pvp-t{font-family:var(--f-mono);font-size:12px;color:var(--t2);background:var(--s0);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin:10px 0}
.pvp-body.pdf{background:var(--s1)}

/* 子代理页签 —— 与中栏同一套 DAG 行；返回行是唯一的扁平行 */
.sub-back{display:flex;width:100%;padding:7px 4px;border-bottom:1px solid var(--ln);
  color:var(--t3);font-size:12px;transition:color var(--t-ui) var(--e)}
.sub-back:hover{color:var(--t1)}

/* 底部拨盘 → 向上小弹层 */
.rp-foot{flex:none;position:relative;border-top:1px solid var(--ln);padding:8px 12px;display:flex;align-items:center}
.dset{
  display:inline-flex;align-items:center;gap:5px;height:26px;
  padding:0 9px;border-radius:var(--r-ctl);font-size:12px;
  color:var(--t3);transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.dset:hover{background:var(--hov);color:var(--t1)}
.dset.warn{color:var(--warn)}
.dset svg{width:12px;height:12px;opacity:.55}
.dpop{
  position:absolute;left:8px;right:8px;bottom:44px;z-index:20;
  background:var(--pop);border:1px solid var(--ln-hi);border-radius:var(--r-card);
  padding:4px;display:none;
}
.dpop.open{display:block;animation:fade var(--t-fast) var(--e)}
.dpr{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:6px 10px;border-radius:var(--r-ctl);
  font-size:12.5px;color:var(--t2);transition:background var(--t-ui) var(--e);
}
.dpr:hover{background:var(--hov);color:var(--t1)}
.dpr .dk{width:30px;flex:none;font-size:12px;color:var(--t3)}
.dpr .dv{margin-left:auto;font-size:12px;color:var(--t1);font-variant-numeric:tabular-nums}

/* inbox 卡 —— hairline 边框 */
.incard{
  background:var(--s2);border:1px solid var(--ln);
  border-radius:var(--r-card);
  padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;
  transition:opacity var(--t-med) var(--e);
}
.incard.flash{animation:iflash 1.4s var(--e)}
@keyframes iflash{0%{box-shadow:0 0 0 3px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.incard h3{font-family:var(--f-serif);font-size:15.5px;font-weight:400;color:var(--t1);line-height:1.4}
.incard .desc{font-size:13px;line-height:1.55;color:var(--t2)}
.incard .desc code{font-family:var(--f-mono);font-size:12px;color:var(--t2);background:var(--s0);border:1px solid var(--ln);padding:0 4px;border-radius:4px}
.icrumb{ /* 深层 gate 面包屑 —— 纯文本 A › B › C，无盒 */
  font-size:12px;color:var(--t3);display:flex;gap:5px;align-items:center;flex-wrap:wrap;
}
.icrumb i{font-style:normal}
.icrumb b{color:var(--t2);font-weight:var(--w-md)}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.opt{ /* 细高 30px inline 按钮：hairline 边 + 安静文字 */
  font-size:12.5px;color:var(--t2);height:30px;
  border:1px solid var(--ln);border-radius:var(--r-ctl);padding:0 11px;
  background:transparent;transition:all var(--t-ui) var(--e);
}
.opt:hover{background:var(--hov);color:var(--t1);border-color:var(--ln-hi)}
.opt.danger{color:var(--fig);border-color:color-mix(in srgb,var(--fig) 35%,transparent)}
.opt.danger:hover{background:var(--fig-soft);border-color:color-mix(in srgb,var(--fig) 50%,transparent)}
.opt.solid{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.opt.solid:hover{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
/* 已裁决：短暂显示判定后移出列表 */
.verdict{display:none;font-size:12.5px;color:var(--ok);align-items:center;gap:6px;padding-top:2px}
.verdict::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.incard.res .desc,.incard.res .opts{display:none}
.incard.res .verdict{display:flex}
.incard.res.err .verdict{color:var(--fig)}
.incard.res.err .verdict::before{background:var(--fig)}
.incard.gone{opacity:0}

/* ============ S19 审批卡：命令原文（等宽）+ 一行为什么 + 服务端 opts + 自由输入（= 拒绝并说明） ============ */
.incard.approve .cmd{
  margin:0;padding:7px 9px;background:var(--s0);border:1px solid var(--ln);border-radius:var(--r-ctl);
  font-family:var(--f-mono);font-size:12px;line-height:1.5;color:var(--t1);
  white-space:pre-wrap;word-break:break-word;max-height:96px;overflow:auto;
}
.incard.approve .why{font-size:12px;line-height:1.5;color:var(--t3)}
.incard.approve .fb{display:flex;gap:6px;margin-top:1px}
.incard.approve .fb input{
  flex:1;min-width:0;height:30px;background:var(--s0);border:1px solid var(--ln);border-radius:var(--r-ctl);
  padding:0 9px;font-size:12.5px;color:var(--t1);transition:border-color var(--t-ui) var(--e);
}
.incard.approve .fb input:focus{outline:none;border-color:var(--ln-hi)}
.incard.approve .fb input::placeholder{color:var(--t3)}
.incard.approve .fb .go{
  height:30px;padding:0 11px;border:1px solid var(--ln);border-radius:var(--r-ctl);
  font-size:12.5px;color:var(--t2);background:transparent;
}
.incard.approve .fb .go:hover{background:var(--hov);color:var(--t1);border-color:var(--ln-hi)}
/* 卡片刚出现 500ms 内 Enter 不生效（防误批）：opt 用 .arming 提示，不改变布局 */
.incard.approve.arming .opt{opacity:.55}

/* ============ S25：状态体系与重心（P3/P4/P5/P6/P8/P14/P16/P17） ============
   四条规矩：
   1) 一条信息只出现一次：goal 在标题栏与用户气泡各一次，不再进"根卡"；
   2) 结论在过程之前；过程是"组头统计 + 每条单行"，不是事件流；
   3) 状态只有一个权威表达：4 视觉态（blocked/working/failed/done），blocked 只来自人在环；
   4) 等待态一行 shimmer（工具名 + 已用时），诚实截断仍走 .stp-foot。 */
/* 顶部文字状态（中栏唯一一处；右栏条目各一处） */
.st-word{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);margin-right:8px}
.st-word i{width:6px;height:6px;border-radius:50%;background:var(--t3);flex:none}
.st-word[data-s="blocked"]{color:var(--warn)}
.st-word[data-s="blocked"] i{background:var(--warn)}
.st-word[data-s="working"] i{background:var(--brand);animation:breath 1.9s var(--e) infinite}
.st-word[data-s="failed"]{color:var(--fig)}
.st-word[data-s="failed"] i{background:var(--fig)}
/* 信息密度两档（P14）：详细 / 紧凑，只换文字不抢视觉 */
.vb-btn{height:24px;padding:0 8px;border-radius:var(--r-ctl);font-size:12px;color:var(--t3);
  transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);margin-right:2px}
.vb-btn:hover{background:var(--hov);color:var(--t1)}
/* 断线态（P16）：贴在标题栏下方、覆盖内容区顶部，不挤压布局。
   注意：[hidden] 的 UA display:none 会被作者样式的 display:flex 盖掉，必须显式关掉。 */
#center{position:relative}
.netbar{position:absolute;left:0;right:0;top:48px;z-index:18;display:flex;align-items:center;gap:10px;
  padding:6px 16px;border-bottom:1px solid var(--ln);
  background:linear-gradient(var(--warn-soft),var(--warn-soft)),var(--s1);   /* 不透明：底下内容不许透出来 */
  font-size:12.5px;color:var(--t2)}
.netbar[hidden],.st-word[hidden],.aclx-b[hidden],.tlx-b[hidden]{display:none}
.netbar .nb-a{margin-left:auto;height:22px;padding:0 8px;border:1px solid var(--ln-hi);border-radius:var(--r-ctl);
  font-size:12px;color:var(--t2);background:transparent}
.netbar .nb-a:hover{background:var(--hov);color:var(--t1)}
/* 验收条（P3）：一行折叠条替掉"又大又空"的根卡；点开才是 accept 清单 + 子代理 DAG */
.aclx{border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
/* 单轮 run 不再有用户气泡：验收条变成首块，补一点上边距，别顶在标题栏下沿（P3 的副作用） */
#colInner > .aclx:first-child{margin-top:10px}
.aclx-h{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 2px;font-size:12px;color:var(--t3)}
.aclx-h:hover{color:var(--t2)}
.aclx-h .t{font-weight:var(--w-md);color:var(--t2)}
.aclx-h .n,.aclx-h .s{font-variant-numeric:tabular-nums}
.aclx-h .s{margin-left:auto;color:var(--t3)}
.aclx .chev{width:12px;height:12px;flex:none;transition:transform var(--t-med) var(--e)}
.aclx-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.aclx-b{padding-bottom:2px}
.aclx-b .acl-list{margin-top:0;border-top:0}
/* 结论块（P4）：过程之前，页面上唯一"读"的内容 */
.concl{padding:0}
.concl-k{font-size:12px;color:var(--t3);margin-bottom:3px}
/* 过程组头（P4）：统计行 + 折叠；点开是每条单行摘要（复用 S17 的 .stp） */
.tlx-h{cursor:pointer;text-align:left;width:100%;align-items:center;gap:8px;border-radius:var(--r-ctl)}
.tlx-h:hover{background:var(--hov)}
.tlx-h .stats{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-variant-numeric:tabular-nums;color:var(--t3)}
.tlx-h .stats b{font-weight:var(--w-md);color:var(--t2)}
.tlx-h .chev{width:12px;height:12px;flex:none;color:var(--t3);transition:transform var(--t-med) var(--e)}
.tlx-h[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sgrp{font-size:12px;color:var(--t3);padding:9px 2px 1px;border-top:1px solid var(--ln);margin-top:4px;
  font-variant-numeric:tabular-nums}
.sgrp:first-child{border-top:0;margin-top:0;padding-top:2px}
/* 紧凑档（P14）：只留结论 + 每轮一行 N 步 / M 秒 / Σtok */
.mini{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t3);
  font-variant-numeric:tabular-nums;padding:2px 0}
/* 等待态（P8）：一行 shimmer + 工具名 + 已用时；reduced-motion 退化静态 */
.wait{display:flex;align-items:center;gap:9px;padding:2px 0}
.wait .sh{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none;
  animation:breath 1.9s var(--e) infinite}
.wait .wk{font-size:13px;color:var(--t2);letter-spacing:.005em}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .wait .wk{background:linear-gradient(90deg,var(--t2) 0%,var(--t2) 40%,var(--t1) 50%,var(--t2) 60%,var(--t2) 100%);
    background-size:220% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:shimmer 2.6s linear infinite}
}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
/* 等你处理的行：不用 shimmer —— 球在人这边，不该假装"在跑" */
.turn[data-s="blocked"] .tk{color:var(--warn)}
/* 右栏空态（P17）：解释为什么空，不是一句"没有" */
.empty-note.empty-2{display:flex;flex-direction:column;gap:3px;padding:12px 4px}
.empty-note.empty-2 b{font-weight:var(--w-md);color:var(--t2);font-size:13px}
.empty-note.empty-2 span{font-size:12px;line-height:1.6}
.empty-note.empty-2 .hint{color:var(--t3)}

.fadein{animation:fade var(--t-med) var(--e)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* S18/S23/S24/S26：diff、计划条、裁决强度、命令面板、健康页、toast */
.planbar{display:flex;align-items:center;gap:8px;margin:2px 0 8px;padding:6px 10px;border:1px solid var(--ln);border-radius:var(--r-ctl);background:var(--s0);font-size:13px;color:var(--t2)}
.planbar b{color:var(--t3);font-weight:600;flex:none}
.planbar .cur{color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planbar .num{margin-left:auto;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}
.planbar .hint{color:var(--t3);cursor:pointer;background:none;border:0;font:inherit;padding:0 2px;flex:none}
.planbar .hint:hover{color:var(--accent)}
.planbody{margin:-4px 0 10px;padding:2px 10px 6px;border-left:2px solid var(--ln)}
.planbody ol{margin:0;padding-left:18px}
.planbody li{font-size:13px;color:var(--t2);line-height:1.7}
.planbody li.done{color:var(--t3);text-decoration:line-through}
.planbody li.cur{color:var(--t1);font-weight:600}
.sevrow{display:flex;gap:8px;align-items:center;margin:0 0 8px;padding:5px 10px;border-radius:var(--r-ctl);font-size:13px}
.sevrow b{font-weight:600}
.sevrow .hint{margin-left:auto;background:none;border:0;font:inherit;font-size:12px;cursor:pointer;opacity:.8}
.sev-note{background:var(--accent-soft);color:var(--t2)}
.sev-warn{background:rgba(190,120,20,.13);color:var(--warn)}
.sev-block{background:rgba(200,60,50,.13);color:var(--fig)}
.sev-badge{display:inline-block;padding:0 5px;border-radius:5px;font-size:10.5px;line-height:16px;margin-left:4px;vertical-align:1px}
.dffs{margin:8px 0 0}
.dff{margin:6px 0 0}
.dff-h{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border:1px solid var(--ln);border-radius:var(--r-ctl);background:var(--s0);font:inherit;font-size:13px;color:var(--t1);cursor:pointer;text-align:left}
.dff-h:hover{border-color:var(--ln-hi);background:var(--hov)}
.dff-h .dfile{font-family:var(--f-mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dff-h .add{color:var(--ok);font-variant-numeric:tabular-nums;flex:none}
.dff-h .del{color:var(--fig);font-variant-numeric:tabular-nums;flex:none}
.dff-h .hint{margin-left:auto;color:var(--t3);font-size:12px;flex:none}
.dff-b{margin:4px 0 0;padding:8px 10px;border:1px solid var(--ln);border-radius:var(--r-ctl);background:var(--s1);font-family:var(--f-mono);font-size:12px;line-height:1.55;max-height:320px;overflow:auto;white-space:pre;color:var(--t2)}
.dff-note{padding:8px 10px;border:1px dashed var(--ln);border-radius:var(--r-ctl);font-size:12px;color:var(--t3);margin-top:4px}
.dff-foot{padding:4px 2px 0;color:var(--t3);font-size:12px}
.ln-add{color:var(--ok)} .ln-del{color:var(--fig)} .ln-hd{color:var(--accent)}
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.34);padding-top:12vh}
.ov[hidden]{display:none}
.pal{width:min(640px,92vw);background:var(--s0);border:1px solid var(--ln);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.3);overflow:hidden}
.pal input{width:100%;box-sizing:border-box;padding:12px 16px;border:0;border-bottom:1px solid var(--ln);background:transparent;color:var(--t1);font:inherit;font-size:14px;outline:none}
.pal-list{max-height:46vh;overflow:auto;padding:6px}
.pal-it{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--t2);cursor:pointer}
.pal-it.sel{background:var(--accent-soft);color:var(--t1)}
.pal-it .k{margin-left:auto;color:var(--t3);font-family:var(--f-mono);font-size:11px;flex:none}
.pal-foot{padding:6px 12px;border-top:1px solid var(--ln);color:var(--t3);font-size:11px}
.hp{width:min(760px,94vw);max-height:80vh;overflow:auto;background:var(--s0);border:1px solid var(--ln);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.3)}
.hp header{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--s0);z-index:1}
.hp header b{font-size:14px}
.hp header .hp-time{margin-left:auto;color:var(--t3);font-size:12px}
.hp-body{padding:12px 16px 18px;font-size:13px;color:var(--t2)}
.hp-grid{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;margin:4px 0 14px}
.hp-grid dt{color:var(--t3)}
.hp-grid dd{margin:0;color:var(--t1);font-family:var(--f-mono);font-size:12px;word-break:break-all}
.hp-err{list-style:none;margin:6px 0 0;padding:0}
.hp-err li{padding:5px 8px;border-left:2px solid var(--fig);background:var(--s1);margin-bottom:4px;font-family:var(--f-mono);font-size:11.5px;color:var(--t2)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--s3);color:var(--t1);padding:8px 14px;border-radius:999px;font-size:13px;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:1;transition:opacity .3s}
.toast.out{opacity:0}
/* R3：测试分组 / 提案页签 */
.sb-tog{display:flex;align-items:center;gap:6px;width:100%;padding:0;background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.sb-tog:hover{color:var(--t2)}
.sb-tog .cnt{font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.test-row{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;min-width:0;height:30px;padding:0 10px;border-radius:var(--r-ctl);font-size:13px;color:var(--t3);white-space:nowrap;cursor:pointer;background:none;border:0;text-align:left}
.test-row:hover{background:var(--hov);color:var(--t1)}
.test-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.test-row .tm{flex:none;font-family:var(--f-mono);font-size:11.5px;color:var(--t3)}
.sub-path{flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono);font-size:11px;color:var(--t3)}
.prop-item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:9px 10px;border:1px solid var(--ln);border-radius:var(--r-ctl);background:var(--s2);cursor:pointer}
.prop-item:hover{border-color:var(--ln-hi);background:var(--s3)}
.prop-item .p1{display:flex;align-items:center;gap:8px}
.prop-item .slug{font-family:var(--f-mono);font-size:12.5px;color:var(--t1);overflow:hidden;text-overflow:ellipsis}
.prop-item .p2{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t3)}
.risk{display:inline-block;padding:0 6px;border-radius:5px;font-size:10.5px;line-height:17px;flex:none}
.risk-low{background:var(--accent-soft);color:var(--t2)}
.risk-medium{background:rgba(190,120,20,.15);color:var(--warn)}
.risk-high{background:rgba(200,60,50,.15);color:var(--fig)}
.st-pending{color:var(--t2)} .st-applied{color:var(--ok)} .st-rejected{color:var(--fig)} .st-stale{color:var(--t3)}
.prop-sec{font-size:12px;color:var(--t3);margin:12px 0 4px}
.prop-md{margin:0;padding:8px 10px;border:1px solid var(--ln);border-radius:var(--r-ctl);background:var(--s1);font-size:12.5px;line-height:1.6;color:var(--t2);white-space:pre-wrap;max-height:220px;overflow:auto}
.prop-act{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.prop-act input{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--ln);border-radius:var(--r-ctl);background:var(--s1);color:var(--t1);font:inherit;font-size:13px}
.prop-act .opt[disabled]{opacity:.45;cursor:not-allowed}
.prop-note{font-size:12px;color:var(--t3)}
</style>
</head>
<body>
<div id="app">

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar">
    <div class="sb-top"><button class="newtask" id="newBtn">+ 新任务</button></div>

    <div class="sb-scroll">
      <div class="sb-sec" id="secWait" hidden>等你</div>
      <div id="waitList"></div>

      <div class="sb-sec" id="secFail" hidden>失败</div>
      <div id="failList"></div>

      <div class="sb-sec" id="secLive">进行中</div>
      <div id="runList"></div>

      <div class="sb-sec" id="secTest" hidden>
        <button class="sb-tog" id="testTog" aria-expanded="false">测试 <span class="cnt" id="testCnt">0</span></button>
      </div>
      <div id="testList" hidden></div>

      <div class="sb-sec">已结束</div>
      <div id="settledList"></div>
    </div>
  </aside>

  <!-- ================= CENTER ================= -->
  <main id="center">
    <header class="th-head">
      <span class="crumb"><b id="thTitle">AICA 工作台</b></span>
      <span class="right">
        <span class="st-word" id="thSt" hidden><i></i><span id="thStT"></span></span>
        <button class="vb-btn" id="vbBtn" title="信息密度：详细 = 组头 + 每条单行；紧凑 = 只留结论 + 一行统计">详细</button>
        <button class="vb-btn" id="palBtn" title="命令面板（Ctrl/Cmd+K）">命令</button>
        <button class="vb-btn" id="diagBtn" title="健康检查与诊断包（daemon 心跳 / runs / 磁盘 / 最近错误）">诊断</button>
        <button class="icon-btn" id="themeBtn" aria-label="切换主题">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </span>
    </header>

    <!-- S25/P16：断线态；覆盖在内容区顶部，不挤压布局 -->
    <div class="netbar" id="netbar" hidden>
      <span>桥已断开，正在重连…</span>
      <button class="nb-a" id="netRetry">立即刷新</button>
    </div>

    <div class="thread-scroll" id="threadScroll"><div class="col-inner" id="colInner"></div></div>

    <div class="composer-zone">
      <div class="composer">
        <div class="c-input">
          <textarea id="cText" rows="1" placeholder="派发任务，或回复等待中的问题…"></textarea>
          <button class="send" id="sendBtn" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ================= RIGHT PANEL ================= -->
  <aside id="right">
    <div class="rp-tabs">
      <button class="rp-tab on" data-p="inbox">需要你 <span class="bdg" id="rpInboxBdg" hidden>0</span></button>
      <button class="rp-tab" data-p="props">提案 <span class="bdg" id="rpPropsBdg" hidden>0</span></button>
      <button class="rp-tab" data-p="arts">产物</button>
      <button class="rp-tab" data-p="subs">子代理</button>
    </div>
    <div class="rp-body">
      <div class="rp-cells" id="pane-inbox"></div>
      <div class="rp-pane" id="pane-props" hidden><div id="propDock"></div></div>
      <div class="rp-pane" id="pane-arts" hidden><div id="artDock"></div></div>
      <div class="rp-pane" id="pane-subs" hidden><div id="subDock"></div></div>
    </div>

    <div class="rp-foot">
      <button class="dset" id="dset"><span id="dsetText">任务 · 标准 · flash-jailbreak · 高</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="dpop" id="dpop"></div>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden></aside>

<script>
"use strict";
/* ================= 活数据：GET /api/v1/view + SSE 触发刷新 ================= */
var RUNS = [];      /* [{id,title,status,dur,snippet,req,obj,sum,chips,tree,arts}] */
var INBOX = [];     /* [{id,t,d,crumb,opts,gate:{run,nm,pd,sn,id}}] */
var APPROVALS = []; /* S19 审批卡（gate-req.json）：[{id,run,path,tool,target,reason,args,opts:[{label,decision,scope,hint}],arm_at}] */
var SETTLED = [];   /* [[标题, 时间]] */
var resolvedIds = {}; /* 本地已裁决、等下一次 view 校准的 inbox id */
var approveArmAt = 0; /* 新审批卡出现后 500ms 内 Enter 不生效（防误批） */

var ST_LABEL = {working:"进行中", input:"等你回复", done:"已完成", queued:"排队中", dep:"等依赖", failed:"失败"};
var WB_LABEL = {"person:answer":"你的回复", "dependency":"上游子任务"};

/* ---------- S25：聚合四态 / 信息密度 / 折叠态 / 断线（P5/P6/P14/P16） ---------- */
/* blocked 只来自"人在环"（未答 gate / 未答提问）；等依赖与排队算 working —— 与 view.ts aggOfNode 同规则 */
var AGG_LABEL = {blocked:"等你", failed:"失败", working:"进行中", done:"已完成"};
var VERB = (function(){ try{ return localStorage.getItem("aica-v1-verbosity")==="compact" ? "compact" : "rich"; }catch(e){ return "rich"; } })();
var resolvedCount = 0;   /* 本场已裁决条数（右栏空态："N 条历史裁决已折叠"） */
var aclOpen = (function(){ try{ return localStorage.getItem("aica-v1-acl")==="1"; }catch(e){ return false; } })();
var groupOpen = (function(){ try{ return localStorage.getItem("aica-v1-group")!=="0"; }catch(e){ return true; } })();
var netDown = false;

var $ = function(s){ return document.querySelector(s); };
var each = function(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); };
/* 插值统一转义；inbox 的 d 字段是本地桥生成的受信 HTML（含 <code>），例外放行 */
var esc = function(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
};
var currentRun = 0;
var pendingSelectId = null;   /* 新派发的 run id：下次 view 拉取后选中它 */
var sheetTimer = 0;
var subsNd = null;   /* 子代理页签当前下钻到的节点（按 nm 在刷新后重定位） */
var openSteps = {};  /* S17 工具行展开态：runId|事件行号 → 1（静默刷新后不塌） */

/* ---------- 拉取：首拉一次 + SSE change 300ms 防抖 + 断开回退 5s 轮询 ---------- */
var fetchTimer = null, pollTimer = null, es = null;
function scheduleFetch(){
  clearTimeout(fetchTimer);
  fetchTimer = setTimeout(fetchView, 300);
}
function fetchView(){
  return fetch("/api/v1/view", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){ applyView(d); setNet(false); return fetchApprovals(); })
    .catch(function(){ setNet(true); /* 保留当前画面；"断开"由顶部黄条表达，不静默停在最后一条 delta（P16） */ });
}
/* ---------- S25/P16：断线态。唯一入口 setNet —— 显示由它一个地方决定 ---------- */
function setNet(down){
  down = !!down;
  if(down === netDown){ return; }
  netDown = down;
  var el = $("#netbar");
  if(el) el.hidden = !down;
}

/* ---------- S19 审批卡：GET /api/approvals（gate 写的卡，opts 由服务端生成，前端只渲染） ---------- */
function fetchApprovals(){
  return fetch("/api/approvals", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(applyApprovals)
    .catch(function(){ /* 桥暂不可达：保留当前卡 */ });
}
function applyApprovals(d){
  var list = (Array.isArray(d && d.approvals) ? d.approvals : []).filter(function(a){ return a && !resolvedIds[a.id]; });
  var prev = {};
  APPROVALS.forEach(function(a){ prev[a.id] = a; });
  var fresh = false;
  list.forEach(function(a){
    if(prev[a.id]) a.arm_at = prev[a.id].arm_at;   /* 已在列表里的卡沿用武装时间，刷新不重新计时 */
    else { a.arm_at = Date.now() + 500; fresh = true; }
  });
  if(fresh) approveArmAt = Date.now() + 500;
  APPROVALS = list;
  mergeApprovalsIntoInbox();
  renderInbox();
  syncComposer();
  notifyNewInbox();
}
/* view 的 inbox 是 gate.json（ev_gate 提问）；审批卡是 gate-req.json —— 同列表、不同语义 */
function mergeApprovalsIntoInbox(){
  INBOX = INBOX.filter(function(c){ return c.kind !== "approve"; }).concat(APPROVALS.map(function(a){
    return { id:a.id, kind:"approve", t:approvalTitle(a), d:"", opts:a.opts||[], crumb:a.crumb, ap:a };
  }));
}
function approvalTitle(a){
  var t = a.tool || "工具";
  return a.target ? t + " · " + a.target : t;
}
/* 只有「当前这条 run」的审批才接管输入框：别的 run 的待答卡在右栏，不该让这条 run 打不了字 */
function pendingApprovalForComposer(){
  var rid = (RUNS[currentRun]||{}).id;
  for(var i=0;i<APPROVALS.length;i++) if(APPROVALS[i].run === rid) return APPROVALS[i];
  return null;
}
function syncComposer(){
  var ap = pendingApprovalForComposer();
  var el = $("#cText"), btn = $("#sendBtn");
  if(el) el.placeholder = ap ? "回复 = 拒绝并说明原因（不会作为新消息发出）" : "派发任务，或回复等待中的问题…";
  if(btn) btn.classList.toggle("danger", !!ap);
}
function startPoll(){ if(!pollTimer) pollTimer = setInterval(fetchView, 5000); }
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function connectSSE(){
  try{ es = new EventSource("/api/stream"); }catch(e){ setNet(true); startPoll(); return; }
  es.onopen = function(){
    stopPoll();
    fetchView();   /* 重连成功：先以 /api/v1/view 全量校准，再撤黄条（不重放 delta） */
  };
  es.onmessage = function(ev){
    try{
      var m = JSON.parse(ev.data);
      if(m && m.type === "change") scheduleFetch();
    }catch(e){}
  };
  es.onerror = function(){ setNet(true); startPoll(); };  /* EventSource 自带重连；重连成功 onopen 停轮询 */
}
$("#netRetry").addEventListener("click",function(){ fetchView(); });

/* ---------- OS 通知（S13/G17）：inbox 出现新条目 → Notification("aica", body=问题首行)。
   首拉只记录基线不弹；permission=default 时在首次交互/加载时申请一次 ---------- */
var notifiedInboxIds = null;   /* null=未建基线；之后为已见过的 inbox id 集合 */
function notifyAskPermission(){
  try{
    if("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  }catch(e){}
}
function notifyNewInbox(){
  var seen = {};
  INBOX.forEach(function(c){ if(c && c.id != null) seen[c.id] = 1; });
  if(notifiedInboxIds === null){ notifiedInboxIds = seen; return; }  /* 首拉建基线，不轰炸 */
  var fresh = INBOX.filter(function(c){ return c && c.id != null && !notifiedInboxIds[c.id]; });
  notifiedInboxIds = seen;
  if(!fresh.length) return;
  try{
    if(!("Notification" in window)) return;
    if(Notification.permission !== "granted") return;   /* 权限只在首次派发时申请，后台轮询不弹窗 */
    fresh.forEach(function(c){
      var body = String(c.t || c.d || "").split("\n")[0].slice(0, 120);
      try{ new Notification("aica", { body: body }); }catch(e){}
    });
  }catch(e){}
}

/* ---------- view 应用：保选中 run（按 id）、保展开态、滤掉已裁决 ---------- */
function applyView(d){
  var prevId = (RUNS[currentRun]||{}).id;
  /* 记录各 run 的展开节点（nm 为键），刷新后恢复 */
  var openMap = {};
  RUNS.forEach(function(r){
    if(r.id==null) return;
    var s = {};
    (r.tree||[]).forEach(function(n){ if(n.open) s[n.nm]=1; });
    openMap[r.id] = s;
  });

  RUNS    = Array.isArray(d.runs)    ? d.runs    : [];
  INBOX   = (Array.isArray(d.inbox) ? d.inbox : []).filter(function(c){ return !(c && resolvedIds[c.id]); });
  mergeApprovalsIntoInbox();   /* S19：审批卡与 view 的 gate 卡同列表（view 不含 gate-req，故由这里并入） */
  SETTLED = Array.isArray(d.settled) ? d.settled : [];
  notifyNewInbox();

  RUNS.forEach(function(r){
    if(!Array.isArray(r.tree))  r.tree  = [];
    if(!Array.isArray(r.chips)) r.chips = [];
    if(!Array.isArray(r.arts))  r.arts  = [];
    var s = openMap[r.id] || {};
    r.tree.forEach(function(n){ if(s[n.nm]) n.open = true; });
  });

  var idx = 0;
  if(pendingSelectId != null){
    for(var i=0;i<RUNS.length;i++){ if(RUNS[i].id===pendingSelectId){ idx=i; pendingSelectId=null; break; } }
  }else if(prevId != null){
    for(var i=0;i<RUNS.length;i++){ if(RUNS[i].id===prevId){ idx=i; break; } }
  }
  currentRun = RUNS.length ? Math.min(idx, RUNS.length-1) : 0;

  renderSidebar();
  renderInbox();
  renderRun(true);
  renderArts();
  /* 子代理页签：按 nm 重定位下钻节点，找不到回根层 */
  var tree = RUNS.length ? RUNS[currentRun].tree : [];
  renderSubs(subsNd ? findNode(tree, subsNd.nm) : null);
}

/* ================= theme toggle ================= */
$("#themeBtn").addEventListener("click",function(){
  var r = document.documentElement;
  var t = r.dataset.theme === "dark" ? "light" : "dark";
  r.dataset.theme = t;
  try{ localStorage.setItem("aica-v1-theme", t); }catch(e){}
});

/* ================= sidebar ================= */
/* 四态色只表达紧急度：等你(琥珀) > 失败(玫瑰) > 进行中(clay=在场) > 已完成(中性) */
function pillOf(a){
  if(a==="blocked") return '<span class="pill blocked"><i></i>等你</span>';
  if(a==="working") return '<span class="pill working"><i></i>进行中</span>';
  if(a==="failed")  return '<span class="pill failed"><i></i>失败</span>';
  return '<span class="pill"><i></i>已完成</span>';
}
function runCardHtml(r,i){

/* R3/P1：smoke_ 前缀或 kind=test 的 run 归「测试」分组，不再混进「已结束」主列表 */
/* R3/P1：测试类 run 的判据在 view.ts::test_like 单源；这里用同一正则兜底 title/snippet */
var TEST_RE = /^(smoke|test)[\s_-]/i;
function isTestRun(r){
  if(!r) return false;
  return r.test_like === true || TEST_RE.test(String(r.title||"")) || TEST_RE.test(String(r.snippet||""));
}
var testOpen = (function(){ try{ return localStorage.getItem("aica-v1-testgroup")==="1"; }catch(e){ return false; } })();
function renderSidebar(){
  /* P5：按紧急度分三段 —— 等你 > 失败 > 进行中；done 沉到「已结束」，done 不冒泡 */
  var wait = [], fail = [], live = [], testRuns = [];
  RUNS.forEach(function(r,i){
    if(isTestRun(r)){ if(aggOf(r)!=='done') testRuns.push([r,i]); return; }   // done 的测试 run 由 SETTLED 统一收
    var a = aggOf(r);
    if(a === "done") return;

  });

  $("#waitList").innerHTML = wait.map(function(p){ return runCardHtml(p[0],p[1]); }).join("");
  $("#secFail").hidden = !fail.length;

  $("#secLive").hidden = !live.length;
  $("#runList").innerHTML = live.length ? live.map(function(p){ return runCardHtml(p[0],p[1]); }).join("")
    : (!wait.length && !fail.length ? '<div class="empty-note">暂无运行中的任务</div>' : "");

  /* 测试分组：活着的 test run + 已结束里的 test 类记录（默认折叠，只给计数） */

    var r = null;
    for(var k=0;k<RUNS.length;k++) if(RUNS[k].id===s[2]){ r = RUNS[k]; break; }
    (TEST_RE.test(String(s[0]||"")) || (r && isTestRun(r)) ? setTest : setNormal).push([s,i]);
  });
  var testN = testRuns.length + setTest.length;

      '<span class="t">'+esc(r.title||r.id)+'</span><span class="tm">'+esc(r.dur||"")+'</span></div>';
  }).join("") + setTest.map(function(p){
    return '<div class="test-row" data-s="'+p[1]+'"><span class="dot done"></span>'+
      '<span class="t">'+esc(p[0][0])+'</span><span class="tm">'+esc(p[0][1])+'</span></div>';
  }).join("");
  each("#testList .test-row",function(el){
    el.addEventListener("click",function(){
      if(el.dataset.run != null){ selectRun(+el.dataset.run); return; }
      var s = SETTLED[+el.dataset.s];

  }).join("") : '<div class="empty-note">暂无记录</div>';
  each("#settledList .set-open",function(el){

      fetch("/api/runs/"+encodeURIComponent(s[2]),{method:"DELETE"}).then(scheduleFetch);
    });

    el.addEventListener("click",function(){ selectRun(+el.dataset.run); });

/* 已结束 run → sheet 展示节点明细（只读） */
function openSettled(s){

                 st:n.status==="done"?"ok":"err", exit:null, ms:null, out:[], total:0, truncated:false,
                 capped:false, ref:null, ts:n.finished_at||"", i:i, call_id:null };

/* ================= center: task view ================= */
function aclHtml(c){

function stLabel(st){ return ST_LABEL[st]||""; }
function fmtTok(n){ n=+n||0; return n>=1000 ? (n/1000).toFixed(1).replace(/\.0$/,"")+"k" : String(n); }
function stWord(n){
  if(n.st==="input") return '<span class="tn-st await">等你回复</span>';

/* 节点控制动作：POST /api/runs/<run>/node/<path>/<act>；当前 run + 节点 path 定位 */
function nodePost(n, act, body){
  var run = RUNS[currentRun]||{};
  var np = nodePathOf(n);
  if(!run.id || !np) return Promise.reject(new Error("no node"));
  return fetch("/api/runs/"+encodeURIComponent(run.id)+"/node/"+encPath(np)+"/"+act,
    {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body||{})})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });

/* 行 = 选中 / 展开下级；› = 详情；点 = 就地展开；✕ = live 节点中止（中栏与页签共用一套） */
function tnodeHtml(n, last, lvl, has){
  lvl = lvl || n.l;
  return '<div class="tnode l'+lvl+(last?" last":"")+(n.live?" live":"")+'" data-nm="'+esc(n.nm)+'">'+
    '<button class="tn-row"><span class="dot '+esc(n.st)+(has?' x':'')+'"></span>'+
    '<span class="tn-main"><span class="tn-t"><span class="nm">'+esc(n.nm)+'</span>'+sevBadge(n.sev)+'</span>'+

/* 递归渲染：展开状态的节点把子代理挂在行下，父级脊线用 kid-grp 延续 */
function grpHtml(tree,kids,lvl){
  var out="";
  kids.forEach(function(n,i){
    var ks=kidsOf(tree,n), last=i===kids.length-1;
    out+=tnodeHtml(n,last,lvl,ks.length>0);
    if(n.open&&ks.length){
      out+='<div class="kid-grp'+(last?'':' cont')+'" style="--px:'+(16+(lvl-3)*26)+'px">'+grpHtml(tree,ks,lvl+1)+'</div>';
    }
  });
  return out;
}
function renderRun(silent){
  var r = RUNS[currentRun];
  var ci = $("#colInner");
  if(!r){ /* 空态：解释"为什么空、下一步能做什么"，不是一句"没有"（P17） */
    $("#thTitle").textContent = "AICA 工作台";
    setStatusWord(null);
    ci.innerHTML = '<div class="empty-note empty-2"><b>还没有任务</b>'+
      '<span>在下方输入框派发一件，或按 <b>/</b> 聚焦输入。</span>'+
      '<span class="hint">有任务时，这里先给结论，再给过程。</span></div>';
    return;
  }
  $("#thTitle").textContent = r.title || "(未命名任务)";
  setStatusWord(r);

  var h = "";
  /* ① 用户消息：只有它带来"标题没说过的话"时才渲染（P3 一条信息只出现一次） */
  if(showUserBubble(r)) h += '<div class="urow"><div class="ububble">'+esc(r.req)+'</div></div>';
  /* ② 结论：结论优先于过程（P4）；没有结论时不占位 */
  if(r.sum) h += conclHtml(r);
  /* ③ 验收条：一行折叠条，点开才是 accept 清单 + 子代理 DAG（P3） */
  h += aclStripHtml(r);
  /* S23：计划条（过程组上方一行；当前项高亮，点开看全量） */
  h += planHtml(r);
  /* S23/S26：reviewer 裁决强度 + 审计对（可点开） */
  h += sevRowHtml(r);
  /* ④ 过程：详细 = 组头 + 每条单行；紧凑 = 一行 N 步 / M 秒 / Σtok（P14） */
  h += (VERB === "compact") ? miniHtml(r) : timelineHtml(r);
  /* ⑤ 结局 / 等待：一行 shimmer + 工具名 + 已用时（P8），等工作时不假装在跑 */
  h += statusLineHtml(r);

  var ts = $("#threadScroll");

  else{ ts.scrollTop = atBottom ? ts.scrollHeight : oldTop; }  /* 静默刷新不打扰阅读位置 */
  bindAcl();
  bindGroup();
  bindPlan();
  bindTreeRows();
  bindStepRows("#threadScroll", r.id, "root");
  bindDiffs("#threadScroll");
  syncComposer();   /* 切 run 可能换掉"当前审批"：输入框语义跟着走（P11） */
}
/* P3：验收条的折叠态（localStorage 记住；默认折叠 = 一行） */

/* 树行交互：有下级 → 选中 + 下钻页签；叶子 → 详情。› = 详情；✕ = 中止 */

function selectRun(i){

/* 树是扁平列表，层级由 l 表达 */
function findNode(list,nm){
  list = list||[];
  for(var i=0;i<list.length;i++) if(list[i].nm===nm) return list[i];
  return null;
}
function parentOf(list,n){
  for(var i=list.indexOf(n)-1;i>=0;i--) if(list[i].l===n.l-1) return list[i];
  return null;
}
function kidsOf(list,parent){
  if(!parent) return list.filter(function(n){ return n.l===2; });
  var kids=[];
  for(var i=list.indexOf(parent)+1;i<list.length && list[i].l>parent.l;i++){
    if(list[i].l===parent.l+1) kids.push(list[i]);
  }
  return kids;
}

/* 子代理页 —— 节点自己的小结 + 执行过程 + 产出；产物预览也住这里 */
var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
function artOf(fn){
  var r = RUNS[currentRun];
  return r ? r.arts.filter(function(a){ return a.fn===fn; })[0] : null;
}
function nodeSum(n){ return n.sum || {queued:"尚未开始。", dep:"在等上游子任务完成。"}[n.st] || ""; }
/* 节点在服务端的路径：优先显式字段，退回 nm（route 段逐个 encode） */
function nodePathOf(n){
  if(!n) return null;
  return n.path || n.p || n.np || n.nm || null;
}
function encPath(p){ return String(p).split("/").map(encodeURIComponent).join("/"); }
/* ================= S17 工具时间线：单行摘要 + 展开原文 =================
   数据契约见 workbench/view.ts StepView：{kind,name,args,st,exit,ms,out[],total,truncated,capped,ref,ts,i}
   诚实性：out 只给前 40 行，truncated/total 必须显示；capped=源事件本身是 300 字预览，要说清楚。 */
function stepKey(scope, i){ return String(scope)+"|"+i; }
function stepMs(ms){
  if(ms==null||ms===""||isNaN(ms)) return "";
  return ms>=1000 ? (ms/1000).toFixed(1).replace(/\.0$/,"")+"s" : Math.round(ms)+"ms";
}
function stepFootHtml(s){
  var out = Array.isArray(s.out) ? s.out : [];
  var foot = "";
  var rest = (s.total||0) - out.length;
  if(s.truncated && rest>0) foot += '<span>还有 '+rest+' 行 · 事件里共 '+(s.total||0)+' 行</span>';
  if(s.capped) foot += '<span class="flag">事件里的输出只是源侧 300 字预览</span>';
  var ref = s.ref ? String(s.ref).replace(/^artifacts\//,"") : "";
  if(ref) foot += '<button class="stp-ref" data-ref="'+esc(ref)+'">完整输出 → '+esc(ref)+'</button>';
  return foot ? '<div class="stp-foot">'+foot+'</div>' : "";
}
/* 图标只在工具行上用：内联 SVG（不依赖字体字形），与现有 chevron/图标的描边风格一致 */
var STEP_IC = {
  tool:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m7 8 4 4-4 4M13 16h4"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/></svg>',
  node:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.5"/></svg>'
};
function stepHtml(s, scope){
  s = s || {};

  var g = st==="ok" ? "✓" : st==="err" ? "×" : st==="lost" ? "!" : "<i></i>";
  var out = Array.isArray(s.out) ? s.out : [];

}
/* ---------- S25：结论块 / 验收条 / 过程组头（P3/P4/P14） ---------- */
/* 结论：页面上唯一"读"的内容（衬线、正文级），与过程（等宽小字）形成层级差 */
function conclHtml(r){
  return '<div class="concl"><div class="concl-k">结论</div><div class="atext">'+esc(r.sum)+'</div></div>';
}
/* P3：goal 只出现一次。单轮 run 里 subject 就是用户原话（view.ts 的 title 与 req 同源），
   气泡属于纯复述 → 不渲染；只有当 req 携带了标题没有的信息（编排器改写 subject / 将来多轮气泡
   = 第 N 轮原话）时才渲染。多轮判据今天 view 没有暴露"用户轮数"，等 M9 的 reply 投影落地后
   在这里加一个 user_msgs 判断即可，其余代码不用动。 */
function showUserBubble(r){
  if(!r || !r.req) return false;
  var q = String(r.req).trim(), t = String(r.title || "").trim();
  return !(t && q === t);
}
/* 验收条：一行折叠条替掉"又大又空"的根卡；点开才是 accept 清单 + 子代理 DAG */
function aclStripHtml(r){
  var chips = r.chips || [], tree = r.tree || [];
  var hasChips = chips.length > 0;
  var top = tree.filter(function(n){ return n.l==null || n.l===2; });
  if(!hasChips && !top.length) return "";
  var n = hasChips ? chips.length : top.length;
  var ok = 0, bad = 0;
  chips.forEach(function(c){ if(c[0]==="verified") ok++; else if(c[0]==="failed") bad++; });
  var sum = hasChips
    ? [ok ? ok+" ✓" : "", bad ? bad+" ×" : "", (n-ok-bad) ? (n-ok-bad)+" ○" : ""].filter(Boolean).join(" · ")
    : n + " 个";
  var body;
  if(hasChips){
    body = '<div class="acl-list" id="tree">'+chips.map(function(c,i){
      var kids = tree.filter(function(x){ return x.acl===i; });
      return '<div class="acl-grp">'+aclHtml(c)+grpHtml(tree,kids,3)+'</div>';
    }).join("")+'</div>';
  }else{
    body = '<div class="acl-list" id="tree"><div class="acl-grp">'+grpHtml(tree, top, 3)+'</div></div>';
  }
  return '<section class="aclx"><button class="aclx-h" id="aclH" aria-expanded="'+(aclOpen?"true":"false")+'">'+
    '<span class="t">'+(hasChips?"验收":"子任务")+'</span><span class="n">'+n+' 条</span>'+
    '<span class="s">'+esc(sum)+'</span>'+CHEV+
    '</button><div class="aclx-b" id="aclB"'+(aclOpen?"":" hidden")+'>'+body+'</div></section>';
}
/* 紧凑档：只留一行 N 步 / M 秒 / Σtok（P14） */
function miniHtml(r){
  var steps = Array.isArray(r.steps) ? r.steps : [];
  if(!steps.length) return "";
  var ms = 0, has = false;
  steps.forEach(function(s){ if(typeof s.ms==="number"){ ms += s.ms; has = true; } });
  return '<div class="mini"><span>'+steps.length+' 步</span>'+
    (has ? '<span>'+stepMs(ms)+'</span>' : "")+
    (r.spent ? '<span>Σ'+fmtTok(r.spent)+'</span>' : "")+'</div>';
}
function grpLabel(k){ return ({cmd:"命令", edit:"编辑", read:"读取", other:"调用"})[k] || "其他"; }
/* 组头统计：3 命令 · 1 编辑 · 42s（跨段合计，与分段无关） */
function statsLine(st){
  if(!st || !st.n) return "";
  var parts = (st.by || []).map(function(b){ return b.n+" "+grpLabel(b.key); });
  if(st.ms != null && st.ms > 0) parts.push(stepMs(st.ms));
  if(st.err) parts.push(st.err+" 步异常");
  return parts.join(" · ");
}
/* run 详情的工具区：组头统计 +（点开）每条单行摘要。没有工具调用就不占位。 */
function timelineHtml(r){
  var steps = Array.isArray(r.steps) ? r.steps : [];
  var diffs = Array.isArray(r.diffs) ? r.diffs : [];
  if(!steps.length && !diffs.length) return "";
  var groups = Array.isArray(r.groups) ? r.groups : [];
  var stats = statsLine(r.stats) || (steps.length + " 步");
  var body;
  /* 每个连续段都只有一条时，副标题只是噪声（组头统计已经说清分类）→ 不渲染 */
  var showSgrp = groups.length > 1 && groups.some(function(g){ return g.n > 1; });
  if(showSgrp){
    body = groups.map(function(g){
      var arr = steps.slice(g.i0, g.i1+1);
      return '<div class="sgrp">'+grpLabel(g.key)+' · '+g.n+(g.err ? ' · '+g.err+' 异常' : '')+'</div>'+
        '<ol class="steps">'+arr.map(function(s){ return stepHtml(s, r.id); }).join("")+'</ol>';
    }).join("");
  }else{
    body = steps.length ? '<ol class="steps">'+steps.map(function(s){ return stepHtml(s, r.id); }).join("")+'</ol>' : "";
  }
  /* S18：文件变更跟在工具步骤后面（同一个过程组内，「文件名 +N −M」一行，点开看 diff） */
  body += diffsHtml(r);
  return '<div class="tlx"><button class="tlx-h" id="tlxH" aria-expanded="'+(groupOpen?"true":"false")+'">'+
    '<b>过程</b><span class="stats">'+esc(stats)+'</span>'+
    '<span class="hint">'+(groupOpen?"点收起":"点展开每条")+'</span>'+CHEV+
    '</button><div class="tlx-b" id="tlxB"'+(groupOpen?"":" hidden")+'>'+body+'</div></div>';
}
/* ---------- S25：状态行（P5/P6/P8） ---------- */
function aggOf(r){
  if(!r) return "working";
  if(r.agg) return r.agg;                            /* view.ts 的 max(子节点) 是唯一权威 */
  return r.status === "input" ? "blocked" : (r.status || "working");
}
function fmtSec(ms){
  var s = Math.max(0, Math.round(ms/1000));
  if(s < 60) return s+"s";
  var m = Math.floor(s/60), rest = s%60;
  return m+"m"+(rest ? rest+"s" : "");
}
function runningStep(r){
  var steps = Array.isArray(r.steps) ? r.steps : [];
  for(var i=steps.length-1;i>=0;i--) if(steps[i].st==="run") return steps[i];
  return null;
}
function statusLineHtml(r){
  var a = aggOf(r);
  if(a==="working"){
    var st = runningStep(r);
    if(st){
      var t0 = Date.parse(st.ts) || Date.now();
      return '<div class="wait"><span class="sh"></span><span class="wk" data-t0="'+t0+'" data-lbl="'+esc(st.name||"工具")+'">'+
        '正在运行 '+esc(st.name||"工具")+' · '+fmtSec(Date.now()-t0)+'</span></div>';
    }
    return '<div class="wait"><span class="sh"></span><span class="wk">正在归纳子节点结论…</span></div>';
  }
  if(a==="blocked"){
    var n = r.agg_n || 1;
    return '<div class="turn" data-s="blocked"><span class="tk">等你处理</span><span class="tr">'+
      n+' 项待裁决 · 右栏「需要你」</span></div>';
  }
  return turnRowHtml(r);
}
/* P6：结局行只在"需要解释"时出现。completed 且没有额外 reason → 由顶部状态承担，不再重复「已完成」；
   cancelled 没说原因同理；failed / max-tokens / interrupted 是异常，至少留一行。
   reason 与结论同句（前面的结论已经说过）也不重复。 */
function turnRowHtml(r){
  var t = r.turn || {}, st = t.state || "running";
  if(st === "running") return "";
  var reason = String(t.reason || "").trim();
  var dup = !!(reason && r.sum && String(r.sum).indexOf(reason.slice(0, 24)) >= 0);
  var exceptional = (st === "failed" || st === "max-tokens" || st === "interrupted");
  if(!exceptional && !reason) return "";   /* 正常完成 / 未说明的中止：顶部状态已经说了 */
  if(dup) return "";                        /* 结论里已有同一句话 */
  return turnHtml(t, r.sum);
}
/* 顶部文字状态：中栏唯一一处（P6 单一权威表达） */
function setStatusWord(r){
  var el = $("#thSt"), tx = $("#thStT");
  if(!el || !tx) return;
  if(!r){ el.hidden = true; return; }
  var a = aggOf(r);
  el.hidden = false;
  el.dataset.s = a;
  tx.textContent = (a==="blocked" && r.agg_n > 1) ? (AGG_LABEL[a]+" · "+r.agg_n) : (AGG_LABEL[a] || "");
}
var TURN_LABEL = {completed:"已完成","max-tokens":"被 token 上限截断",interrupted:"中断",cancelled:"已中止",failed:"失败",running:"进行中"};
/* turn 结局一行：state 是闭集；reason 只在结论区没有说过时补一句（R1 一条信息只出现一次） */
function turnHtml(t, said){
  t = t || {};
  var st = t.state || "running";
  if(st==="running") return "";
  var r = t.reason ? String(t.reason) : "";
  var dup = r && said && String(said).indexOf(r.slice(0, 24)) >= 0;   /* 与结论同一句话就不重复 */
  return '<div class="turn" data-s="'+esc(st)+'"><span class="tk">'+esc(TURN_LABEL[st]||st)+'</span>'+
    (r && !dup ? '<span class="tr">'+esc(r)+'</span>' : "")+'</div>';
}
/* 溢写引用 → 打开产物（与右栏产物同一个 sheet）；ring 内没有就退回 artifact 接口 */
function openRef(name, nodePath){
  var fn = String(name||"").replace(/^artifacts\//,"");
  var a = artOf(fn) || artOf("root/"+fn) || artOf((nodePath||"root")+"/"+fn);
  if(a){ openSheetFor(a); return; }
  openSheetFor({fn:fn, sz:"", path:nodePath||"root"});
}

/* 产物真实文本：GET /api/runs/<run>/node/<nodePath>/artifact/<name> → 填进 .sh-log */
function loadArtifact(a, node){
  var el = $("#shArt");
  if(!el) return;
  var run = RUNS[currentRun] || {};
  var np = a.path || a.p || a.node || nodePathOf(node);
  if(!run.id || !np || !a.fn){
    el.textContent = "（无法定位产物文件）";
    return;
  }
  el.textContent = "载入中…";
  fetch("/api/runs/"+encodeURIComponent(run.id)+"/node/"+encPath(np)+"/artifact/"+encodeURIComponent(a.fn),
        {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(t){ var e2=$("#shArt"); if(e2) e2.textContent = t; })
    .catch(function(){ var e2=$("#shArt"); if(e2) e2.textContent = "（读取失败：服务端未找到该产物）"; });
}
/* transcript 行：msg=· / tool=✓× / event=kind 名；复用 .steps 行样式 */
function trHtml(e){
  var t = String(e.ts||"").slice(11,19);
  var g="·", st="", a="", r="";
  if(e.type==="msg"){ g="<i></i>"; a="message"; r=e.text||""; }
  else if(e.type==="tool"){ st=e.data&&e.data.isError?"err":"ok"; g=st==="err"?"×":"✓";
    a=e.tool||"tool"; r=(e.data&&(e.data.result||e.data.args))||""; }
  else { a=e.kind||"event"; r=e.text||""; }
  return '<li class="stp" data-s="'+st+'"><div class="stp-h"><span class="sg">'+g+'</span>'+
    '<span class="sa"><b>'+esc(a)+'</b>'+(r?'<span>'+esc(String(r).slice(0,300))+'</span>':"")+'</span>'+
    '<span class="tm num">'+esc(t)+'</span><span class="chev"></span></div></li>';
}
/* sheet 底部 transcript 折叠：点开才拉 GET .../transcript，全量 msg/tool 流 */
function loadTranscript(n){
  var box = $("#shTrBody"); if(!box) return;
  var run = RUNS[currentRun]||{}, np = nodePathOf(n);
  box.hidden = false;
  if(!run.id || !np){ box.innerHTML = '<div class="empty-note">（无法定位节点）</div>'; return; }
  box.innerHTML = '<div class="empty-note">载入中…</div>';

    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      var items = d.transcript||[];
      var el = $("#shTrBody"); if(!el) return;
      el.innerHTML = items.length ? '<ol class="steps">'+items.map(trHtml).join("")+'</ol>'
                                  : '<div class="empty-note">无事件记录</div>';
    })
    .catch(function(e){ var el=$("#shTrBody"); if(el) el.innerHTML='<div class="empty-note">载入失败：'+esc(e.message||e)+'</div>'; });
}
function openSheetFor(n, from){
  var isArt = !!(n.fn && !n.nm), body;
  var sheetNp = isArt ? null : nodePathOf(n);
  var stepScope = (((RUNS[currentRun]||{}).id)||"")+"/"+(sheetNp||"");
  var meta = isArt ? esc(n.sz||"")
    : '<span class="dot '+esc(n.st)+'"></span>'+esc([stLabel(n.st), n.el,
        n.wait ? "等："+String(n.wait).slice(0,40) : n.wb&&WB_LABEL[n.wb] ? "等"+WB_LABEL[n.wb] : ""].filter(Boolean).join(" · "));
  if(isArt){
    if(n.pv) body = n.pv;                                             /* 服务端若给预览片段直接用 */
    else if(n.body!=null) body = '<pre class="sh-log">'+esc(n.body)+'</pre>';

  }else{
    body = "";

    body += '<p class="sh-sum">'+esc(nodeSum(n))+'</p>';
    /* S17：只有非正常结局才补一行原因（meta 已写状态，正常完成不重复） */
    if(n.turn && n.turn.state!=="running" && n.turn.state!=="completed") body += turnHtml(n.turn, nodeSum(n));
    /* S9 ev_todo 清单：done 划线，全量覆盖投影 */
    if(Array.isArray(n.todo) && n.todo.length) body += '<div class="sh-sec">清单</div><ol class="todo">'+n.todo.map(function(it){
      var dn = !!(it && it.done);
      return '<li'+(dn?' class="done"':'')+'><span class="ck">'+(dn?'✓':'○')+'</span><span class="tt">'+esc(it&&it.text||"")+'</span></li>';
    }).join("")+'</ol>';
    if(Array.isArray(n.steps) && n.steps.length) body += '<div class="sh-sec">执行过程</div><ol class="steps">'+n.steps.map(function(s){ return stepHtml(s, stepScope); }).join("")+'</ol>';
    if(Array.isArray(n.out) && n.out.length) body += '<div class="sh-sec">产出</div>'+n.out.map(function(fn){
      return '<button class="artl" data-fn="'+esc(fn)+'"><span class="fn">'+esc(fn)+'</span><span class="sz">'+esc((artOf(fn)||{}).sz||"")+'</span></button>';
    }).join("");
    body += '<button class="sh-tr-h" id="shTr">transcript'+CHEV+'</button><div id="shTrBody" hidden></div>';
  }
  var act = isArt ? '<button class="opt solid" id="shOpen">打开</button>'
    : n.st==="input" ? '<button class="opt solid" id="shGo">在需要你中处理</button>'
    : (n.st==="done"||n.st==="failed") ? '<button class="opt" id="shRetry">⟲ 重跑</button>'
    : n.live ? '<button class="opt danger" id="shAbort">中止</button>' : "";
  $("#sheet").innerHTML =
    '<div class="sh-h"><div class="sh-tt">'+
      (from?'<button class="sh-back" id="shBack">‹ '+esc(from.nm||from.fn)+'</button>':"")+
      '<div class="sh-t">'+esc(n.nm||n.fn)+'</div><div class="sh-meta">'+meta+'</div></div>'+
    '<button class="icon-btn" id="shX" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="sh-b">'+body+(act?'<div class="sh-act">'+act+'</div>':"")+'</div>';
  clearTimeout(sheetTimer);
  $("#scrim").hidden = false; $("#sheet").hidden = false;

  $("#sheet").classList.add("open");
  $("#shX").addEventListener("click",closeSheet);

  each("#sheet .artl[data-fn]",function(el){
    el.addEventListener("click",function(){
      /* out 文件名 → 真实 artifact；run 级 arts 里有同名条目则带上其 sz/body */
      var known = artOf(el.dataset.fn) || {};
      openSheetFor({fn:el.dataset.fn, sz:known.sz||"", body:known.body, pv:known.pv, path:known.path||known.p||known.node}, n);

  var bk=$("#shBack"); if(bk) bk.addEventListener("click",function(){ openSheetFor(from); });
  var go=$("#shGo"); if(go) go.addEventListener("click",function(){ closeSheet(); focusGate(n.nm); });
  var so=$("#shOpen"); if(so) so.addEventListener("click",function(){ so.textContent="已交给系统打开"; });
  /* S10 控制面：live 回复行 / done·failed ⟲重跑 / live 中止 / transcript 折叠 */
  var rp=$("#shRp"), rg=$("#shRpGo");

        .catch(function(){ rg.disabled=false; rg.textContent="重试"; });

  }

  if(rt) rt.addEventListener("click",function(){
    rt.disabled=true; rt.textContent="重跑中…";
    nodePost(n,"retry").then(function(){ rt.textContent="已回队 · 等待拉起"; scheduleFetch(); })
      .catch(function(e){ rt.disabled=false; rt.textContent="⟲ 重跑（"+(e&&e.message||"失败")+"）"; });
  });
  var ab=$("#shAbort");
  if(ab) ab.addEventListener("click",function(){
    ab.disabled=true;
    nodePost(n,"abort").then(function(){ ab.textContent="已中止"; scheduleFetch(); })
      .catch(function(){ ab.disabled=false; });

/* 子代理页签：默认显示根任务的直属子代理（L2）；点节点下钻，返回上一级 */

/* P17：空态要解释"为什么空、下一步能做什么"，不是一句"没有需要你处理的事" */

function renderInbox(){
  $("#pane-inbox").innerHTML = INBOX.length ? INBOX.map(function(c){

  }).join("") : emptyInboxHtml();
  each("#pane-inbox .opt",function(el){
    el.addEventListener("click",function(){
      var card = el.closest(".incard");
      var c = INBOX.filter(function(x){ return x.id === card.id; })[0];
      if(!c) return;

  each("#pane-inbox .incard.approve .fb input",function(el){

        decideApproval(card, c, {decision:"rejected"}, "已拒绝"); return; }
      if(e.key !== "Enter" || e.shiftKey) return;
      e.preventDefault();
