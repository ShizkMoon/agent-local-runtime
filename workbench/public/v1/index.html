<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AICA 工作台</title>
<script>
/* pre-paint：避免主题闪烁 —— 默认 light（Anthropic 暖纸为 showcase） */
(function(){
  var t=null;
  try{ t=localStorage.getItem("aica-v1-theme"); }catch(e){}
  if(t!=="dark") t="light";
  document.documentElement.dataset.theme=t;
})();
</script>
<style>
/* ============================================================
   v1 — dir-6 summary-first 版（活数据）
   中栏只留：目标、小结、验收清单、子代理自然语言状态、状态句。
   细节唯一入口 = 点树节点 / 点产物 → 右侧滑出子代理页。
   ============================================================ */
:root{
  /* --- 角色色（跨主题恒定） --- */
  --brand:        #d97757;   /* clay —— AGENT PRESENCE only */
  --brand-active: #c6613f;

  /* --- 字体 --- */
  --f-chrome:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --f-serif:"Newsreader","Georgia","Songti SC","Noto Serif CJK SC",ui-serif,serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Microsoft YaHei",monospace;

  /* --- radius by role --- */
  --r-ctl:8px;      /* controls */
  --r-card:12px;    /* cards */
  --r-composer:14px;/* roundest surface */
  --r-pill:999px;

  /* --- motion --- */
  --e:     cubic-bezier(.165,.84,.44,1);
  --e-pop: cubic-bezier(.34,1.3,.64,1); /* overshoot: sheet/jump pops */
  --t-fast:60ms; --t-ui:120ms; --t-med:200ms;

  /* --- geometry --- */
  --sb-w:256px;
  --rp-w:380px;
}

/* ============ LIGHT —— Anthropic 暖纸（showcase 默认） ============ */
[data-theme="light"]{
  color-scheme:light;
  --s0:#f9f9f7;             /* rail */
  --s1:#fcfcfb;             /* canvas */
  --s2:#ffffff;             /* cards / bubbles */
  --s3:#ffffff;             /* composer / elevated */
  --pop:#ffffff;            /* popovers */
  --ln:    rgba(0,0,0,.08); /* hairline */
  --ln-hi: rgba(0,0,0,.16); /* hairline strong */
  --t1:#0b0b0b;             /* primary */
  --t2:#52514e;             /* secondary */
  --t3:#67655d;             /* muted —— 亮底 / accent-soft 底均 ≥4.5:1 */

  --accent:#184f95;                       /* affordance blue */
  --accent-soft:rgba(24,79,149,.09);
  --fig:#b04a6e;    --fig-soft:rgba(176,74,110,.10);
  --ok:#5f7a45;
  --warn:#b07b4f;
  --on-brand:#1c1a16;          /* clay 上的字：深墨 */

  --hov:rgba(0,0,0,.035);
  --bub:#f2f0ec;                        /* user bubble：暖灰实填 */
  --shadow-pop:0 8px 24px rgba(0,0,0,.14);
  --scroll:rgba(0,0,0,.2);
  --w-md:500;
}

/* ============ DARK ============ */
[data-theme="dark"]{
  color-scheme:dark;
  --s0:#0b0b0b;
  --s1:#151515;
  --s2:#1a1a19;
  --s3:#20201f;
  --pop:#2c2c2a;
  --ln:    rgba(255,255,255,.09);
  --ln-hi: rgba(255,255,255,.18);
  --t1:#f0efec;
  --t2:#c3c2b7;
  --t3:#898781;

  --accent:#86b6ef;
  --accent-soft:rgba(134,182,239,.13);
  --fig:#c46686;    --fig-soft:rgba(196,102,134,.13);
  --ok:#8fb573;
  --warn:#d4a27f;

  --hov:rgba(255,255,255,.045);
  --bub:#1e1e1d;
  --on-brand:#161311;
  --shadow-pop:0 8px 24px rgba(0,0,0,.35);
  --scroll:rgba(255,255,255,.16);
  --w-md:465;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-chrome);
  font-size:14px;line-height:1.5;
  background:var(--s1);
  color:var(--t1);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft)}
#app{
  width:100%;height:100%;
  display:grid;
  grid-template-columns:var(--sb-w) minmax(0,1fr) var(--rp-w);
  grid-template-rows:minmax(0,1fr);
  background:var(--s1);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button:focus:not(:focus-visible){outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ============ 左栏：rail（s0） ============ */
#sidebar{
  background:var(--s0);
  border-right:1px solid var(--ln);
  display:flex;flex-direction:column;min-height:0;
  overflow:hidden;
}
.sb-top{padding:10px 8px 2px;flex:none}
.newtask{
  display:flex;align-items:center;height:32px;width:100%;
  padding:0 10px;border-radius:var(--r-ctl);
  font-size:14px;color:var(--t2);white-space:nowrap;
  transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.newtask:hover{background:var(--hov);color:var(--t1)}

.icon-btn{
  width:28px;height:28px;border-radius:var(--r-ctl);flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--t3);transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.icon-btn:hover{background:var(--hov);color:var(--t1)}
.icon-btn svg{width:16px;height:16px}

.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 8px 12px;min-height:0}
.sb-sec{font-size:12px;color:var(--t3);padding:14px 10px 5px;white-space:nowrap}

/* Active run = 卡（serif 标题 + pill 行 + 人话 meta 行） */
.run-card{
  width:100%;border-radius:var(--r-ctl);padding:7px 10px 8px;
  display:flex;flex-direction:column;gap:3px;position:relative;
  transition:background var(--t-ui) var(--e);white-space:nowrap;
}
.run-card:hover{background:var(--hov)}
.run-card.on{background:var(--accent-soft)}
.run-card.on .ttl{color:var(--t1)}
.run-card .r1{display:flex;align-items:center;gap:6px;min-height:18px}
.run-card .ttl{font-family:var(--f-serif);font-size:15px;font-weight:400;color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.run-card:hover .ttl{color:var(--t1)}
.run-card .meta{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis}

/* 状态 —— 小圆点承载语义色，文字保持安静 t3 */
.pill{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:12px;line-height:1;color:var(--t3);
}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--t3);flex:none}
.pill.working i{background:var(--brand);animation:breath 1.9s var(--e) infinite}
.pill.input i{background:var(--brand)}   /* 等你回复 = 静止 clay */
.pill.failed{color:var(--fig)} .pill.failed i{background:var(--fig)}
@keyframes breath{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.72)}}
.dur{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}

/* Settled = 退行，可点开看节点明细 */
.set-row{
  display:flex;align-items:center;gap:10px;height:32px;width:100%;
  padding:0 10px;font-size:14px;color:var(--t2);white-space:nowrap;
  border-radius:var(--r-ctl);transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.set-row:hover{background:var(--hov);color:var(--t1)}
.set-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.set-row .tm{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}

/* ============ 中栏：thread ============ */
#center{display:flex;flex-direction:column;min-width:0;background:var(--s1)}
.th-head{
  flex:none;height:48px;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--ln);
  background:var(--s1);
}
.crumb{font-size:13px;color:var(--t3);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.crumb b{font-family:var(--f-serif);font-size:16px;color:var(--t1);font-weight:400;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis}
.th-head .right{margin-left:auto;display:flex;align-items:center;flex:none}
/* 主题切换（sun/moon） */
#themeBtn .i-sun{display:none}
[data-theme="dark"] #themeBtn .i-sun{display:block}
[data-theme="dark"] #themeBtn .i-moon{display:none}

.thread-scroll{flex:1;overflow-y:auto;min-height:0;padding:20px 24px 16px}
.col-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* user bubble —— 右对齐，暖灰实填 */
.urow{display:flex;justify-content:flex-end}
.ububble{
  max-width:78%;background:var(--bub);color:var(--t1);
  border-radius:var(--r-card) var(--r-card) 4px var(--r-card);
  padding:9px 14px;font-size:14px;line-height:1.55;
}

/* assistant prose —— Newsreader 衬线（Claude voice） */
.atext{font-family:var(--f-serif);font-size:15.5px;font-weight:400;line-height:1.72;color:var(--t1);letter-spacing:.005em}

/* thinking —— working = 3 clay dots；input = 静置 */
.think{display:flex;align-items:center;gap:10px;color:var(--t3);padding:2px 2px 0}
.think .td{display:inline-flex;gap:5px;flex:none;padding:2px 0}
.think .td i{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:tdots 1.9s var(--e) infinite}
.think .td i:nth-child(2){animation-delay:.24s}
.think .td i:nth-child(3){animation-delay:.48s}
.think .td.still i{animation:none;opacity:.35}
.think .tk{font-family:var(--f-serif);font-style:italic;font-size:13.5px;color:var(--t2)}
@keyframes tdots{0%,70%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2.5px)}}

/* 根卡 —— serif 标题 + obj + 验收清单 */
.root-card{
  background:var(--s2);border:1px solid var(--ln);
  border-radius:var(--r-card);padding:16px 18px 8px;
}
.root-title{font-family:var(--f-serif);font-size:24px;font-weight:400;color:var(--t1);margin:0 0 6px;letter-spacing:.01em;line-height:1.3}
.root-obj{font-size:14px;line-height:1.65;color:var(--t2);max-width:62ch}

/* 验收条目 = 派工的点；子代理行挂在各自服务的条目下 */
.acl-list{margin-top:12px;border-top:1px solid var(--ln)}
.acl-grp{border-bottom:1px solid var(--ln)}
.acl-grp:last-child{border-bottom:0}
.acl{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:7px 2px;font-size:13.5px;color:var(--t2);
}
.acl .g{width:14px;flex:none;text-align:center;font-size:12px;line-height:1}
.acl[data-s="verified"] .g{color:var(--ok)}
.acl[data-s="failed"]   .g{color:var(--fig)}
.acl[data-s="pending"]  .g{color:var(--t3)}
.acl .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 任务树 —— 子代理自然语言状态摘要，DAG 连线：竖脊线 + 横短线 */
.tree{display:flex;flex-direction:column}
.tnode{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:5px 8px;border-radius:var(--r-ctl);min-height:38px;
  transition:background var(--t-ui) var(--e);position:relative;
}
.tnode:hover{background:var(--hov)}
.tnode.sel{background:var(--accent-soft)}
.tnode.l2{padding-left:8px;min-height:40px}
.tnode.l3{--px:16px;padding-left:34px;min-height:34px}
.tnode.l4{--px:42px;padding-left:60px;min-height:30px}
.tnode.l5{--px:68px;padding-left:86px;min-height:28px}
.tnode.l3::before,.tnode.l4::before,.tnode.l5::before{ /* 竖脊线：贯穿同级，末位只到行中 */
  content:"";position:absolute;left:var(--px);top:0;bottom:0;width:1px;background:var(--ln);
}
.tnode.last::before{bottom:50%}
.tnode.l3::after,.tnode.l4::after,.tnode.l5::after{
  content:"";position:absolute;left:var(--px);top:50%;width:22px;height:1px;background:var(--ln);
}
/* 展开的子代理块：父级脊线延续 */
.kid-grp{position:relative}
.kid-grp.cont::before{content:"";position:absolute;left:var(--px);top:0;bottom:0;width:1px;background:var(--ln)}
/* 有下级的点 = 可展开 */
.tnode .dot.x{cursor:pointer}
.tnode .dot.x:hover{box-shadow:0 0 0 4px var(--accent-soft)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px}
.dot.working{background:var(--brand);animation:breath 1.9s var(--e) infinite}
.dot.input{background:var(--brand)}
.dot.done{background:var(--ok)} .dot.queued{background:var(--t3);opacity:.55}
.dot.dep{background:var(--warn)} .dot.failed{background:var(--fig)}
.tn-main{flex:1;min-width:0}
.tn-t{display:flex;align-items:baseline;gap:8px;min-width:0}
.tn-t .nm{font-family:var(--f-serif);font-size:14px;font-weight:400;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn-d{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.tn-st{flex:none;font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.tn-st.await{color:var(--t1);font-weight:var(--w-md)}
/* 下钻页签的行：主体=展开下级，›=详情入口（悬停出现） */
.tn-row{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0 26px 0 0}
.tn-go{
  position:absolute;right:4px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:var(--r-ctl);
  display:flex;align-items:center;justify-content:center;color:var(--t3);
  opacity:0;transition:opacity var(--t-ui) var(--e),background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.tnode:hover .tn-go{opacity:1}
.tn-go:hover{background:var(--hov);color:var(--t1)}
.tn-go svg{width:14px;height:14px}

/* 子代理页 —— 节点 / 产物点击右侧滑出 */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,15,10,.28)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,40vw);z-index:41;
  background:var(--s1);border-left:1px solid var(--ln);display:flex;flex-direction:column;
  transform:translateX(12px);opacity:0;pointer-events:none;
  transition:transform var(--t-med) var(--e),opacity var(--t-med) var(--e)}
.sheet[hidden]{display:none}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sh-h{flex:none;display:flex;align-items:flex-start;gap:10px;padding:16px 14px 12px 20px;border-bottom:1px solid var(--ln)}
.sh-tt{flex:1;min-width:0}
.sh-back{font-size:12px;color:var(--t3);margin:-2px 0 4px;padding:1px 4px 1px 0;border-radius:4px;transition:color var(--t-ui) var(--e)}
.sh-back:hover{color:var(--t1)}
.sh-t{font-family:var(--f-serif);font-size:18px;font-weight:400;color:var(--t1);line-height:1.4}
.sh-meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--t3)}
.sh-meta .dot{width:6px;height:6px;margin:0}
.sh-b{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column}
.sh-sum{font-family:var(--f-serif);font-size:14.5px;line-height:1.72;color:var(--t1)}
.sh-sec{font-size:12px;color:var(--t3);margin:20px 0 6px}
.sh-act{margin-top:16px}
.sh-log{margin-top:12px;padding:10px 12px;border:1px solid var(--ln);border-radius:var(--r-ctl);
  background:var(--s0);font-family:var(--f-mono);font-size:12px;line-height:1.8;color:var(--t2);
  white-space:pre-wrap;word-break:break-word}
/* 执行过程 —— 一步一行：状态符 · 动作 / 结果 · 时间；有原始输出的行可展开 */
.steps{list-style:none;border-top:1px solid var(--ln)}
.stp{border-bottom:1px solid var(--ln)}
.stp-h{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 4px;border-radius:var(--r-ctl);transition:background var(--t-ui) var(--e)}
button.stp-h:hover{background:var(--hov)}
.stp .sg{width:12px;flex:none;text-align:center;font-size:12px;line-height:20px;color:var(--t3)}
.stp .sg i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brand);vertical-align:1px}
.stp[data-s="ok"] .sg{color:var(--ok)}
.stp[data-s="err"] .sg{color:var(--fig)}
.stp[data-s="run"] .sg i{animation:breath 1.9s var(--e) infinite}
.stp .sa{flex:1;min-width:0;display:flex;flex-direction:column}
.stp .sa b{font-weight:400;font-size:13px;line-height:20px;color:var(--t1)}
.stp .sa span{font-size:12px;color:var(--t3)}
.stp .tm{flex:none;font-family:var(--f-mono);font-size:12px;line-height:20px;color:var(--t3)}
.stp .chev{width:12px;height:12px;flex:none;margin-top:4px;color:var(--t3);transition:transform var(--t-med) var(--e)}
.stp.open .chev{transform:rotate(90deg)}
.stp-out{display:none;margin:0 4px 10px 26px}
.stp.open .stp-out{display:block}

/* ============ composer（s3，radius 14 —— 全场最圆 + 唯一阴影）—— 纯输入 ============ */
.composer-zone{flex:none;padding:0 24px 14px;max-width:764px;margin:0 auto;width:100%}
.composer{
  position:relative;
  background:var(--s3);border:1px solid var(--ln);
  border-radius:var(--r-composer);
  box-shadow:var(--shadow-pop);
}
.c-input{display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 16px}
.c-input textarea{
  flex:1;background:none;border:0;outline:none;resize:none;
  font:inherit;font-size:14px;color:var(--t1);line-height:1.5;height:32px;padding:5px 0;
  max-height:110px;overflow-y:auto;
}
.c-input textarea::placeholder{color:var(--t3)}
.send{ /* primary CTA = clay */
  width:32px;height:32px;border-radius:var(--r-pill);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--on-brand);
  transition:background var(--t-ui) var(--e),transform var(--t-ui) var(--e-pop);
}
.send:hover{background:var(--brand-active)}
.send:active{transform:scale(.92)}
.send svg{width:15px;height:15px}

/* ============ 右栏：需要你 / 产物 / 子代理 ============ */
#right{
  background:var(--s1);border-left:1px solid var(--ln);
  display:flex;flex-direction:column;min-height:0;
}
.rp-tabs{flex:none;display:flex;align-items:center;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--ln)}
.rp-tab{display:flex;align-items:center;gap:5px;padding:8px 10px;
  font-size:13px;color:var(--t3);border-bottom:2px solid transparent;
  transition:color var(--t-ui) var(--e),border-color var(--t-ui) var(--e)}
.rp-tab:hover{color:var(--t1)}
.rp-tab.on{color:var(--t1);border-bottom-color:var(--accent);font-weight:var(--w-md)}
.rp-tab .bdg{font-size:12px;font-weight:var(--w-md);min-width:17px;height:17px;padding:0 5px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.rp-tab .bdg[hidden]{display:none}
.rp-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.rp-cells{display:flex;flex-direction:column;gap:10px}
.rp-pane{display:flex;flex-direction:column;gap:6px}
.rp-pane[hidden],.rp-cells[hidden]{display:none}
.empty-note{padding:10px 4px;font-size:13px;color:var(--t3)}

/* 产物 —— 统一文件行：文件名 · 大小 */
.artl{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:1px solid var(--ln);border-radius:var(--r-ctl);background:var(--s2);transition:border-color var(--t-ui) var(--e),background var(--t-ui) var(--e);margin-bottom:6px}
.artl:hover{border-color:var(--ln-hi);background:var(--s3)}
.artl .fn{flex:1;min-width:0;font-size:13px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artl .sz{flex:none;font-family:var(--f-mono);font-size:12px;color:var(--t3)}
/* 产物真实预览：HTML 迷你渲染 / PDF 文档页 */
.pvp{border:1px solid var(--ln);border-radius:var(--r-card);overflow:hidden;background:var(--s2)}
.pvp-bar{height:26px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--s1)}
.pvp-bar i{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ln-hi);flex:none}
.pvp-bar span{margin-left:6px;font-family:var(--f-mono);font-size:12px;color:var(--t3)}
.pvp-body{padding:16px 18px;min-height:150px}
.pvp-h{font-family:var(--f-serif);font-size:15px;color:var(--t1);margin-bottom:10px}
.pvp-l{height:7px;border-radius:3px;background:var(--ln);margin-bottom:7px}
.pvp-l.w90{width:90%}.pvp-l.w85{width:85%}.pvp-l.w80{width:80%}.pvp-l.w70{width:70%}.pvp-l.w60{width:60%}.pvp-l.w55{width:55%}
.pvp-t{font-family:var(--f-mono);font-size:12px;color:var(--t2);background:var(--s0);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin:10px 0}
.pvp-body.pdf{background:var(--s1)}

/* 子代理页签 —— 与中栏同一套 DAG 行；返回行是唯一的扁平行 */
.sub-back{display:flex;width:100%;padding:7px 4px;border-bottom:1px solid var(--ln);
  color:var(--t3);font-size:12px;transition:color var(--t-ui) var(--e)}
.sub-back:hover{color:var(--t1)}

/* 底部拨盘 → 向上小弹层 */
.rp-foot{flex:none;position:relative;border-top:1px solid var(--ln);padding:8px 12px;display:flex;align-items:center}
.dset{
  display:inline-flex;align-items:center;gap:5px;height:26px;
  padding:0 9px;border-radius:var(--r-ctl);font-size:12px;
  color:var(--t3);transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.dset:hover{background:var(--hov);color:var(--t1)}
.dset.warn{color:var(--warn)}
.dset svg{width:12px;height:12px;opacity:.55}
.dpop{
  position:absolute;left:8px;right:8px;bottom:44px;z-index:20;
  background:var(--pop);border:1px solid var(--ln-hi);border-radius:var(--r-card);
  padding:4px;display:none;
}
.dpop.open{display:block;animation:fade var(--t-fast) var(--e)}
.dpr{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:6px 10px;border-radius:var(--r-ctl);
  font-size:12.5px;color:var(--t2);transition:background var(--t-ui) var(--e);
}
.dpr:hover{background:var(--hov);color:var(--t1)}
.dpr .dk{width:30px;flex:none;font-size:12px;color:var(--t3)}
.dpr .dv{margin-left:auto;font-size:12px;color:var(--t1);font-variant-numeric:tabular-nums}

/* inbox 卡 —— hairline 边框 */
.incard{
  background:var(--s2);border:1px solid var(--ln);
  border-radius:var(--r-card);
  padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;
  transition:opacity var(--t-med) var(--e);
}
.incard.flash{animation:iflash 1.4s var(--e)}
@keyframes iflash{0%{box-shadow:0 0 0 3px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.incard h3{font-family:var(--f-serif);font-size:15.5px;font-weight:400;color:var(--t1);line-height:1.4}
.incard .desc{font-size:13px;line-height:1.55;color:var(--t2)}
.incard .desc code{font-family:var(--f-mono);font-size:12px;color:var(--t2);background:var(--s0);border:1px solid var(--ln);padding:0 4px;border-radius:4px}
.icrumb{ /* 深层 gate 面包屑 —— 纯文本 A › B › C，无盒 */
  font-size:12px;color:var(--t3);display:flex;gap:5px;align-items:center;flex-wrap:wrap;
}
.icrumb i{font-style:normal}
.icrumb b{color:var(--t2);font-weight:var(--w-md)}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.opt{ /* 细高 30px inline 按钮：hairline 边 + 安静文字 */
  font-size:12.5px;color:var(--t2);height:30px;
  border:1px solid var(--ln);border-radius:var(--r-ctl);padding:0 11px;
  background:transparent;transition:all var(--t-ui) var(--e);
}
.opt:hover{background:var(--hov);color:var(--t1);border-color:var(--ln-hi)}
.opt.danger{color:var(--fig);border-color:color-mix(in srgb,var(--fig) 35%,transparent)}
.opt.danger:hover{background:var(--fig-soft);border-color:color-mix(in srgb,var(--fig) 50%,transparent)}
.opt.solid{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.opt.solid:hover{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
/* 已裁决：短暂显示判定后移出列表 */
.verdict{display:none;font-size:12.5px;color:var(--ok);align-items:center;gap:6px;padding-top:2px}
.verdict::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.incard.res .desc,.incard.res .opts{display:none}
.incard.res .verdict{display:flex}
.incard.res.err .verdict{color:var(--fig)}
.incard.res.err .verdict::before{background:var(--fig)}
.incard.gone{opacity:0}

.fadein{animation:fade var(--t-med) var(--e)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar">
    <div class="sb-top"><button class="newtask" id="newBtn">+ 新任务</button></div>

    <div class="sb-scroll">
      <div class="sb-sec">进行中</div>
      <div id="runList"></div>

      <div class="sb-sec">已结束</div>
      <div id="settledList"></div>
    </div>
  </aside>

  <!-- ================= CENTER ================= -->
  <main id="center">
    <header class="th-head">
      <span class="crumb"><b id="thTitle">AICA 工作台</b></span>
      <span class="right">
        <button class="icon-btn" id="themeBtn" aria-label="切换主题">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </span>
    </header>

    <div class="thread-scroll" id="threadScroll"><div class="col-inner" id="colInner"></div></div>

    <div class="composer-zone">
      <div class="composer">
        <div class="c-input">
          <textarea id="cText" rows="1" placeholder="派发任务，或回复等待中的问题…"></textarea>
          <button class="send" id="sendBtn" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ================= RIGHT PANEL ================= -->
  <aside id="right">
    <div class="rp-tabs">
      <button class="rp-tab on" data-p="inbox">需要你 <span class="bdg" id="rpInboxBdg" hidden>0</span></button>
      <button class="rp-tab" data-p="arts">产物</button>
      <button class="rp-tab" data-p="subs">子代理</button>
    </div>
    <div class="rp-body">
      <div class="rp-cells" id="pane-inbox"></div>
      <div class="rp-pane" id="pane-arts" hidden><div id="artDock"></div></div>
      <div class="rp-pane" id="pane-subs" hidden><div id="subDock"></div></div>
    </div>

    <div class="rp-foot">
      <button class="dset" id="dset"><span id="dsetText">任务 · 标准 · flash-jailbreak · 高</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="dpop" id="dpop"></div>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden></aside>

<script>
"use strict";
/* ================= 活数据：GET /api/v1/view + SSE 触发刷新 ================= */
var RUNS = [];      /* [{id,title,status,dur,snippet,req,obj,sum,chips,tree,arts}] */
var INBOX = [];     /* [{id,t,d,crumb,opts,gate:{run,nm,pd,sn,id}}] */
var SETTLED = [];   /* [[标题, 时间]] */
var resolvedIds = {}; /* 本地已裁决、等下一次 view 校准的 inbox id */

var ST_LABEL = {working:"进行中", input:"等你回复", done:"已完成", queued:"排队中", dep:"等依赖", failed:"失败"};
var WB_LABEL = {"person:answer":"你的回复", "dependency":"上游子任务"};

var $ = function(s){ return document.querySelector(s); };
var each = function(sel, fn){ Array.prototype.forEach.call(document.querySelectorAll(sel), fn); };
/* 插值统一转义；inbox 的 d 字段是本地桥生成的受信 HTML（含 <code>），例外放行 */
var esc = function(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
};
var currentRun = 0;
var pendingSelectId = null;   /* 新派发的 run id：下次 view 拉取后选中它 */
var sheetTimer = 0;
var subsNd = null;   /* 子代理页签当前下钻到的节点（按 nm 在刷新后重定位） */

/* ---------- 拉取：首拉一次 + SSE change 300ms 防抖 + 断开回退 5s 轮询 ---------- */
var fetchTimer = null, pollTimer = null, es = null;
function scheduleFetch(){
  clearTimeout(fetchTimer);
  fetchTimer = setTimeout(fetchView, 300);
}
function fetchView(){
  return fetch("/api/v1/view", {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(applyView)
    .catch(function(){ /* 服务暂不可达：保留当前画面，等下一轮 */ });
}
function startPoll(){ if(!pollTimer) pollTimer = setInterval(fetchView, 5000); }
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function connectSSE(){
  try{ es = new EventSource("/api/stream"); }catch(e){ startPoll(); return; }
  es.onopen = function(){ stopPoll(); };
  es.onmessage = function(ev){
    try{
      var m = JSON.parse(ev.data);
      if(m && m.type === "change") scheduleFetch();
    }catch(e){}
  };
  es.onerror = function(){ startPoll(); };  /* EventSource 自带重连；重连成功 onopen 停轮询 */
}

/* ---------- view 应用：保选中 run（按 id）、保展开态、滤掉已裁决 ---------- */
function applyView(d){
  var prevId = (RUNS[currentRun]||{}).id;
  /* 记录各 run 的展开节点（nm 为键），刷新后恢复 */
  var openMap = {};
  RUNS.forEach(function(r){
    if(r.id==null) return;
    var s = {};
    (r.tree||[]).forEach(function(n){ if(n.open) s[n.nm]=1; });
    openMap[r.id] = s;
  });

  RUNS    = Array.isArray(d.runs)    ? d.runs    : [];
  INBOX   = (Array.isArray(d.inbox) ? d.inbox : []).filter(function(c){ return !(c && resolvedIds[c.id]); });
  SETTLED = Array.isArray(d.settled) ? d.settled : [];

  RUNS.forEach(function(r){
    if(!Array.isArray(r.tree))  r.tree  = [];
    if(!Array.isArray(r.chips)) r.chips = [];
    if(!Array.isArray(r.arts))  r.arts  = [];
    var s = openMap[r.id] || {};
    r.tree.forEach(function(n){ if(s[n.nm]) n.open = true; });
  });

  var idx = 0;
  if(pendingSelectId != null){
    for(var i=0;i<RUNS.length;i++){ if(RUNS[i].id===pendingSelectId){ idx=i; pendingSelectId=null; break; } }
  }else if(prevId != null){
    for(var i=0;i<RUNS.length;i++){ if(RUNS[i].id===prevId){ idx=i; break; } }
  }
  currentRun = RUNS.length ? Math.min(idx, RUNS.length-1) : 0;

  renderSidebar();
  renderInbox();
  renderRun(true);
  renderArts();
  /* 子代理页签：按 nm 重定位下钻节点，找不到回根层 */
  var tree = RUNS.length ? RUNS[currentRun].tree : [];
  renderSubs(subsNd ? findNode(tree, subsNd.nm) : null);
}

/* ================= theme toggle ================= */
$("#themeBtn").addEventListener("click",function(){
  var r = document.documentElement;
  var t = r.dataset.theme === "dark" ? "light" : "dark";
  r.dataset.theme = t;
  try{ localStorage.setItem("aica-v1-theme", t); }catch(e){}
});

/* ================= sidebar ================= */
function pillOf(st){
  if(st==="working") return '<span class="pill working"><i></i>进行中</span>';
  if(st==="input")   return '<span class="pill input"><i></i>等你回复</span>';
  if(st==="done")    return '<span class="pill"><i></i>已完成</span>';
  if(st==="failed")  return '<span class="pill failed"><i></i>失败</span>';
  return '<span class="pill"><i></i>空闲</span>';
}
function renderSidebar(){
  $("#runList").innerHTML = RUNS.length ? RUNS.map(function(r,i){
    return '<button class="run-card'+(i===currentRun?' on':'')+'" data-run="'+i+'">'+
      '<span class="r1">'+pillOf(r.status)+'<span class="dur num">'+esc(r.dur)+'</span></span>'+
      '<span class="ttl">'+esc(r.title)+'</span>'+
      '<span class="meta">'+esc(r.snippet)+'</span></button>';
  }).join("") : '<div class="empty-note">暂无运行中的任务</div>';
  $("#settledList").innerHTML = SETTLED.length ? SETTLED.map(function(s,i){
    return '<button class="set-row" data-s="'+i+'"><span class="t">'+esc(s[0])+'</span><span class="tm">'+esc(s[1])+'</span></button>';
  }).join("") : '<div class="empty-note">暂无记录</div>';
  each("#settledList .set-row",function(el){
    el.addEventListener("click",function(){ openSettled(SETTLED[+el.dataset.s]); });
  });
  each(".run-card",function(el){
    el.addEventListener("click",function(){ selectRun(+el.dataset.run); });
  });
}
/* 已结束 run → sheet 展示节点明细（只读） */
function openSettled(s){
  var id = s[2];
  if(!id) return;
  fetch("/api/runs/"+encodeURIComponent(id)+"/tree").then(function(r){return r.json();}).then(function(d){
    var nodes = d.nodes||[];
    openSheetFor({
      nm:s[0], st:"done",
      sum:"已完成 · "+(s[1]||""),
      steps:nodes.map(function(n){
        return {t:(n.finished_at||"").slice(11,19), a:n.nm||n.path, r:n.summary||n.status, st:n.status==="done"?"ok":"err"};
      })
    });
  }).catch(function(){});
}

/* ================= center: task view ================= */
function aclHtml(c){
  var s = c[0], g = s==="verified" ? "✓" : s==="failed" ? "×" : "○";
  return '<div class="acl" data-s="'+esc(s)+'"><span class="g">'+g+'</span><span class="tx">'+esc(c[1])+'</span></div>';
}
function stLabel(st){ return ST_LABEL[st]||""; }
function stWord(n){
  if(n.st==="input") return '<span class="tn-st await">等你回复</span>';
  var t = stLabel(n.st);
  if(n.el) t += " · "+n.el;
  return '<span class="tn-st">'+esc(t)+'</span>';
}
/* 行 = 选中 / 展开下级；› = 详情；点 = 就地展开（中栏与页签共用一套） */
function tnodeHtml(n, last, lvl, has){
  lvl = lvl || n.l;
  return '<div class="tnode l'+lvl+(last?" last":"")+'" data-nm="'+esc(n.nm)+'">'+
    '<button class="tn-row"><span class="dot '+esc(n.st)+(has?' x':'')+'"></span>'+
    '<span class="tn-main"><span class="tn-t"><span class="nm">'+esc(n.nm)+'</span></span>'+
    '<span class="tn-d">'+esc(n.d||"")+'</span></span>'+stWord(n)+'</button>'+
    '<button class="tn-go" aria-label="查看详情">'+CHEV+'</button></div>';
}
/* 递归渲染：展开状态的节点把子代理挂在行下，父级脊线用 kid-grp 延续 */
function grpHtml(tree,kids,lvl){
  var out="";
  kids.forEach(function(n,i){
    var ks=kidsOf(tree,n), last=i===kids.length-1;
    out+=tnodeHtml(n,last,lvl,ks.length>0);
    if(n.open&&ks.length){
      out+='<div class="kid-grp'+(last?'':' cont')+'" style="--px:'+(16+(lvl-3)*26)+'px">'+grpHtml(tree,ks,lvl+1)+'</div>';
    }
  });
  return out;
}
function renderRun(silent){
  var r = RUNS[currentRun];
  var ci = $("#colInner");
  if(!r){ /* 空态：无 run 时中栏安静提示 */
    $("#thTitle").textContent = "AICA 工作台";
    ci.innerHTML = '<div class="empty-note">暂无运行中的任务</div>';
    return;
  }
  $("#thTitle").textContent = r.title || "(未命名任务)";

  var h = "";
  if(r.req) h += '<div class="urow"><div class="ububble">'+esc(r.req)+'</div></div>';
  if(r.sum) h += '<div class="atext">'+esc(r.sum)+'</div>';

  /* 根卡 = 目标 + 验收清单；每个验收条目下挂着为它派出的子代理 */
  h += '<div class="root-card">'+
       '<div class="root-title">'+esc(r.title||"")+'</div><p class="root-obj">'+esc(r.obj||"")+'</p>';
  if(r.chips.length){
    h += '<div class="acl-list" id="tree">'+r.chips.map(function(c,i){
        var kids = r.tree.filter(function(n){ return n.acl===i; });
        return '<div class="acl-grp">'+aclHtml(c)+grpHtml(r.tree,kids,3)+'</div>';
      }).join("")+'</div>';
  }else if(r.tree.length){
    /* 无验收清单时退化：树整体挂进根卡 */
    h += '<div class="acl-list" id="tree"><div class="acl-grp">'+
         grpHtml(r.tree, r.tree.filter(function(n){ return n.l==null||n.l===2; }), 3)+'</div></div>';
  }
  h += '</div>';

  /* thinking 指示：working = 3 clay dots 动画；input = 静置等待行 */
  if(r.status==="working"){
    h += '<div class="think"><span class="td"><i></i><i></i><i></i></span><span class="tk">思考中 · 正在归纳子节点结论…</span></div>';
  }else if(r.status==="input"){
    h += '<div class="think"><span class="td still"><i></i><i></i><i></i></span><span class="tk">已暂停 · 等你裁决后继续</span></div>';
  }

  var ts = $("#threadScroll");
  var atBottom = ts.scrollHeight - ts.scrollTop - ts.clientHeight < 40;
  var oldTop = ts.scrollTop;
  ci.innerHTML = h;
  if(!silent){ ci.classList.remove("fadein"); void ci.offsetWidth; ci.classList.add("fadein"); }
  else{ ts.scrollTop = atBottom ? ts.scrollHeight : oldTop; }  /* 静默刷新不打扰阅读位置 */
  /* 点 = 就地展开/收起；行主体：有下级 → 选中 + 下钻页签；叶子 → 详情。› = 详情 */
  each("#tree .tn-row",function(el){
    el.addEventListener("click",function(e){
      var n = findNode(RUNS[currentRun].tree, el.parentElement.dataset.nm);
      if(!n) return;
      if(e.target.closest(".dot.x")){ n.open = !n.open; renderRun(true); return; }
      each("#tree .tnode",function(x){ x.classList.remove("sel"); });
      el.parentElement.classList.add("sel");
      if(kidsOf(RUNS[currentRun].tree,n).length){ renderSubs(n); switchPane("subs"); }
      else{ openSheetFor(n); }
    });
  });
  each("#tree .tn-go",function(el){
    el.addEventListener("click",function(e){
      e.stopPropagation();
      var n = findNode(RUNS[currentRun].tree, el.parentElement.dataset.nm);
      if(n) openSheetFor(n);
    });
  });
}
function selectRun(i){
  currentRun = i;
  subsNd = null;
  each(".run-card",function(el){ el.classList.toggle("on", +el.dataset.run===i); });
  renderRun();
  renderArts();
  renderSubs(null);
}

/* 树是扁平列表，层级由 l 表达 */
function findNode(list,nm){
  list = list||[];
  for(var i=0;i<list.length;i++) if(list[i].nm===nm) return list[i];
  return null;
}
function parentOf(list,n){
  for(var i=list.indexOf(n)-1;i>=0;i--) if(list[i].l===n.l-1) return list[i];
  return null;
}
function kidsOf(list,parent){
  if(!parent) return list.filter(function(n){ return n.l===2; });
  var kids=[];
  for(var i=list.indexOf(parent)+1;i<list.length && list[i].l>parent.l;i++){
    if(list[i].l===parent.l+1) kids.push(list[i]);
  }
  return kids;
}

/* 子代理页 —— 节点自己的小结 + 执行过程 + 产出；产物预览也住这里 */
var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
function artOf(fn){
  var r = RUNS[currentRun];
  return r ? r.arts.filter(function(a){ return a.fn===fn; })[0] : null;
}
function nodeSum(n){ return n.sum || {queued:"尚未开始。", dep:"在等上游子任务完成。"}[n.st] || ""; }
/* 节点在服务端的路径：优先显式字段，退回 nm（route 段逐个 encode） */
function nodePathOf(n){
  if(!n) return null;
  return n.path || n.p || n.np || n.nm || null;
}
function encPath(p){ return String(p).split("/").map(encodeURIComponent).join("/"); }
function stepHtml(s){
  var g = s.st==="ok" ? "✓" : s.st==="err" ? "×" : "<i></i>";
  var row = '<span class="sg">'+g+'</span>'+
    '<span class="sa"><b>'+esc(s.a)+'</b>'+(s.r?'<span>'+esc(s.r)+'</span>':"")+'</span>'+
    '<span class="tm num">'+esc(s.t)+'</span>';
  return '<li class="stp" data-s="'+esc(s.st)+'">'+(s.out
    ? '<button class="stp-h">'+row+CHEV+'</button><pre class="sh-log stp-out">'+esc(s.out)+'</pre>'
    : '<div class="stp-h">'+row+'<span class="chev"></span></div>')+'</li>';
}
/* 产物真实文本：GET /api/runs/<run>/node/<nodePath>/artifact/<name> → 填进 .sh-log */
function loadArtifact(a, node){
  var el = $("#shArt");
  if(!el) return;
  var run = RUNS[currentRun] || {};
  var np = a.path || a.p || a.node || nodePathOf(node);
  if(!run.id || !np || !a.fn){
    el.textContent = "（无法定位产物文件）";
    return;
  }
  el.textContent = "载入中…";
  fetch("/api/runs/"+encodeURIComponent(run.id)+"/node/"+encPath(np)+"/artifact/"+encodeURIComponent(a.fn),
        {cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(t){ var e2=$("#shArt"); if(e2) e2.textContent = t; })
    .catch(function(){ var e2=$("#shArt"); if(e2) e2.textContent = "（读取失败：服务端未找到该产物）"; });
}
function openSheetFor(n, from){
  var isArt = !!(n.fn && !n.nm), body;
  var meta = isArt ? esc(n.sz||"")
    : '<span class="dot '+esc(n.st)+'"></span>'+esc([stLabel(n.st), n.el, n.wb&&WB_LABEL[n.wb] ? "等"+WB_LABEL[n.wb] : ""].filter(Boolean).join(" · "));
  if(isArt){
    if(n.pv) body = n.pv;                                             /* 服务端若给预览片段直接用 */
    else if(n.body!=null) body = '<pre class="sh-log">'+esc(n.body)+'</pre>';
    else body = '<pre class="sh-log" id="shArt"></pre>';              /* 否则走后端 artifact 接口 */
  }else{
    body = '<p class="sh-sum">'+esc(nodeSum(n))+'</p>';
    if(Array.isArray(n.steps) && n.steps.length) body += '<div class="sh-sec">执行过程</div><ol class="steps">'+n.steps.map(stepHtml).join("")+'</ol>';
    if(Array.isArray(n.out) && n.out.length) body += '<div class="sh-sec">产出</div>'+n.out.map(function(fn){
      return '<button class="artl" data-fn="'+esc(fn)+'"><span class="fn">'+esc(fn)+'</span><span class="sz">'+esc((artOf(fn)||{}).sz||"")+'</span></button>';
    }).join("");
  }
  var act = isArt ? '<button class="opt solid" id="shOpen">打开</button>'
    : n.st==="input" ? '<button class="opt solid" id="shGo">在需要你中处理</button>' : "";
  $("#sheet").innerHTML =
    '<div class="sh-h"><div class="sh-tt">'+
      (from?'<button class="sh-back" id="shBack">‹ '+esc(from.nm||from.fn)+'</button>':"")+
      '<div class="sh-t">'+esc(n.nm||n.fn)+'</div><div class="sh-meta">'+meta+'</div></div>'+
    '<button class="icon-btn" id="shX" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>'+
    '<div class="sh-b">'+body+(act?'<div class="sh-act">'+act+'</div>':"")+'</div>';
  clearTimeout(sheetTimer);
  $("#scrim").hidden = false; $("#sheet").hidden = false;
  void $("#sheet").offsetWidth;   /* reflow：让进场过渡从 translateX/opacity 起点播起 */
  $("#sheet").classList.add("open");
  $("#shX").addEventListener("click",closeSheet);
  each("#sheet button.stp-h",function(el){
    el.addEventListener("click",function(){ el.parentElement.classList.toggle("open"); });
  });
  each("#sheet .artl[data-fn]",function(el){
    el.addEventListener("click",function(){
      /* out 文件名 → 真实 artifact；run 级 arts 里有同名条目则带上其 sz/body */
      var known = artOf(el.dataset.fn) || {};
      openSheetFor({fn:el.dataset.fn, sz:known.sz||"", body:known.body, pv:known.pv, path:known.path||known.p||known.node}, n);
    });
  });
  if(isArt && n.body==null && !n.pv) loadArtifact(n, from);
  var bk=$("#shBack"); if(bk) bk.addEventListener("click",function(){ openSheetFor(from); });
  var go=$("#shGo"); if(go) go.addEventListener("click",function(){ closeSheet(); focusGate(n.nm); });
  var so=$("#shOpen"); if(so) so.addEventListener("click",function(){ so.textContent="已交给系统打开"; });
}
function closeSheet(){
  if($("#sheet").hidden) return;
  $("#sheet").classList.remove("open"); $("#scrim").hidden = true;
  each("#tree .tnode.sel",function(x){ x.classList.remove("sel"); });
  sheetTimer = setTimeout(function(){ $("#sheet").hidden = true; },240);
}
$("#scrim").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ closeSheet(); $("#dpop").classList.remove("open"); } });

/* ================= 右栏三区：需要你 / 产物 / 子代理 ================= */
function switchPane(p){
  each(".rp-tab",function(t){ t.classList.toggle("on", t.dataset.p===p); });
  $("#pane-inbox").hidden = p!=="inbox";
  $("#pane-arts").hidden  = p!=="arts";
  $("#pane-subs").hidden  = p!=="subs";
}
each(".rp-tab",function(t){
  t.addEventListener("click",function(){ switchPane(t.dataset.p); });
});
function renderArts(){
  var r = RUNS[currentRun];
  var arts = r ? r.arts : [];
  $("#artDock").innerHTML = arts.length ? arts.map(function(a,i){
    return '<button class="artl" data-a="'+i+'"><span class="fn">'+esc(a.fn)+'</span><span class="sz">'+esc(a.sz)+'</span></button>';
  }).join("") : '<div class="empty-note">暂无产物</div>';
  each("#artDock .artl",function(el){
    el.addEventListener("click",function(){ openSheetFor(arts[+el.dataset.a]); });
  });
}
/* 子代理页签：默认显示根任务的直属子代理（L2）；点节点下钻，返回上一级 */
function renderSubs(nd){
  var r = RUNS[currentRun];
  var tree = r ? r.tree : [];
  subsNd = nd;
  var kids = kidsOf(tree, nd);
  var lvl = Math.min(3, (nd?nd.l:1)+1);
  var head = nd ? '<button class="sub-back" id="subBack">‹ '+esc(nd.nm)+' 的下级</button>' : '';
  $("#subDock").innerHTML = head + (kids.length ? kids.map(function(k,i){
    return tnodeHtml(k, nd && i===kids.length-1, lvl, kidsOf(tree,k).length>0);
  }).join("") : '<div class="empty-note">无下级子代理</div>');
  each("#subDock .tn-row",function(el){
    el.addEventListener("click",function(){ var k = findNode(kids, el.parentElement.dataset.nm);
      if(!k) return;
      if(kidsOf(tree,k).length){ renderSubs(k); }else{ openSheetFor(k); } });
  });
  each("#subDock .tn-go",function(el){
    el.addEventListener("click",function(e){ e.stopPropagation();
      var k = findNode(kids, el.parentElement.dataset.nm); if(k) openSheetFor(k); });
  });
  var bk=$("#subBack"); if(bk) bk.addEventListener("click",function(){ renderSubs(parentOf(tree, nd)); });
}

/* ================= inbox ================= */
function inboxLeft(){ return INBOX.filter(function(c){ return !c.done; }).length; }
function renderBadge(){
  var n = inboxLeft(), b = $("#rpInboxBdg");
  b.textContent = n; b.hidden = n===0;
}
function renderInbox(){
  $("#pane-inbox").innerHTML = INBOX.length ? INBOX.map(function(c){
    var h = '<article class="incard" id="'+esc(c.id)+'">';
    if(c.crumb) h += '<div class="icrumb">'+(c.crumb||[]).map(function(x,i){return (i?'<i>›</i>':'')+(i===c.crumb.length-1?'<b>'+esc(x)+'</b>':esc(x));}).join("")+'</div>';
    h += '<h3>'+esc(c.t)+'</h3>';
    h += '<p class="desc">'+(c.d||"")+'</p>';   /* d：本地桥受信 HTML（含 <code>） */
    h += '<div class="opts">'+(c.opts||[]).map(function(o){
      var kind = {"danger":1,"solid":1}[o[1]] ? o[1] : "";
      return '<button class="opt '+kind+'" data-v="'+esc(o[2])+'" data-l="'+esc(o[0])+'">'+esc(o[0])+'</button>';
    }).join("")+'</div>';
    h += '<div class="verdict"></div></article>';
    return h;
  }).join("") : '<div class="empty-note">没有需要你处理的事</div>';
  each("#pane-inbox .opt",function(el){
    el.addEventListener("click",function(){ resolveCard(el.closest(".incard"), el.dataset.v, el.dataset.l); });
  });
  renderBadge();
}
/* gate.id 形如 node:<root>/<path> → {run, path}；缺 id 时退回 run 下标 + 树节点路径 */
function replyRef(c){
  var g = c && c.gate;
  if(!g) return null;
  if(g.id){
    var m = String(g.id).match(/^node:([^/]+)\/(.+)$/);
    if(m) return {run:m[1], path:m[2]};
  }
  var r = RUNS[g.run];
  if(!r || r.id==null) return null;
  var n = findNode(r.tree, g.nm);
  var np = nodePathOf(n);
  return np ? {run:r.id, path:np} : null;
}
function resolveCard(card, verdict, label){
  var c = INBOX.filter(function(x){ return x.id===card.id; })[0];
  if(!c || c.done || c.pending) return;
  /* 本地移出列表 + 既有动效（1.5s 后 gone） */
  var settle = function(){
    c.done = true;
    resolvedIds[c.id] = 1;
    card.classList.add("res");
    card.querySelector(".verdict").textContent = verdict;
    renderBadge();
    if(c.gate) resolveGate(c.gate);
    /* 下一张未决卡闪一下；判定显示片刻后移出列表 */
    var nxt = document.querySelector("#pane-inbox .incard:not(.res)");
    if(nxt){ nxt.classList.remove("flash"); void nxt.offsetWidth; nxt.classList.add("flash"); }
    setTimeout(function(){ card.classList.add("gone"); },1400);
    setTimeout(function(){ INBOX = INBOX.filter(function(x){ return x!==c; }); renderInbox(); },1600);
  };
  var fail = function(){
    c.pending = false;
    card.classList.add("res","err");
    var v = card.querySelector(".verdict");
    v.textContent = "提交失败 · 请重试";
    setTimeout(function(){ card.classList.remove("res","err"); },1600);
  };
  var ref = replyRef(c);
  if(!ref){ settle(); return; }   /* 无 gate 的卡（纯通知类）就地裁决 */
  c.pending = true;
  fetch("/api/runs/"+encodeURIComponent(ref.run)+"/node/"+encPath(ref.path)+"/reply",
        {method:"POST", headers:{"content-type":"application/json"},
         body:JSON.stringify({text:String(label||verdict||"")})})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(){ c.pending=false; settle(); scheduleFetch(); })
    .catch(fail);
}
/* 深层 gate 解除 → 节点、祖先、任务状态全部从数据重算（乐观更新，下次 view 校准） */
function resolveGate(g){
  var r = RUNS[g.run];
  if(!r) return;
  var n = findNode(r.tree, g.nm);
  var settle = function(x, step){
    (x.steps||[]).forEach(function(s){ if(s.st==="wait") s.st = "ok"; });
    x.steps = (x.steps||[]).concat([step]);
  };
  if(n){
    n.st = "working"; n.d = "已回复 · 恢复执行"; delete n.wb;
    n.sum = nodeSum(n)+"你已回复，已恢复执行。";
    settle(n, {t:"刚刚", a:"收到你的回复", r:"恢复执行", st:"run"});
    var p = parentOf(r.tree, n);
    if(p){
      if(p.st==="input") p.st = "working";
      p.d = g.pd;
      settle(p, {t:"刚刚", a:"子任务「"+n.nm+"」恢复执行", st:"ok"});
    }
  }
  if(!r.tree.some(function(x){ return x.st==="input"; })) r.status = "working";
  r.snippet = g.sn || r.snippet;
  renderSidebar();
  if(currentRun===g.run){ renderRun(true); renderSubs(null); }
}
function focusGate(nm){
  switchPane("inbox");
  var c = INBOX.filter(function(x){ return x.gate && x.gate.nm===nm && !x.done; })[0];
  var el = c && document.getElementById(c.id);
  if(el){ el.scrollIntoView({block:"nearest"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}

/* ================= 底部拨盘 ================= */
/* 单一拨盘：dset 文本触发 → dpop 向上弹层，行内循环 */
var DIALS = [
  ["模式",["任务","提问","场景"]],
  ["权限",["标准","受限","开放"]],
  ["模型",["opencode-pool/deepseek-v4.1-flash-jailbreak","opencode-pool/deepseek-v4.1-flash","opencode-pool/deepseek-v4.1-flash-nsfw"]],
  ["推理",["低","中","高"]]
];
var dsel = [0,0,0,0];
function dialText(s){ return s.indexOf("/")<0 ? s : s.split("/").pop().replace(/^deepseek-v4\.1-/,""); }
try{
  var saved = JSON.parse(localStorage.getItem("aica-v1-dials-2")||"null");
  if(Array.isArray(saved) && saved.length===DIALS.length &&
     saved.every(function(v,i){ return v>=0 && v<DIALS[i][1].length; })) dsel = saved;
}catch(e){}
function renderDset(){
  $("#dsetText").textContent = DIALS.map(function(d,i){ return dialText(d[1][dsel[i]]); }).join(" · ");
  $("#dset").classList.toggle("warn", dsel[1]!==0);   /* 权限 ≠ 标准 → warn tint */
}
$("#dpop").innerHTML = DIALS.map(function(d,i){
  return '<button class="dpr" data-d="'+i+'"><span class="dk">'+d[0]+'</span><span class="dv">'+dialText(d[1][dsel[i]])+'</span></button>';
}).join("");
$("#dset").addEventListener("click",function(e){
  e.stopPropagation();
  $("#dpop").classList.toggle("open");
});
each(".dpr",function(el){
  el.addEventListener("click",function(e){
    e.stopPropagation();
    var i = +el.dataset.d;
    dsel[i] = (dsel[i]+1) % DIALS[i][1].length;
    el.querySelector(".dv").textContent = dialText(DIALS[i][1][dsel[i]]);
    try{ localStorage.setItem("aica-v1-dials-2", JSON.stringify(dsel)); }catch(e2){}
    renderDset();   /* 弹层保持打开 */
  });
});
document.addEventListener("click",function(e){
  if(!e.target.closest(".dpop") && !e.target.closest("#dset")){
    $("#dpop").classList.remove("open");
  }
});

/* ================= composer ================= */
/* textarea autogrow（封顶 110px） + Enter 发送；发送 = POST /api/tasks */
var cText = $("#cText");
cText.addEventListener("input",function(){
  cText.style.height = "auto";
  cText.style.height = Math.min(cText.scrollHeight,110)+"px";
});
$("#sendBtn").addEventListener("click",function(){
  var v = cText.value.trim();
  if(!v){ cText.focus(); return; }
  var ci = $("#colInner");
  var div = document.createElement("div");
  div.className = "urow";
  div.innerHTML = '<div class="ububble"></div>';
  div.querySelector(".ububble").textContent = v;
  ci.appendChild(div);
  cText.value = "";
  cText.style.height = "";
  $("#threadScroll").scrollTop = $("#threadScroll").scrollHeight;
  fetch("/api/tasks", {method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({
      goal:v,
      kind:DIALS[0][1][dsel[0]],    /* 模式 */
      agent:"pi",
      model:DIALS[2][1][dsel[2]],   /* 模型 */
      tools:DIALS[1][1][dsel[1]],   /* 权限 → tools */
      budget:DIALS[3][1][dsel[3]]   /* 推理 → budget */
    })})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){ if(d&&d.root_id) pendingSelectId=d.root_id; scheduleFetch(); })
    .catch(function(e){
      var ack = document.createElement("div");
      ack.className = "atext";
      ack.textContent = "发送失败：" + (e && e.message ? e.message : e);
      ci.appendChild(ack);
      $("#threadScroll").scrollTop = $("#threadScroll").scrollHeight;
    });
});
cText.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("#sendBtn").click(); }
});
$("#newBtn").addEventListener("click",function(){ cText.focus(); });

/* ================= boot ================= */
renderSidebar();
renderInbox();
renderRun(true);
renderArts();
renderSubs(null);
renderDset();
fetchView();
connectSSE();
</script>
