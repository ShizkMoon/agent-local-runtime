/* gate.id 形如 node:<root>/<path> → {run, path}；缺 id 时退回 run 下标 + 树节点路径 */
function replyRef(c){
  var g = c && c.gate;
  if(!g) return null;
  if(g.id){
    var m = String(g.id).match(/^node:([^/]+)\/(.+)$/);
    if(m) return {run:m[1], path:m[2]};
  }
  var r = RUNS[g.run];
  if(!r || r.id==null) return null;
  var n = findNode(r.tree, g.nm);
  var np = nodePathOf(n);
  return np ? {run:r.id, path:np} : null;
}
function resolveCard(card, verdict, label){
  var c = INBOX.filter(function(x){ return x.id===card.id; })[0];
  if(!c || c.done || c.pending) return;
  /* 本地移出列表 + 既有动效（1.5s 后 gone） */
  var settle = function(){
    c.done = true;
    resolvedIds[c.id] = 1;
    resolvedCount += 1;   /* 右栏空态："N 条历史裁决已折叠" */
    card.classList.add("res");
    card.querySelector(".verdict").textContent = verdict;
    renderBadge();
    if(c.gate) resolveGate(c.gate);
    /* 下一张未决卡闪一下；判定显示片刻后移出列表 */
    var nxt = document.querySelector("#pane-inbox .incard:not(.res)");
    if(nxt){ nxt.classList.remove("flash"); void nxt.offsetWidth; nxt.classList.add("flash"); }
    setTimeout(function(){ card.classList.add("gone"); },1400);
    setTimeout(function(){ INBOX = INBOX.filter(function(x){ return x!==c; }); renderInbox(); },1600);
  };
  var fail = function(){
    c.pending = false;
    card.classList.add("res","err");
    var v = card.querySelector(".verdict");
    v.textContent = "提交失败 · 请重试";
    setTimeout(function(){ card.classList.remove("res","err"); },1600);
  };
  var ref = replyRef(c);
  if(!ref){ settle(); return; }   /* 无 gate 的卡（纯通知类）就地裁决 */
  c.pending = true;
  fetch("/api/runs/"+encodeURIComponent(ref.run)+"/node/"+encPath(ref.path)+"/reply",
        {method:"POST", headers:{"content-type":"application/json"},
         body:JSON.stringify({text:String(label||verdict||"")})})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(){ c.pending=false; settle(); scheduleFetch(); })
    .catch(fail);
}
/* S19：审批裁决 → POST .../approve（decision 落闭集；remember 由桥按 gate-req.opts 复核，伪造无效） */
function decideApproval(card, c, body, label){
  if(!c || c.done || c.pending) return;
  var a = c.ap;
  var verdict = label || (body.decision === "allowed-once"
    ? (body.remember ? "已记住这类资源" : "已允许一次")
    : body.decision === "rejected" ? "已拒绝" : "已取消");
  c.pending = true;
  fetch("/api/runs/"+encodeURIComponent(a.run)+"/node/"+encPath(a.path)+"/approve",
        {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      c.pending = false; c.done = true; resolvedIds[c.id] = 1; resolvedCount += 1;
      APPROVALS = APPROVALS.filter(function(x){ return x.id !== c.id; });
      if(card){
        card.classList.add("res");
        var v = card.querySelector(".verdict");
        if(v) v.textContent = (d && d.remember) ? "已记住这类资源" : verdict;
        setTimeout(function(){ card.classList.add("gone"); }, 900);
      }
      renderBadge();
      setTimeout(function(){
        INBOX = INBOX.filter(function(x){ return x.id !== c.id; });
        renderInbox(); syncComposer();
      }, 1100);
      scheduleFetch();
    })
    .catch(function(){
      c.pending = false;
      if(card){
        card.classList.add("res","err");
        var v = card.querySelector(".verdict");
        if(v) v.textContent = "提交失败 · 请重试";
        setTimeout(function(){ card.classList.remove("res","err"); }, 1600);
      }
    });
}
/* S19 composer：挂起时输入 = 拒绝 + 说明原因（写 gate-ans），不是新消息 */
function rejectViaComposer(a, text){
  if(Date.now() < approveArmAt) return;   /* 卡出现 500ms 内 Enter 不生效（防误批） */
  var c = INBOX.filter(function(x){ return x.id === a.id; })[0];
  decideApproval(document.getElementById(a.id), c,
    text ? {decision:"rejected", feedback:text} : {decision:"rejected"},
    text ? "已拒绝，并回注说明" : "已拒绝");
}

/* 深层 gate 解除 → 节点、祖先、任务状态全部从数据重算（乐观更新，下次 view 校准） */
function resolveGate(g){
  var r = RUNS[g.run];
  if(!r) return;
  var n = findNode(r.tree, g.nm);
  var settle = function(x, step){
    (x.steps||[]).forEach(function(s){ if(s.st==="wait") s.st = "ok"; });
    x.steps = (x.steps||[]).concat([step]);
  };
  if(n){
    n.st = "working"; n.d = "已回复 · 恢复执行"; delete n.wb;
    n.sum = nodeSum(n)+"你已回复，已恢复执行。";
    settle(n, {t:"刚刚", a:"收到你的回复", r:"恢复执行", st:"run"});
    var p = parentOf(r.tree, n);
    if(p){
      if(p.st==="input") p.st = "working";
      p.d = g.pd;
      settle(p, {t:"刚刚", a:"子任务「"+n.nm+"」恢复执行", st:"ok"});
    }
  }
  if(!r.tree.some(function(x){ return x.st==="input"; })){ r.status = "working"; if(r.agg==="blocked") r.agg = "working"; }
  r.snippet = g.sn || r.snippet;
  renderSidebar();
  if(currentRun===g.run){ renderRun(true); renderSubs(null); }
}

var openDiffs = {};   /* runId|file → 1：静默刷新后展开态不塌 */

function diffCls(l){
  if(/^(\+\+\+|---|@@)/.test(l)) return "ln-hd";
  if(/^\+/.test(l)) return "ln-add";
  if(/^-/.test(l)) return "ln-del";
  return "";

function diffsHtml(r){

      bodyHtml = '<div class="dff-note">事件里只有文件级统计（+'+d.add+' −'+d.del+'），没有 diff 正文 —— 不补造行内容。</div>';

}

/* ================= S26：健康页 + 诊断包 ================= */
var hpTrigger = null;
function openHealth(trigger){
  hpTrigger = trigger || document.activeElement;
  var el = $("#health"); if(!el) return;
  el.hidden = false;
  renderHealth();
  setTimeout(function(){ var b = $("#hpClose"); if(b) b.focus(); }, 0);
}
function closeHealth(){
  var el = $("#health"); if(!el || el.hidden) return;
  el.hidden = true;
  try{ if(hpTrigger && hpTrigger.focus) hpTrigger.focus(); }catch(e){}
}
function renderHealth(){
  var body = $("#hpBody"); if(!body) return;
  body.innerHTML = '<div class="hint">读取中…</div>';
  fetch("/api/health").then(function(r){ return r.json(); }).then(function(d){
    var dl = function(k,v){ return '<dt>'+esc(k)+'</dt><dd>'+esc(String(v))+'</dd>'; };
    var dm = d.daemon || {};
    var errs = (d.errors||[]).length
      ? '<ul class="hp-err">'+d.errors.map(function(e){ return '<li>'+esc((e.at||"")+"  "+e.event+"  "+e.detail)+'</li>'; }).join("")+'</ul>'
      : '<div class="hint">没有最近的错误记录</div>';
    body.innerHTML = '<dl class="hp-grid">'+
      dl("版本", (d.version||"?")+"  ·  node "+(d.node||"?"))+
      dl("端口", d.port)+
      dl("桥", "pid "+d.pid+" · 已运行 "+d.uptime_s+"s · RSS "+d.rss_mb+" MB")+
      dl("daemon", (dm.running?"在跑":"没在跑")+(dm.pid?" · pid "+dm.pid:"")+(dm.heartbeat_age_ms!=null?" · 心跳 "+Math.round(dm.heartbeat_age_ms/1000)+"s 前":""))+
      dl("state", (d.state||{}).dir)+
      dl("runs", (d.state||{}).runs+" 个（进行 "+(d.state||{}).active+" · 完成 "+(d.state||{}).done+" · 失败 "+(d.state||{}).failed+"）")+
      dl("磁盘", (d.disk && d.disk.free_gb!=null ? "剩 "+d.disk.free_gb+" GB / 共 "+d.disk.total_gb+" GB" : "未知"))+
      dl("视图缓存", "命中 "+(d.view_cache||{}).hits+" · 未命中 "+(d.view_cache||{}).misses+" · 条目 "+(d.view_cache||{}).size)+
      '</dl><div class="sh-sec">最近错误</div>'+errs;
    var t = $("#hpTime"); if(t) t.textContent = new Date().toLocaleTimeString();
  }).catch(function(e){
    body.innerHTML = '<div class="hint">健康检查失败：'+esc(String(e))+'</div>';
  });
}
function copyDiag(){
  var btn = $("#hpDiag"); if(!btn) return;
  var rid = (RUNS[currentRun]||{}).id || "";
  btn.disabled = true;
  fetch("/api/diag" + (rid ? "?run="+encodeURIComponent(rid) : "")).then(function(r){ return r.text(); }).then(function(txt){
    var done = function(ok){
      btn.disabled = false;
      btn.textContent = ok ? "已复制 ✓" : "复制失败（已弹窗）";
      setTimeout(function(){ btn.textContent = "复制诊断包"; }, 1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ try{ window.prompt("复制诊断包", txt.slice(0,4000)); }catch(e){} done(false); });
    }else{
      try{ window.prompt("复制诊断包", txt.slice(0,4000)); }catch(e){}
      done(false);
    }
  }).catch(function(){ btn.disabled = false; btn.textContent = "复制诊断包"; });
}

/* ================= S24：命令面板 + 快捷键 ================= */
var palOpen = false, palItems = [], palSel = 0, palTrigger = null;
function focusFirstApproval(){
  var card = document.querySelector("#pane-inbox .incard:not(.res):not(.gone):not(.propcard)");
  if(!card) return false;
  try{ switchPane("inbox"); }catch(e){}
  var b = card.querySelector("button.opt");
  if(b){ b.focus(); try{ b.scrollIntoView({block:"center"}); }catch(e){} }
  return true;
}
function palActions(){
  var acts = [];
  RUNS.forEach(function(r,i){
    acts.push({ label:"打开任务："+(r.title||r.id), sub:(r.agg||r.status||""), go:function(){ selectRun(i); } });
  });
  acts.push({ label:"信息密度：切换详细 / 紧凑（当前："+(VERB==="compact"?"紧凑":"详细")+"）", sub:"V", go:function(){ var b=$("#vbBtn"); if(b) b.click(); } });
  acts.push({ label:"打开首个待裁决项", sub:"A", go:function(){ if(!focusFirstApproval()) toast("当前没有待裁决项"); } });
  acts.push({ label:"右栏：提案页签", sub:"R3", go:function(){ switchPane("props"); } });
  acts.push({ label:"右栏：子代理页签", sub:"R3", go:function(){ switchPane("subs"); renderSubs(subsNd); } });
  acts.push({ label:"派发新任务（聚焦输入框）", sub:"/", go:function(){ var c=$("#cText"); if(c) c.focus(); } });
  acts.push({ label:"健康检查 / 诊断包", sub:"D", go:function(){ openHealth($("#palBtn")); } });
  return acts;
}
function renderPalette(q){
  var all = palActions();
  var qq = String(q||"").trim().toLowerCase();
  palItems = qq ? all.filter(function(it){ return (it.label+" "+(it.sub||"")).toLowerCase().indexOf(qq) >= 0; }) : all;
  if(palSel >= palItems.length) palSel = Math.max(0, palItems.length-1);
  var list = $("#palList"); if(!list) return;
  list.innerHTML = palItems.length
    ? palItems.map(function(it,i){
        return '<div class="pal-it'+(i===palSel?" sel":"")+'" data-i="'+i+'"><span>'+esc(it.label)+'</span>'+(it.sub?'<span class="k">'+esc(it.sub)+'</span>':"")+'</div>';
      }).join("")
    : '<div class="pal-it">没有匹配的命令</div>';
  each("#palList .pal-it", function(el){
    el.addEventListener("click", function(){ var i = +el.dataset.i; if(!isNaN(i)) runPalItem(palItems[i]); });
  });
}
function openPalette(trigger){
  palTrigger = trigger || document.activeElement;
  var el = $("#pal"); if(!el) return;
  el.hidden = false; palOpen = true; palSel = 0;
  var inp = $("#palIn"); if(inp) inp.value = "";
  renderPalette("");
  setTimeout(function(){ if(inp) inp.focus(); }, 0);
}
function closePalette(){
  var el = $("#pal"); if(!el || el.hidden) return;
  el.hidden = true; palOpen = false;
  try{ if(palTrigger && palTrigger.focus) palTrigger.focus(); }catch(e){}
}
function runPalItem(it){
  if(!it) return;
  closePalette();
  try{ it.go(); }catch(e){ toast("执行失败："+String(e).slice(0,80)); }
}
function moveRun(d){
  if(!RUNS.length) return;
  var i = (currentRun + d + RUNS.length) % RUNS.length;
  selectRun(i);
}
function doFirstApproval(kind){
  var el = document.querySelector("#pane-inbox .incard:not(.res):not(.gone):not(.propcard)");
  if(!el){ toast("当前没有待裁决项"); return; }
  var btns = el.querySelectorAll("button.opt");
  if(!btns.length) return;
  var target = null;
  Array.prototype.forEach.call(btns, function(b){
    var t = b.textContent || "";
    if(kind === "allow" && !target && /允许一次/.test(t)) target = b;
    if(kind === "reject" && !target && /拒绝/.test(t)) target = b;
  });
  if(!target) target = btns[kind === "allow" ? 0 : btns.length-1];
  target.click();
}
function toast(msg){
  var el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.classList.add("out"); }, 1200);
  setTimeout(function(){ try{ el.remove(); }catch(e){} }, 1700);
}
function isTyping(e){
  var t = e.target;
  return !!t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
}
function layerOpen(){
  var sheet = $("#sheet"), hp = $("#health");
  return palOpen || (hp && !hp.hidden) || (sheet && !sheet.hidden);
}
document.addEventListener("keydown", function(e){
  var mod = e.ctrlKey || e.metaKey;
  if(mod && (e.key === "k" || e.key === "K")){
    e.preventDefault();
    if(palOpen) closePalette(); else openPalette($("#palBtn"));
    return;
  }
  if(e.key === "Escape"){
    if(palOpen){ e.preventDefault(); closePalette(); return; }
    var pp = $("#prop");
    if(pp && !pp.hidden){ e.preventDefault(); closeProp(); return; }   /* 关层 ≠ 应用/拒绝 */
    var hp = $("#health");
    if(hp && !hp.hidden){ e.preventDefault(); closeHealth(); return; }
    return;                       /* 其余交给已有的 Esc 处理（关 sheet）——关层 ≠ 批准 */
  }
  if(isTyping(e) || palOpen || layerOpen()) return;
  var k = e.key;
  if(k === "j" || k === "J"){ e.preventDefault(); moveRun(1); return; }
  if(k === "k" || k === "K"){ e.preventDefault(); moveRun(-1); return; }
  if(k === "a" || k === "A"){ e.preventDefault(); doFirstApproval("allow"); return; }
  if(k === "r" || k === "R"){ e.preventDefault(); doFirstApproval("reject"); return; }
  if(k === "/"){ e.preventDefault(); var c = $("#cText"); if(c) c.focus(); return; }
  if(k === "d" || k === "D"){ e.preventDefault(); openHealth($("#diagBtn")); return; }
});
/* 元素绑定放到 DOMContentLoaded：面板/健康页的节点在本脚本之后才出现 */
function bindChrome(){
  var palBtn = $("#palBtn"), diagBtn = $("#diagBtn");
  if(palBtn) palBtn.addEventListener("click", function(){ openPalette(this); });
  if(diagBtn) diagBtn.addEventListener("click", function(){ openHealth(this); });
  var hpClose = $("#hpClose"), hpRefresh = $("#hpRefresh"), hpDiag = $("#hpDiag");
  if(hpClose) hpClose.addEventListener("click", closeHealth);
  if(hpRefresh) hpRefresh.addEventListener("click", renderHealth);
  if(hpDiag) hpDiag.addEventListener("click", copyDiag);
  var pal = $("#pal"), hp = $("#health");
  if(pal) pal.addEventListener("click", function(e){ if(e.target === this) closePalette(); });
  if(hp) hp.addEventListener("click", function(e){ if(e.target === this) closeHealth(); });
  var palIn = $("#palIn");
  if(palIn){
    palIn.addEventListener("input", function(){ palSel = 0; renderPalette(this.value); });
    palIn.addEventListener("keydown", function(e){
      if(e.key === "ArrowDown"){ e.preventDefault(); palSel = Math.min(palSel+1, Math.max(0,palItems.length-1)); renderPalette(this.value); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); palSel = Math.max(0, palSel-1); renderPalette(this.value); }
      else if(e.key === "Enter"){ e.preventDefault(); runPalItem(palItems[palSel]); }
    });
  }
  bindPropUi();
}
/* ================= R3：子代理页签的行（path / 状态点 / 目标 / 耗时） ================= */
function subRowHtml(k){
  return '<button class="test-row sub-row" data-nm="'+esc(k.nm)+'">'+
    '<span class="dot '+esc(k.st)+'"></span>'+
    '<span class="sub-path">'+esc(k.path)+'</span>'+
    '<span class="t">'+esc(String(k.d||"").slice(0,40))+'</span>'+
    '<span class="tm">'+esc(k.el||"")+'</span></button>';
}

/* ================= R3：提案页签（S28 的 UI 面） ================= */
var PROPS = [], propArmAt = 0, propCur = null, propConfirmHigh = false;
function fmtWhen(iso){
  var t = Date.parse(String(iso||""));
  if(!t) return "";
  var d = Math.max(0, Date.now() - t);
  if(d < 60e3) return "刚刚";
  if(d < 3600e3) return Math.round(d/60e3)+" 分钟前";
  if(d < 86400e3) return Math.round(d/3600e3)+" 小时前";
  return Math.round(d/86400e3)+" 天前";
}
/* change.patch 全文 → S18 的 DiffView（复用同一个展开组件，不另造渲染） */
function patchToDiffView(slug, patch){
  if(!patch) return null;
  var lines = String(patch).split("\n");
  var file = "", add = 0, del = 0, hunks = 0;
  lines.forEach(function(l){
    if(/^\+\+\+ /.test(l)){ if(!file) file = l.replace(/^\+\+\+ (b\/)?/, "").trim(); return; }
    if(/^@@/.test(l)){ hunks += 1; return; }
    if(/^\+/.test(l)) add += 1;
    else if(/^-/.test(l)) del += 1;
  });
  return { file: file || "patch.diff", add: add, del: del, hunks: hunks,
           patch: lines.slice(0, 60), total: lines.length, truncated: lines.length > 60 };
}
function renderProps(){
  var dock = $("#propDock"); if(!dock) return;
  if(!dock.dataset.loaded) dock.innerHTML = '<div class="empty-note">读取提案…</div>';
  fetch("/api/proposals").then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); }).then(function(x){
    if(!x.ok){
      dock.innerHTML = '<div class="empty-note">'+esc(x.d && (x.d.error||x.d.hint) || "提案接口不可用")+'</div>';
      return;
    }
    PROPS = Array.isArray(x.d.proposals) ? x.d.proposals : [];
    dock.dataset.loaded = "1";
    var pend = PROPS.filter(function(p){ return p.status === "pending"; }).length;
    var bdg = $("#rpPropsBdg"); if(bdg){ bdg.textContent = String(pend); bdg.hidden = !pend; }
    dock.innerHTML = PROPS.length ? PROPS.map(function(p,i){
      var risk = String(p.risk || "low");
      return '<button class="prop-item" data-i="'+i+'">'+
        '<span class="p1"><span class="slug">'+esc(p.slug)+'</span>'+
        '<span class="risk risk-'+esc(risk)+'">'+esc(risk)+'</span>'+
        '<span class="st-'+esc(p.status)+'">'+esc(p.status)+'</span></span>'+
        '<span class="p2"><span>'+esc(fmtWhen(p.created_at))+'</span><span>'+p.files+' 个文件</span>'+
        (p.verify_cmd ? '<span>'+esc(String(p.verify_cmd).slice(0,28))+'</span>' : '')+'</span></button>';
    }).join("") : '<div class="empty-note">还没有提案：worker 用 ev_propose 提出改进后会出现在这里。</div>';
    each("#propDock .prop-item", function(el){
      el.addEventListener("click", function(){ openPropDetail(PROPS[+el.dataset.i]); });
    });
    /* inbox 提案卡跳过来时：数据到齐再开详情（避免先渲染列表再被冲掉） */
    if(pendingPropSlug){
      var want = pendingPropSlug; pendingPropSlug = null;
      var hit = PROPS.filter(function(p){ return p.slug === want; })[0];
      if(hit) setTimeout(function(){ openPropDetail(hit); }, 30);
      else toast("提案 "+want+" 已经不在了（可能已被应用/拒绝）");
    }
  }).catch(function(e){ dock.innerHTML = '<div class="empty-note">读取失败：'+esc(String(e).slice(0,80))+'</div>'; });
}
function openPropDetail(p){
  if(!p) return;
  propCur = p; propConfirmHigh = false; propArmAt = Date.now() + 500;   // 500ms 防误触（P10）
  var el = $("#prop"); if(!el) return;
  el.hidden = false;
  $("#propTitle").textContent = p.slug;
  $("#propMeta").textContent = String(p.risk||"low")+" · "+String(p.status||"")+" · "+(fmtWhen(p.created_at)||"");
  $("#propBody").innerHTML = '<div class="hint">读取提案内容…</div>';
  fetch("/api/proposals/"+encodeURIComponent(p.slug)).then(function(r){ return r.json(); }).then(function(d){
    var q = (d && d.proposal) || {};
    var md = String(q.proposal||"").split("\n").slice(0, 40).join("\n");
    var dv = patchToDiffView(q.slug || p.slug, q.patch);
    var st = String(q.status || p.status || "pending");
    /* 提案详情里补丁默认展开（详情页就是来看补丁的） */
    if(dv){ try{ openDiffs["prop-"+(q.slug||p.slug)+"|"+dv.file] = true; }catch(e){} }
    var acts = st === "pending"
      ? '<div class="prop-act">'+
          '<button class="opt solid" id="propApply">应用</button>'+
          '<input id="propReason" placeholder="拒绝理由（必填）" autocomplete="off">'+
          '<button class="opt" id="propReject">拒绝</button>'+
          '<span class="prop-note" id="propNote"></span>'+
        '</div>'
      : '<div class="prop-act"><span class="prop-note">这条提案已经是 '+esc(st)+'，不再提供动作（P10：动作由数据决定）</span></div>';
    $("#propBody").innerHTML =
      '<div class="prop-sec">动机 / 预期</div><pre class="prop-md">'+esc(md || "（proposal.md 为空）")+'</pre>'+
      '<div class="prop-sec">补丁</div>'+(dv ? diffsHtml({ id:"prop-"+(q.slug||p.slug), diffs:[dv] }) : '<div class="empty-note">patch.diff 为空</div>')+
      '<div class="prop-sec">验证命令</div><div class="prop-md" style="font-family:var(--f-mono);">'+esc(q.verify_cmd || "（未配置）")+'</div>'+
      acts;
    bindDiffs("#propBody");
    if(st === "pending") bindPropActions(q);
  }).catch(function(e){
    $("#propBody").innerHTML = '<div class="hint">读取失败：'+esc(String(e).slice(0,100))+'</div>';
  });
}
function bindPropActions(q){
  var apply = $("#propApply"), rej = $("#propReject"), reason = $("#propReason"), note = $("#propNote");
  if(apply) apply.addEventListener("click", function(){
    if(Date.now() < propArmAt){ note.textContent = "刚打开，先看一眼（500ms 内不执行）"; return; }
    if(String(q.risk) === "high" && !propConfirmHigh){
      propConfirmHigh = true;
      apply.textContent = "确认应用（high 风险）";
      note.textContent = "高风险：再点一次才应用";
      return;
    }
    sendPropAction("apply", { force: String(q.risk) === "high" });
  });
  if(rej) rej.addEventListener("click", function(){
    if(Date.now() < propArmAt){ note.textContent = "刚打开，先看一眼（500ms 内不执行）"; return; }
    var r = String(reason && reason.value || "").trim();
    if(!r){ note.textContent = "拒绝必须填理由"; if(reason) reason.focus(); return; }
    sendPropAction("reject", { reason: r });
  });
}
function sendPropAction(act, body){
  if(!propCur) return;
  var slug = propCur.slug, note = $("#propNote");
  if(note) note.textContent = "提交中…";
  fetch("/api/proposals/"+encodeURIComponent(slug)+"/"+act,
        { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body||{}) })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
    .then(function(x){
      if(!x.ok){ if(note) note.textContent = "失败："+(x.d && (x.d.error||x.d.message) || "unknown"); return; }
      if(note) note.textContent = act === "apply" ? "已应用" : "已拒绝";
      renderProps();
      setTimeout(closeProp, 650);
    })
    .catch(function(e){ if(note) note.textContent = "失败："+String(e).slice(0,80); });
}
function closeProp(){
  var el = $("#prop"); if(!el || el.hidden) return;
  el.hidden = true; propCur = null; propConfirmHigh = false;
  try{ var t = document.querySelector('.rp-tab[data-p="props"]'); if(t) t.focus(); }catch(e){}
}
function bindPropUi(){
  var c = $("#propClose"); if(c) c.addEventListener("click", closeProp);
  var ov = $("#prop"); if(ov) ov.addEventListener("click", function(e){ if(e.target === this) closeProp(); });
}

if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", bindChrome);
else bindChrome();


</script>
<!-- ================= S24：命令面板 ================= -->
<div class="ov" id="pal" hidden>
  <div class="pal" role="dialog" aria-modal="true" aria-label="命令面板">
    <input id="palIn" placeholder="搜任务 / 切详细紧凑 / 打开审批 / 派发 / 诊断…" autocomplete="off" spellcheck="false">
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot"><span>↑↓ 选择 · Enter 执行 · Esc 关闭（关闭 ≠ 批准）</span></div>
  </div>
</div>

<!-- ================= S26：健康检查页 ================= -->
<div class="ov" id="health" hidden>
  <div class="hp" role="dialog" aria-modal="true" aria-label="健康检查">
    <header><b>健康检查</b><span class="hp-time" id="hpTime"></span>
      <button class="opt" id="hpDiag">复制诊断包</button>
      <button class="opt" id="hpRefresh">刷新</button>
      <button class="opt solid" id="hpClose">关闭</button>
    </header>
    <div class="hp-body" id="hpBody"></div>
  </div>
</div>

<!-- ================= R3：提案详情（S28 UI 面） ================= -->
<div class="ov" id="prop" hidden>
  <div class="hp" role="dialog" aria-modal="true" aria-label="提案详情">
    <header><b id="propTitle">提案</b><span class="hp-time" id="propMeta"></span>
      <button class="opt" id="propClose">关闭</button>
    </header>
    <div class="hp-body" id="propBody"></div>
  </div>
</div>

</body>
