<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aica workbench</title>
<link rel="stylesheet" href="/style.css">
<script src="/vendor/marked.min.js" defer></script>
</head>
<body>
<header>
  <span class="logo">◈ aica workbench</span>
  <span class="spacer"></span>
  <button id="refresh" class="ghost" title="刷新">⟳</button>
</header>
<main>
  <aside id="rail">
    <div class="pane-title"><span class="pt-t">Runs</span><button id="rail-toggle" class="ghost" title="折叠/展开侧栏">⟨</button></div>
    <div id="run-list"></div>
    <div id="sys">
      <div class="sysrow" id="sys-conn"><span class="dot st-done" id="conn-dot"></span><span class="sys-t">server</span><span id="conn" class="chip">…</span></div>
      <div class="sysrow" id="sys-daemon"><span class="dot" id="daemon-dot"></span><span class="sys-t">daemon</span><span id="daemon" class="chip">…</span></div>
      <div id="conn-bar" hidden>连接断开，重试中…</div>
    </div>
  </aside>
  <section id="center">
    <div id="run-head"><div class="rh-top dim">← 左侧选择 run，或在下方输入新任务</div></div>
    <div id="stream-wrap">
      <div id="gate-banner" hidden></div>
      <div id="stream"></div>
      <button id="jump" hidden>↓ 最新</button>
    </div>
    <div id="composer">
      <div id="composer-card">
        <textarea id="composer-text" rows="2" placeholder="派发一个新任务…"></textarea>
        <div id="composer-bar">
          <div id="modes">
            <button class="seg on" data-mode="task" title="默认执行面">任务</button>
            <button class="seg" data-mode="tools" title="授权 agent_desktop / ego_browser / ar_dispatch">带工具</button>
            <button class="seg" data-mode="orch" title="profile=orchestrator">编排</button>
          </div>
          <span id="composer-hint" class="dim">Enter 发送 · Shift+Enter 换行 · / 聚焦</span>
          <span class="spacer"></span>
          <button id="composer-send">派发 ▸</button>
        </div>
      </div>
    </div>
  </section>
  <aside id="sheet">
    <div id="sheet-head"><b id="sheet-title"></b><span class="spacer"></span><button id="sheet-close" class="ghost">✕</button></div>
    <div id="sheet-tabs"></div>
    <div id="sheet-body"></div>
  </aside>
</main>
<div id="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
