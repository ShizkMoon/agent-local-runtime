<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>aica workbench</title>
<link rel="stylesheet" href="/style.css">
<script src="/vendor/marked.min.js" defer></script>
</head>
<body>
<header>
  <span class="logo">◈ aica workbench</span>
  <span id="conn" class="chip chip-warn">connecting…</span>
  <span id="daemon" class="chip">daemon…</span>
  <span class="spacer"></span>
  <button id="refresh" class="ghost" title="刷新">⟳</button>
</header>
<main>
  <aside id="rail">
    <div class="pane-title">Runs</div>
    <div id="run-list"></div>
  </aside>
  <section id="center">
    <div id="run-head"><div class="rh-top dim">← 左侧选择 run，或在下方输入新任务</div></div>
    <div id="stream-wrap">
      <div id="stream"></div>
      <button id="jump" hidden>↓ 最新</button>
    </div>
    <div id="composer">
      <div id="composer-card">
        <textarea id="composer-text" rows="2" placeholder="派发一个新任务…"></textarea>
        <div id="composer-bar">
          <span id="composer-hint" class="dim">Enter 发送 · Shift+Enter 换行</span>
          <span class="spacer"></span>
          <button id="composer-send">派发 ▸</button>
        </div>
      </div>
    </div>
  </section>
  <aside id="sheet">
    <div id="sheet-head"><b id="sheet-title"></b><span class="spacer"></span><button id="sheet-close" class="ghost">✕</button></div>
    <div id="sheet-body"></div>
  </aside>
</main>
<div id="toast" hidden></div>
<script type="module" src="/app.js"></script>
</body>
</html>
