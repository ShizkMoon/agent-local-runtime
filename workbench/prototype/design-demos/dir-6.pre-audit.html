<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dir-6 · summary-first — AICA 工作台</title>
<script>
/* pre-paint：避免主题闪烁 —— 默认 light（Anthropic 暖纸为 showcase） */
(function(){
  var t=null;
  try{ t=localStorage.getItem("aica-dir6-theme"); }catch(e){}
  if(t!=="dark") t="light";
  document.documentElement.dataset.theme=t;
})();
</script>
<style>
/* ============================================================
   dir-6 — summary-first 版（dir-5 皮肤 × 总结优先信息架构）
   表面只留：目标、验收清单、子代理自然语言状态、结论、产物。
   工具行与事件日志收进「过程与证据」折层，点验收条目才展开。
   ============================================================ */
:root{
  /* --- 角色色（跨主题恒定） --- */
  --brand:        #d97757;   /* clay —— AGENT PRESENCE only */
  --brand-active: #c6613f;

  /* --- 字体 --- */
  --f-chrome:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --f-serif:"Newsreader","Georgia","Songti SC","Noto Serif CJK SC",ui-serif,serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Microsoft YaHei",monospace;

  /* --- radius by role --- */
  --r-ctl:8px;      /* controls */
  --r-sub:10px;     /* sub-panels (tool rows / folds / streams) */
  --r-card:12px;    /* cards */
  --r-composer:14px;/* roundest surface */
  --r-pill:999px;

  /* --- motion --- */
  --e:     cubic-bezier(.165,.84,.44,1);
  --e-pop: cubic-bezier(.34,1.3,.64,1); /* overshoot: sheet/jump pops */
  --t-fast:60ms; --t-ui:120ms; --t-med:200ms; --t-slow:300ms;

  /* --- geometry --- */
  --sb-w:256px;
  --rp-w:380px;
}

/* ============ LIGHT —— Anthropic 暖纸（showcase 默认） ============ */
[data-theme="light"]{
  color-scheme:light;
  --s0:#f9f9f7;             /* rail */
  --s1:#fcfcfb;             /* canvas */
  --s2:#ffffff;             /* cards / bubbles */
  --s3:#ffffff;             /* composer / elevated */
  --pop:#ffffff;            /* popovers */
  --ln:    rgba(0,0,0,.08); /* hairline */
  --ln-hi: rgba(0,0,0,.16); /* hairline strong */
  --t1:#0b0b0b;             /* primary */
  --t2:#52514e;             /* secondary */
  --t3:#6f6d64;             /* muted —— 亮底 ≥4.5:1 */

  --accent:#184f95;                       /* affordance blue */
  --accent-soft:rgba(24,79,149,.09);
  --accent-fg:#ffffff;
  --fig:#b04a6e;    --fig-soft:rgba(176,74,110,.10);
  --ok:#788c5d;     --ok-soft:rgba(120,140,93,.14);
  --warn:#b07b4f;   --warn-soft:rgba(176,123,79,.12);
  --brand-tint:rgba(217,119,87,.13);
  --on-brand:#1c1a16;          /* clay 上的字：深墨 */

  --hov:rgba(0,0,0,.035);
  --bub:#f2f0ec;                        /* user bubble：暖灰实填 */
  --raised:rgba(0,0,0,.028);            /* 卡内微抬升条 */
  --shadow-pop:0 8px 24px rgba(0,0,0,.14);
  --scroll:rgba(0,0,0,.2);
  --w-md:500;
}

/* ============ DARK ============ */
[data-theme="dark"]{
  color-scheme:dark;
  --s0:#0b0b0b;
  --s1:#151515;
  --s2:#1a1a19;
  --s3:#20201f;
  --pop:#2c2c2a;
  --ln:    rgba(255,255,255,.09);
  --ln-hi: rgba(255,255,255,.18);
  --t1:#f0efec;
  --t2:#c3c2b7;
  --t3:#898781;

  --accent:#86b6ef;
  --accent-soft:rgba(134,182,239,.13);
  --accent-fg:#0b0b0b;
  --fig:#c46686;    --fig-soft:rgba(196,102,134,.13);
  --ok:#8fb573;     --ok-soft:rgba(143,181,115,.14);
  --warn:#d4a27f;   --warn-soft:rgba(212,162,127,.13);
  --brand-tint:rgba(217,119,87,.16);

  --hov:rgba(255,255,255,.045);
  --bub:#1e1e1d;
  --on-brand:#161311;
  --raised:var(--s3);
  --shadow-pop:0 8px 24px rgba(0,0,0,.35);
  --scroll:rgba(255,255,255,.16);
  --w-md:465;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-chrome);
  font-size:14px;line-height:1.5;
  background:var(--s1);
  color:var(--t1);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft)}
#app{
  width:1440px;height:900px;margin:0 auto;
  display:grid;
  grid-template-columns:var(--sb-w) minmax(0,1fr) var(--rp-w);
  grid-template-rows:minmax(0,1fr);
  background:var(--s1);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:5px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* ============ 左栏：rail（s0） ============ */
#sidebar{
  background:var(--s0);
  border-right:1px solid var(--ln);
  display:flex;flex-direction:column;min-height:0;
  overflow:hidden;
}
.sb-top{padding:10px 8px 2px;flex:none}
.newtask{
  display:flex;align-items:center;height:32px;width:100%;
  padding:0 10px;border-radius:var(--r-ctl);
  font-size:14px;color:var(--t2);white-space:nowrap;
  transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.newtask:hover{background:var(--hov);color:var(--t1)}

.icon-btn{
  width:28px;height:28px;border-radius:var(--r-ctl);flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--t3);transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.icon-btn:hover{background:var(--hov);color:var(--t1)}
.icon-btn svg{width:16px;height:16px}

.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 8px 12px;min-height:0;
}
.sb-sec{
  font-family:var(--f-mono);font-size:11px;color:var(--t3);
  padding:14px 10px 5px;letter-spacing:.06em;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}

/* nav 行 —— 纯文本，选中 = accent tint */
.nav-row{
  display:flex;align-items:center;gap:10px;height:32px;width:100%;
  padding:0 10px;border-radius:var(--r-ctl);
  font-size:14px;color:var(--t2);
  transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);white-space:nowrap;
}
.nav-row:hover{background:var(--hov);color:var(--t1)}
.nav-row.on{background:var(--accent-soft);color:var(--accent)}
.nav-row .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-row .bdg{
  flex:none;min-width:20px;height:18px;padding:0 6px;border-radius:var(--r-pill);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:var(--w-md);font-variant-numeric:tabular-nums;
  background:var(--hov);color:var(--t2);
}
.nav-row .bdg.hot{background:var(--brand);color:var(--on-brand)} /* needs-you = clay */

/* Active run = 卡（serif 标题 + pill 行 + 人话 meta 行） */
.run-card{
  width:100%;border-radius:var(--r-ctl);padding:7px 10px 8px;
  display:flex;flex-direction:column;gap:3px;position:relative;
  transition:background var(--t-ui) var(--e);white-space:nowrap;
}
.run-card:hover{background:var(--hov)}
.run-card.on{background:var(--accent-soft)}
.run-card.on .ttl{color:var(--t1)}
.run-card .r1{display:flex;align-items:center;gap:6px;min-height:18px}
.run-card .ttl{font-family:var(--f-serif);font-size:15px;font-weight:400;color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.run-card:hover .ttl{color:var(--t1)}
.run-card .meta{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis}

/* 状态 —— 小圆点承载语义色，文字保持安静 t3 */
.pill{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  font-size:12px;line-height:1;color:var(--t3);
}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--t3);flex:none}
.pill.working i{background:var(--brand);animation:breath 1.9s var(--e) infinite}
.pill.input i{background:var(--accent)}
@keyframes breath{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.72)}}
.dur{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums;flex:none}

/* Settled = 紧凑退行 */
.set-row{
  display:flex;align-items:center;gap:10px;height:32px;width:100%;
  padding:0 10px;border-radius:var(--r-ctl);font-size:14px;
  color:var(--t2);opacity:.72;
  transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e),opacity var(--t-ui) var(--e);white-space:nowrap;
}
.set-row:hover{background:var(--hov);color:var(--t1);opacity:1}
.set-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.set-row .tm{flex:none;font-family:var(--f-mono);font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}

/* ============ 中栏：thread / stream ============ */
#center{display:flex;flex-direction:column;min-width:0;background:var(--s1)}
.th-head{
  flex:none;height:48px;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--ln);
  background:var(--s1);
}
.crumb{font-size:13px;color:var(--t3);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.crumb b{font-family:var(--f-serif);font-size:16px;color:var(--t1);font-weight:400;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis}
.crumb i{font-style:normal;opacity:.4}
.th-head .right{margin-left:auto;display:flex;align-items:center;flex:none}
/* 主题切换（sun/moon） */
#themeBtn .i-sun{display:none}
[data-theme="dark"] #themeBtn .i-sun{display:block}
[data-theme="dark"] #themeBtn .i-moon{display:none}

.thread-scroll{flex:1;overflow-y:auto;min-height:0;padding:20px 24px 8px;
}
.col-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* user bubble —— 右对齐，暖灰实填 */
.urow{display:flex;justify-content:flex-end}
.ububble{
  max-width:78%;background:var(--bub);color:var(--t1);
  border-radius:var(--r-card) var(--r-card) 4px var(--r-card);
  padding:9px 14px;font-size:14px;line-height:1.55;
}

/* assistant prose —— Newsreader 衬线（Claude voice） */
.atext{font-family:var(--f-serif);font-size:15.5px;font-weight:400;line-height:1.72;color:var(--t1);letter-spacing:.005em}
.atext .mk{font-family:var(--f-mono);font-size:11px;color:var(--t3);margin-top:6px;display:block;letter-spacing:0}

/* thinking —— working = 3 clay dots；input = 静置 */
.think{display:flex;align-items:center;gap:10px;color:var(--t3);padding:2px 2px 0}
.think .td{display:inline-flex;gap:5px;flex:none;padding:2px 0}
.think .td i{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:tdots 1.9s var(--e) infinite}
.think .td i:nth-child(2){animation-delay:.24s}
.think .td i:nth-child(3){animation-delay:.48s}
.think .td.still i{animation:none;opacity:.35}
.think .tk{font-family:var(--f-serif);font-style:italic;font-size:13.5px;color:var(--t2)}
@keyframes tdots{0%,70%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-2.5px)}}

/* 根卡 —— serif 标题 + obj + 验收清单 */
.root-card{
  background:var(--s2);border:1px solid var(--ln);
  border-radius:var(--r-card);padding:16px 18px 8px;
}
.root-title{font-family:var(--f-serif);font-size:24px;font-weight:400;color:var(--t1);margin:0 0 6px;letter-spacing:.01em;line-height:1.3}
.root-obj{font-size:14px;line-height:1.65;color:var(--t2);max-width:62ch}
.rollup{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  font-size:12px;font-weight:var(--w-md);color:var(--warn);
  background:var(--warn-soft);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  padding:3px 10px;border-radius:var(--r-pill);
}
.rollup i{width:6px;height:6px;border-radius:50%;background:currentColor}
.rollup.clear{color:var(--ok);background:transparent;border-color:var(--ln)}

/* 验收清单 —— quiet 行：状态符 + 条文，hairline 分隔；纯展示不交互 */
.acl-list{margin-top:12px;border-top:1px solid var(--ln)}
.acl{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:7px 2px;font-size:13.5px;color:var(--t2);
  border-bottom:1px solid var(--ln);
}
.acl .g{width:14px;flex:none;text-align:center;font-size:12px;line-height:1}
.acl[data-s="verified"] .g{color:var(--ok)}
.acl[data-s="failed"]   .g{color:var(--fig)}
.acl[data-s="pending"]  .g{color:var(--t3)}
.acl .g .hd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.acl .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acl-more{display:none}

/* 分区标签已删：不展示段标 */

/* 工具行 —— 只存在于证据折层内；行 = 人话动作 */
.wl-group{display:flex;flex-direction:column;gap:6px;padding:8px 8px 4px}
.wl{border:1px solid var(--ln);border-radius:var(--r-sub);overflow:hidden;background:var(--s2)}
.wl-row{
  display:flex;align-items:center;gap:8px;width:100%;min-height:34px;
  padding:4px 10px;font-size:13px;color:var(--t2);
  transition:background var(--t-ui) var(--e);
}
.wl-row:hover{background:var(--hov)}
.wl-row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-row .st{font-family:var(--f-mono);font-size:11px;color:var(--t3);flex:none;font-variant-numeric:tabular-nums}
.wl-row .st.err{color:var(--fig)}
.wl .chev{width:14px;height:14px;flex:none;color:var(--t3);transition:transform var(--t-med) var(--e)}
.wl.open .chev{transform:rotate(90deg)}
.wl-body{display:none;border-top:1px solid var(--ln);background:var(--s0)}
.wl.open .wl-body{display:block}
.wl-body pre{
  max-height:240px;overflow:auto;padding:10px 14px;
  font-family:var(--f-mono);font-size:12px;line-height:1.7;
  color:var(--t2);white-space:pre-wrap;word-break:break-word;cursor:text;
}
.wl-body pre .k{color:var(--accent)} .wl-body pre .ok{color:var(--ok)} .wl-body pre .err{color:var(--fig)}

/* 任务树 —— 子代理自然语言状态摘要 */
.tree{display:flex;flex-direction:column}
.tnode{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:5px 8px;border-radius:var(--r-ctl);min-height:38px;
  transition:background var(--t-ui) var(--e);position:relative;
}
.tnode:hover{background:var(--hov)}
.tnode.sel{background:var(--accent-soft)}
.tnode.l2{padding-left:8px;min-height:40px}
.tnode.l3{padding-left:30px;min-height:34px}
#tree>.tnode.l3::before{ /* 层级引导线 */
  content:"";position:absolute;left:16px;top:-4px;bottom:50%;width:1px;background:var(--ln);
}
#tree>.tnode.l3::after{content:"";position:absolute;left:16px;top:50%;width:8px;height:1px;background:var(--ln)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin:0 4px}
.dot.working{background:var(--brand);animation:breath 1.9s var(--e) infinite}
.dot.input{background:var(--accent)}
.dot.done{background:var(--ok)} .dot.queued{background:var(--t3);opacity:.55}
.dot.dep{background:var(--warn)} .dot.failed{background:var(--fig)}
.tn-main{flex:1;min-width:0}
.tn-t{display:flex;align-items:baseline;gap:8px;min-width:0}
.tn-t .nm{font-family:var(--f-serif);font-size:14px;font-weight:400;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn-d{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.anc-roll{ /* 祖先上卷徽章 */
  flex:none;font-family:var(--f-mono);font-size:10.5px;font-weight:var(--w-md);padding:1px 7px;border-radius:var(--r-pill);
  color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-soft);
}
.tn-st{flex:none;font-family:var(--f-mono);font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.tn-st.await{color:var(--accent);font-weight:var(--w-md)}
.prog{width:52px;height:4px;border-radius:2px;background:var(--hov);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--brand);border-radius:2px}

/* L4+ 聚合折叠卡 */
.fold-card{margin-left:30px;border:1px dashed var(--ln-hi);border-radius:var(--r-sub)}
.fold-h{
  display:flex;align-items:center;gap:8px;width:100%;min-height:32px;
  padding:4px 10px;font-family:var(--f-mono);font-size:11px;color:var(--t3);transition:color var(--t-ui) var(--e);
}
.fold-h:hover{color:var(--t1)}
.fold-h .chev{width:12px;height:12px;transition:transform var(--t-med) var(--e-pop)}
.fold-card.open .fold-h .chev{transform:rotate(90deg)}
.fold-body{display:none;padding:2px 6px 6px}
.fold-card.open .fold-body{display:block;animation:fade var(--t-med) var(--e)}
.fold-body .tnode{min-height:30px;padding:3px 8px}
.fold-body .dot{width:6px;height:6px}
.fold-body .tn-t .nm{font-family:var(--f-chrome);font-size:12px;font-weight:400;color:var(--t2)}

/* 结论面板 —— hairline 分隔 cells：serif 结论 + 「节点名 · 时间」出处 */
.facts{background:var(--s2);border:1px solid var(--ln);border-radius:var(--r-card);overflow:hidden}
.fcell{padding:10px 14px}
.fcell+.fcell{border-top:1px solid var(--ln)}
.fcell p{font-family:var(--f-serif);font-size:14px;font-weight:400;line-height:1.6;color:var(--t1)}
.fcell p code{font-family:var(--f-mono);font-size:11px;color:var(--t2);background:var(--s0);border:1px solid var(--ln);padding:0 4px;border-radius:4px}
.fcell .src{font-family:var(--f-mono);font-size:10.5px;color:var(--t3);margin-top:4px;display:block}

/* 产物行 —— 1.35/1/1 不均分 */
.arts{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px}
.art{
  background:var(--s2);border:1px solid var(--ln);border-radius:var(--r-card);
  overflow:hidden;display:flex;flex-direction:column;min-width:0;
}
.art .ah{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--ln);background:var(--raised)}
.art .fn{font-family:var(--f-mono);font-size:11px;color:var(--t2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .ft{font-family:var(--f-mono);font-size:10px;color:var(--t3);flex:none;letter-spacing:.08em}
.art .bd{padding:9px 11px;font-size:12.5px;line-height:1.7;color:var(--t2);min-height:74px}
.art .bd.serif{font-family:var(--f-serif);font-size:13.5px;font-weight:400}
.art .bd.mono{font-family:var(--f-mono);font-size:11.5px}
.art .bd .hh{font-family:var(--f-serif);color:var(--t1);font-weight:400;font-size:14px}
.art .bd .p{color:var(--ok)} .art .bd .m{color:var(--fig)}
.art .st{padding:6px 10px;font-family:var(--f-mono);font-size:10.5px;color:var(--t3);border-top:1px solid var(--ln)}
.art .st .p{color:var(--ok)} .art .st .m{color:var(--fig)}
/* PAGE = 诚实的空窗口帧 */
.pm{flex:1;min-height:74px;background:var(--s0);display:flex;flex-direction:column}
.pm .bar{height:20px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:5px;padding:0 8px;flex:none}
.pm .bar i{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ln-hi)}
.pm .empty{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:10.5px;color:var(--t3)}

/* 证据折层已删 —— 细节只在子代理页（sheet）内 */

/* 子代理页 —— 节点点击右侧滑出 */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(20,15,10,.28)}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,40vw);z-index:41;
  background:var(--s1);border-left:1px solid var(--ln);display:flex;flex-direction:column;
  transform:translateX(12px);opacity:0;pointer-events:none;
  transition:transform var(--t-med) var(--e),opacity var(--t-med) var(--e)}
.sheet.open{transform:none;opacity:1;pointer-events:auto}
.sh-h{flex:none;display:flex;align-items:flex-start;gap:10px;padding:16px 14px 12px 20px;border-bottom:1px solid var(--ln)}
.sh-t{flex:1;font-family:var(--f-serif);font-size:18px;font-weight:400;color:var(--t1);line-height:1.4}
.sh-b{flex:1;overflow-y:auto;padding:14px 20px;display:flex;flex-direction:column;gap:2px}
.sh-row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln-soft,rgba(0,0,0,.05));font-size:13px}
.sh-row:last-of-type{border-bottom:none}
.sh-row>span{flex:none;width:44px;color:var(--t3);font-size:12px;padding-top:1px}
.sh-row>b{flex:1;font-weight:400;color:var(--t1)}
.sh-act{margin-top:14px}
.sh-note{font-size:12.5px;color:var(--t3)}
.sh-log{margin-top:12px;padding:10px 12px;border:1px solid var(--ln);border-radius:var(--r-sub);
  background:var(--s0);font-family:var(--f-mono);font-size:11.5px;line-height:1.8;color:var(--t2);
  white-space:pre-wrap}

/* ============ composer（s3，radius 14 —— 全场最圆 + 唯一阴影） ============ */
.composer-zone{flex:none;padding:0 24px 14px;max-width:764px;margin:0 auto;width:100%}
/* ComposerBanner：attached surface，tuck under composer —— hairline + 微 tint，无彩色描边 */
.cb-banner{
  position:relative;margin:0 12px -13px;padding:6px 8px 19px;
  font-size:12px;line-height:16px;border-radius:var(--r-sub) var(--r-sub) 0 0;
  background:color-mix(in srgb,var(--warn) 6%,var(--s3));
  border:1px solid var(--ln);border-bottom:0;
  display:flex;align-items:center;gap:0;z-index:2;
}
.cb-banner .ic{width:24px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--warn)}
.cb-banner .ic svg{width:14px;height:14px}
.cb-banner .ct{flex:1;min-width:0;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-banner .ct b{color:var(--warn);font-weight:var(--w-md)}
.cb-banner .ac{display:flex;gap:6px;flex:none}
.cb-btn{
  font-size:12px;color:var(--t2);
  border:1px solid var(--ln);border-radius:var(--r-ctl);padding:3px 10px;min-height:26px;
  background:var(--s2);transition:all var(--t-ui) var(--e);
}
.cb-btn:hover{background:var(--hov);color:var(--t1);border-color:var(--ln-hi)}
.cb-btn.ghost{border-color:transparent;color:var(--t3)}
.cb-banner.info{background:color-mix(in srgb,var(--accent) 7%,var(--s3))}
.cb-banner.info .ic{color:var(--accent)}
.cb-banner.info .ct b{color:var(--accent)}
.cb-banner.resolved{background:var(--s3)}
.cb-banner.resolved .ic{color:var(--ok)}
.cb-banner.resolved .ct b{color:var(--ok)}

/* composer 卡 */
.composer{
  position:relative;z-index:3;
  background:var(--s3);border:1px solid var(--ln);
  border-radius:var(--r-composer);
  box-shadow:var(--shadow-pop);
}
.c-input{display:flex;align-items:flex-start;gap:8px;padding:13px 14px 6px;min-height:44px}
.c-input textarea{
  flex:1;background:none;border:0;outline:none;resize:none;
  font:inherit;font-size:14px;color:var(--t1);line-height:1.5;height:22px;
  max-height:110px;overflow-y:auto;
}
.c-input textarea::placeholder{color:var(--t3)}
.c-foot{display:flex;align-items:center;gap:6px;padding:6px 10px 10px}
/* 单一文本拨盘 → 向上小弹层 */
.dset{
  display:inline-flex;align-items:center;gap:5px;height:26px;
  padding:0 9px;border-radius:var(--r-ctl);
  font-family:var(--f-mono);font-size:11.5px;
  color:var(--t3);transition:background var(--t-ui) var(--e),color var(--t-ui) var(--e);
}
.dset:hover{background:var(--hov);color:var(--t1)}
.dset.warn{color:var(--warn)}
.dset svg{width:12px;height:12px;opacity:.55}
.dpop{
  position:absolute;left:10px;bottom:46px;min-width:190px;z-index:20;
  background:var(--pop);border:1px solid var(--ln);border-radius:var(--r-sub);
  box-shadow:var(--shadow-pop);padding:4px;display:none;
}
.dpop.open{display:block;animation:fade var(--t-fast) var(--e)}
.dpr{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:6px 10px;border-radius:var(--r-ctl);
  font-size:12.5px;color:var(--t2);transition:background var(--t-ui) var(--e);
}
.dpr:hover{background:var(--hov);color:var(--t1)}
.dpr .dk{width:30px;flex:none;font-size:11px;color:var(--t3)}
.dpr .dv{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--t1);font-variant-numeric:tabular-nums}
.send{ /* primary CTA = clay */
  margin-left:auto;width:32px;height:32px;border-radius:var(--r-pill);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand);color:var(--on-brand);
  transition:background var(--t-ui) var(--e),transform var(--t-ui) var(--e-pop),opacity var(--t-ui) var(--e);
}
.send:hover{background:var(--brand-active)}
.send:active{transform:scale(.92)}
.send svg{width:15px;height:15px}

/* ============ 右栏：需要你 inbox ============ */
.rp-foot{flex:none;position:relative;border-top:1px solid var(--ln);padding:8px 12px;display:flex;align-items:center}
.rp-foot .dpop{left:8px;right:8px;bottom:44px;min-width:0}
.rp-cells{display:flex;flex-direction:column;gap:10px}
.rp-pane{display:flex;flex-direction:column;gap:6px}
.rp-pane[hidden],.rp-cells[hidden]{display:none}
.rp-tabs{flex:none;display:flex;align-items:center;gap:2px;padding:8px 12px 0;border-bottom:1px solid var(--ln)}
.rp-tab{display:flex;align-items:center;gap:5px;padding:8px 10px;border:none;background:none;
  font-size:13px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;
  transition:color var(--t-ui) var(--e),border-color var(--t-ui) var(--e)}
.rp-tab:hover{color:var(--t1)}
.rp-tab.on{color:var(--t1);border-bottom-color:var(--accent);font-weight:var(--w-md)}
.rp-tab .bdg{font-size:10.5px;font-weight:var(--w-md);min-width:16px;height:15px;padding:0 4px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center}
.artl{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:1px solid var(--ln);border-radius:var(--r-sub);background:var(--s2);cursor:pointer;transition:border-color var(--t-ui) var(--e),background var(--t-ui) var(--e);margin-bottom:6px}
.artl:hover{border-color:var(--ln-hi);background:var(--s3)}
.artl .fn{flex:1;min-width:0;font-size:13px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.artl .sz{flex:none;font-family:var(--f-mono);font-size:10.5px;color:var(--t3)}
.subrow{display:flex;align-items:center;gap:8px;width:100%;padding:7px 4px;border-bottom:1px solid var(--ln);background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;text-align:left;transition:background var(--t-ui) var(--e)}
.subrow:hover{background:var(--hov)}
.subrow .nm{flex:1;min-width:0;font-size:13px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow .stm{flex:none;font-family:var(--f-mono);font-size:10.5px;color:var(--t3)}
.sub-empty{padding:10px 4px;font-size:12.5px;color:var(--t3)}
.subm{flex:1;min-width:0;display:flex;flex-direction:column}
.subm .sd{font-size:11.5px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.sub-back{color:var(--t3);font-size:12px;font-style:normal}
.sh-md{display:none}
/* 产物真实预览：HTML 迷你渲染 / PDF 文档页 */
.pvp{border:1px solid var(--ln);border-radius:var(--r-sub);overflow:hidden;background:var(--s2)}
.pvp-bar{height:26px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--s1)}
.pvp-bar i{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ln-hi);flex:none}
.pvp-bar span{margin-left:6px;font-family:var(--f-mono);font-size:10.5px;color:var(--t3)}
.pvp-body{padding:16px 18px;min-height:150px}
.pvp-h{font-family:var(--f-serif);font-size:15px;color:var(--t1);margin-bottom:10px}
.pvp-l{height:7px;border-radius:3px;background:var(--ln);margin-bottom:7px}
.pvp-l.w90{width:90%}.pvp-l.w85{width:85%}.pvp-l.w80{width:80%}.pvp-l.w70{width:70%}.pvp-l.w60{width:60%}.pvp-l.w55{width:55%}
.pvp-t{font-family:var(--f-mono);font-size:11px;color:var(--t2);background:var(--s0);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin:10px 0}
.pvp-body.pdf{background:var(--s1)}
/* 已裁决卡收成一行：只剩标题+判定，不占地方 */
.incard.res{padding:8px 14px;opacity:.55}
.incard.res .desc,.incard.res .opts{display:none}

#right{
  background:var(--s1);border-left:1px solid var(--ln);
  display:flex;flex-direction:column;min-height:0;
}
.rp-head{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:12px 14px;border-bottom:1px solid var(--ln);
  font-size:13px;font-weight:var(--w-md);color:var(--t1);
}
.rp-head .bdg{font-size:11px;font-weight:var(--w-md);min-width:18px;height:17px;padding:0 5px;border-radius:var(--r-pill);background:var(--brand);color:var(--on-brand);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.rp-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}

/* inbox 卡 —— hairline 边框 + 低透明度细 presence 边（clay=等待，fig=危险） */
.incard{
  position:relative;
  background:var(--s2);border:1px solid var(--ln);
  border-radius:var(--r-card);
  padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;
  transition:opacity var(--t-med) var(--e),border-color var(--t-med) var(--e),box-shadow var(--t-med) var(--e);
}
.incard::before{
  content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;
  border-radius:0 2px 2px 0;background:color-mix(in srgb,var(--brand) 42%,transparent);
}
.incard.err::before{background:color-mix(in srgb,var(--fig) 48%,transparent)}
.incard.res{opacity:.6}
.incard.res::before{content:none}
.incard.flash{animation:iflash 1.4s var(--e)}
@keyframes iflash{0%{box-shadow:0 0 0 3px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
.incard h3{font-family:var(--f-serif);font-size:15.5px;font-weight:400;color:var(--t1);line-height:1.4}
.incard .desc{font-size:13px;line-height:1.55;color:var(--t2)}
.incard .desc code{font-family:var(--f-mono);font-size:11px;color:var(--t2);background:var(--s0);border:1px solid var(--ln);padding:0 4px;border-radius:4px}
.icrumb{ /* 深层 gate 面包屑 —— 纯文本 A › B › C，无盒 */
  font-size:12px;color:var(--t3);display:flex;gap:5px;align-items:center;flex-wrap:wrap;
}
.icrumb i{font-style:normal;opacity:.4}
.icrumb b{color:var(--accent);font-weight:var(--w-md)}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.opt{ /* 细高 30px inline 按钮：hairline 边 + 安静文字 */
  font-size:12.5px;color:var(--t2);height:30px;
  border:1px solid var(--ln);border-radius:var(--r-ctl);padding:0 11px;
  background:transparent;transition:all var(--t-ui) var(--e);
}
.opt:hover{background:var(--hov);color:var(--t1);border-color:var(--ln-hi)}
.opt.danger{color:var(--fig);border-color:color-mix(in srgb,var(--fig) 35%,transparent)}
.opt.danger:hover{background:var(--fig-soft);border-color:color-mix(in srgb,var(--fig) 50%,transparent)}
.opt.solid{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.opt.solid:hover{background:color-mix(in srgb,var(--accent) 15%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.verdict{display:none;font-size:12px;color:var(--ok);align-items:center;gap:6px;padding-top:2px}
.incard.res .verdict{display:flex}
.incard.res .opts{display:none}
.verdict::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}

.fadein{animation:fade var(--t-med) var(--e)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar">
    <div class="sb-top"><button class="newtask" id="newBtn">+ 新任务</button></div>

    <div class="sb-scroll">
      <button class="nav-row on" data-nav="inbox"><span class="lab">需要你</span><span class="bdg hot" id="navInboxBdg">5</span></button>
      <button class="nav-row" data-nav="runs"><span class="lab">运行中</span><span class="bdg">3</span></button>
      <button class="nav-row" data-nav="lib"><span class="lab">任务库</span></button>
      <button class="nav-row" data-nav="proj"><span class="lab">项目 · 场景</span></button>
      <button class="nav-row" data-nav="sys"><span class="lab">系统态</span></button>

      <div class="sb-sec"><span class="txt">进行中</span></div>
      <div id="runList"></div>

      <div class="sb-sec"><span class="txt">已结束</span></div>
      <div id="settledList"></div>
    </div>
  </aside>

  <!-- ================= CENTER ================= -->
  <main id="center">
    <header class="th-head">
      <span class="crumb"><b id="thTitle">调研各家 Agent 界面</b></span>
      <span class="right">
        <button class="icon-btn" id="themeBtn" aria-label="切换主题">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </span>
    </header>

    <div class="thread-scroll" id="threadScroll"><div class="col-inner" id="colInner"></div></div>

    <div class="composer-zone">
      <!-- ComposerBanner attached：等待 gate 条 -->
      <div class="cb-banner info" id="gateBanner">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg></span>
        <span class="ct" id="gateBannerText"><b>1 节点等待回复</b> · 抓取 openclaudeui token 值 — token 性质判定</span>
        <span class="ac">
          <button class="cb-btn" id="gateLocate">去处理</button>
          <button class="cb-btn ghost" id="gateDismiss" aria-label="忽略">✕</button>
        </span>
      </div>
      <div class="composer">
        <div class="c-input">
          <textarea id="cText" rows="1" placeholder="派发任务，或回复等待中的问题…"></textarea>
        </div>
        <div class="c-foot">
          <button class="send" id="sendBtn" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ================= RIGHT PANEL ================= -->
  <aside id="right">
    <div class="rp-tabs">
      <button class="rp-tab on" data-p="inbox">需要你 <span class="bdg" id="rpInboxBdg">5</span></button>
      <button class="rp-tab" data-p="arts">产物</button>
      <button class="rp-tab" data-p="subs">子代理</button>
    </div>
    <div class="rp-body">
      <div class="rp-cells" id="pane-inbox"></div>
      <div class="rp-pane" id="pane-arts" hidden><div id="artDock"></div></div>
      <div class="rp-pane" id="pane-subs" hidden><div id="subDock"></div></div>
    </div>

    <div class="rp-foot">
      <button class="dset" id="dset"><span id="dsetText">任务 · 标准 · qwen3-32b · 高</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="dpop" id="dpop"></div>
    </div>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden></aside>

<script>
"use strict";
/* ================= mock 数据 ================= */
var RUNS = [

      {lb:"核对截图归档完整性", st:"err", stx:"未过",

    tree:[

/* 子代理页签：默认显示根任务的直属子代理（L2）；点节点递归下钻 */
function kidsOf(list, parent){
  if(!parent) return list.filter(function(n){ return n.l===2; });
  var kids=[], i=list.indexOf(parent)+1, lvl=parent.l;
  for(;i<list.length;i++){ var n=list[i];
    if(n.l && n.l<=lvl) break;
    if(n.l===lvl+1) kids.push(n);
    if(n.fold) kids=kids.concat(n.fold.filter(function(f){return f.l===lvl+1;}));
  }
  return kids;
}

  var kids = kidsOf(RUNS[currentRun].tree, nd);

  if(!kids.length){ $("#subDock").innerHTML = head+'<div class="sub-empty">无下级子代理</div>'; }
  else {
    $("#subDock").innerHTML = head + kids.map(function(k){
      return '<button class="subrow"><span class="dot '+k.st+'"></span>'+
        '<span class="subm"><span class="nm">'+k.nm+'</span>'+
        (k.d?'<span class="sd">'+k.d+'</span>':"")+'</span>'+
        '<span class="stm">'+(ST_LABEL[k.st]||k.st)+'</span></button>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#subDock .subrow:not(.sub-back)"),function(el,i){
      el.addEventListener("click",function(){ renderSubs(kids[i]); openSheetFor(kids[i]); });
    });
  }
  var bk=$("#subBack"); if(bk) bk.addEventListener("click",function(){ renderSubs(null); });
}

/* ================= inbox ================= */
function renderInbox(){
  $("#pane-inbox").innerHTML = INBOX.map(function(c){
    var h = '<article class="incard'+((c.k==="err"||c.k==="fail")?" err":"")+(c.resolved?" res":"")+'" id="'+c.id+'">';
    if(c.crumb) h += '<div class="icrumb">'+c.crumb.map(function(x,i){return (i?'<i>›</i>':'')+(i===c.crumb.length-1?'<b>'+x+'</b>':x);}).join("")+'</div>';
    h += '<h3>'+c.t+'</h3>';
    h += '<p class="desc">'+c.d+'</p>';
    if(c.opts) h += '<div class="opts">'+c.opts.map(function(o){
      return '<button class="opt '+o[1]+'" data-v="'+o[2]+'">'+o[0]+'</button>';
    }).join("")+'</div>';
    h += '<div class="verdict">'+(c.verdict||"")+'</div></article>';
    return h;
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#pane-inbox .opt"),function(el){
    el.addEventListener("click",function(){ resolveCard(el.closest(".incard"), el.dataset.v); });
  });
}
function resolveCard(card, verdict){
  if(card.classList.contains("res")) return;
  card.classList.add("res");
  card.querySelector(".verdict").textContent = verdict;
  inboxLeft = Math.max(0, inboxLeft-1);
  $("#navInboxBdg").textContent = inboxLeft;
  $("#rpInboxBdg").textContent = inboxLeft;
  if(inboxLeft===0){ $("#navInboxBdg").classList.remove("hot"); }
  /* 下一张未决卡闪一下 */
  var nxt = document.querySelector("#pane-inbox .incard:not(.res)");
  if(nxt){ nxt.classList.remove("flash"); void nxt.offsetWidth; nxt.classList.add("flash"); }
  if(card.id==="c4") resolveDeepGate();   /* 深层 gate → 祖先上卷解除 */
}
function resolveDeepGate(){
  pendingDeep = 0;
  RUNS[0].status = "working";
  RUNS[0].snippet = "已回复 · 子任务恢复执行";
  /* 树内徽章：祖先「1 待处理」上卷撤下 */
  Array.prototype.forEach.call(document.querySelectorAll("#tree .anc-roll"),function(el){ el.remove(); });
  var deep = document.querySelector('#tree .tnode[data-nm="抓取 openclaudeui token 值"]');
  if(deep){
    deep.dataset.st = "working";
    deep.querySelector(".dot").className = "dot working";
    deep.querySelector(".tn-st").className = "tn-st";
    deep.querySelector(".tn-st").textContent = "进行中 · 00:03";
    deep.querySelector(".tn-d").textContent = "已回复 · 恢复执行";
  }
  var anc = document.querySelector('#tree .tnode[data-nm="调研 Claude Desktop"]');
  if(anc){
    anc.dataset.st = "working";
    anc.querySelector(".dot").className = "dot working";
    anc.querySelector(".tn-st").className = "tn-st";
    anc.querySelector(".tn-st").textContent = "进行中 · 04:15";
  }
  var rb = $("#rollupBadge");
  if(rb){ rb.className = "rollup clear"; rb.innerHTML = "<i></i>全部畅通"; }
  /* banner 归卷：0 节点等待回复 */
  var b = $("#gateBanner");
  b.className = "cb-banner resolved";
  $("#gateBannerText").innerHTML = "<b>0 节点等待回复</b> · 已裁决，子任务恢复执行";
  $("#gateLocate").style.display = "none";
  renderSidebar();
}
$("#gateLocate").addEventListener("click",function(){
  var n = document.querySelector('#tree .tnode[data-nm="抓取 openclaudeui token 值"]');
  if(!n){ selectRun(0); n = document.querySelector('#tree .tnode[data-nm="抓取 openclaudeui token 值"]'); }
  if(n){ n.scrollIntoView({block:"center"}); n.classList.add("sel"); }
});
$("#gateDismiss").addEventListener("click",function(){ $("#gateBanner").style.display="none"; });

/* ================= composer ================= */
/* 单一拨盘：dset 文本触发 → dpop 向上弹层，行内循环 */
var DIALS = [
  ["模式",["任务","提问","场景"]],
  ["权限",["标准","受限","开放"]],
  ["模型",["qwen3-32b","qwen3-8b","deepseek-r1"]],
  ["推理",["低","中","高"]]
];
var dsel = [0,0,0,2];
function renderDset(){
  $("#dsetText").textContent = DIALS.map(function(d,i){ return d[1][dsel[i]]; }).join(" · ");
  $("#dset").classList.toggle("warn", dsel[1]!==0);   /* 权限 ≠ 标准 → warn tint */
}
$("#dpop").innerHTML = DIALS.map(function(d,i){
  return '<button class="dpr" data-d="'+i+'"><span class="dk">'+d[0]+'</span><span class="dv">'+d[1][dsel[i]]+'</span></button>';
}).join("");
$("#dset").addEventListener("click",function(e){
  e.stopPropagation();
  $("#dpop").classList.toggle("open");
});
Array.prototype.forEach.call(document.querySelectorAll(".dpr"),function(el){
  el.addEventListener("click",function(e){
    e.stopPropagation();
    var i = +el.dataset.d;
    dsel[i] = (dsel[i]+1) % DIALS[i][1].length;
    el.querySelector(".dv").textContent = DIALS[i][1][dsel[i]];
    renderDset();   /* 弹层保持打开 */
  });
});
document.addEventListener("click",function(e){
  if(!e.target.closest(".dpop") && !e.target.closest("#dset")){
    $("#dpop").classList.remove("open");
  }
});

/* textarea autogrow（封顶 110px） + Enter 发送 */
var cText = $("#cText");
cText.addEventListener("input",function(){
  cText.style.height = "auto";
  cText.style.height = Math.min(cText.scrollHeight,110)+"px";
});
$("#sendBtn").addEventListener("click",function(){
  var t = cText, v = t.value.trim();
  if(!v){ t.focus(); return; }
  var ci = $("#colInner");
  var div = document.createElement("div");
  div.className = "urow";
  div.innerHTML = '<div class="ububble"></div>';
  div.querySelector(".ububble").textContent = v;
  ci.appendChild(div);
  var ack = document.createElement("div");
  ack.className = "atext";
  ack.innerHTML = '已收到，排入当前任务队列。<span class="mk">排队中</span>';
  ci.appendChild(ack);
  t.value = "";
  t.style.height = "auto";
  $("#threadScroll").scrollTop = $("#threadScroll").scrollHeight;
});
cText.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("#sendBtn").click(); }
});

/* ================= nav ================= */
$("#newBtn").addEventListener("click",function(){ cText.focus(); });
Array.prototype.forEach.call(document.querySelectorAll(".nav-row"),function(el){
  el.addEventListener("click",function(){
    Array.prototype.forEach.call(document.querySelectorAll(".nav-row"),function(x){x.classList.remove("on");});
    el.classList.add("on");
    if(el.dataset.nav==="runs") selectRun(0);
  });
});

/* ================= boot ================= */
renderSidebar();
renderInbox();
renderRun();
renderArts();
renderSubs(null);
renderDset();
</script>
</body>
</html>
