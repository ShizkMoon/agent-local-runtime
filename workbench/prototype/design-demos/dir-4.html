<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dir-4 · T3 Code grammar — AICA 工作台</title>
<style>
/* ============================================================
   dir-4 — T3 Code (t3-chat dark) 语法移植
   Token 来源: packages/shared/src/themePalettes.ts → T3_CHAT_THEME.variants.dark
   状态 pill:  apps/web/src/components/Sidebar.logic.ts → resolveThreadStatusPill
   ============================================================ */
:root{
  /* --- T3_CHAT_THEME dark variant（原样 oklch 值） --- */
  --canvas:        oklch(0.22813 0.020366 307.469);
  --chrome:        oklch(0.22813 0.020366 307.469);
  --toolbar:       oklch(0.22813 0.020366 307.469);
  --toolbar-fg:    oklch(0.980735 0.004092 301.426);
  --toolbar-border:oklch(0.266943 0.015262 302.425);
  --surface:       oklch(0.267101 0.02016 311.799);
  --surface-raised:oklch(0.279864 0.021572 309.532);
  --surface-overlay:oklch(0.154761 0.01316 338.901);
  --text:          oklch(0.980735 0.004092 301.426);
  --text-muted:    oklch(0.880303 0.03077 342.696);
  --border:        oklch(0.266943 0.015262 302.425);
  --input:         oklch(0.266817 0.02897 344.461);
  --focus:         oklch(0.591646 0.217985 0.584);
  --accent:        oklch(0.460685 0.185347 4.099);
  --accent-fg:     oklch(0.901233 0.057189 343.694);
  --accent-surface:oklch(0.364912 0.050794 308.491);
  --accent-surface-fg:oklch(0.964695 0.009139 341.803);
  --secondary:     oklch(0.313674 0.030572 310.061);
  --secondary-fg:  oklch(0.848252 0.038248 307.961);
  --muted:         oklch(0.360924 0.021469 316.83);
  --placeholder:   oklch(0.657087 0.028226 307.985);
  --error:         oklch(0.458704 0.169677 3.815);
  --error-fg:      oklch(0.901233 0.057189 343.694);
  --error-surface: oklch(0.259022 0.04799 340.062);
  --warning:       oklch(0.76859 0.164659 70.08);
  --warning-fg:    oklch(0.836861 0.164422 84.429);
  --warning-surface:oklch(0.321706 0.036256 60.806);
  --update-surface:oklch(0.256077 0.063004 342.914);
  --message-surface:oklch(0.273791 0.025541 309.079);
  --message-fg:    oklch(0.949872 0.021269 306.838);
  --message-action:oklch(0.460685 0.185347 4.099);
  --message-action-fg:oklch(0.901233 0.057189 343.694);
  --code-bg:       oklch(0.22813 0.020366 307.469);
  --code-fg:       oklch(0.848703 0.064239 306.645);
  --sidebar:       oklch(0.185778 0.019368 322.159);
  --sidebar-fg:    oklch(0.967434 0.001326 286.375);
  --sidebar-muted: oklch(0.880303 0.03077 342.696);
  --sidebar-ctrl:  oklch(0.23366 0.026081 338.196);
  --sidebar-hover: oklch(0.23366 0.026081 338.196);
  --sidebar-active:oklch(0.23366 0.026081 338.196);
  --sidebar-border:oklch(0.269132 0.030766 351.067);

  /* --- status pill 体系（Sidebar.logic.ts: tailwind 色） --- */
  --st-working:  #7dd3fc;   /* sky-300/80   — Working,  pulse */
  --st-input:    #a5b4fc;   /* indigo-300/90 — Awaiting Input */
  --st-approval: #fcd34d;   /* amber-300/90 — Pending Approval */
  --st-done:     #6ee7b7;   /* emerald-300/90 — Completed */
  --st-failed:   #fca5a5;   /* red-300/90   — Failed */
  --st-plan:     #c4b5fd;   /* violet-300/90 — Plan Ready */

  --radius: 8px;            /* --radius: 0.5rem */
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px; --r-2xl: 16px;
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --font-serif: Georgia, "Songti SC", "SimSun", "Noto Serif CJK SC", serif;
  --sb-w: 256px;            /* THREAD_SIDEBAR_DEFAULT_WIDTH = 16*16 */
  --rp-w: 380px;            /* 右栏（真实默认 540 / min 360，1440 下取窄档） */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  font-size:14px;
  background:var(--canvas);
  color:var(--text);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{
  width:1440px;height:900px;margin:0 auto;
  display:grid;
  grid-template-columns:var(--sb-w) minmax(0,1fr) var(--rp-w);
  grid-template-rows:minmax(0,1fr);
  background:var(--canvas);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--font-mono)}
.num{font-variant-numeric:tabular-nums}

/* ============ 左栏：T3 Sidebar v2 ============ */
#sidebar{
  background:var(--sidebar);
  border-right:1px solid var(--sidebar-border);
  display:flex;flex-direction:column;min-height:0;
  transition:width .24s var(--ease-drawer);
  overflow:hidden;position:relative;
}
.sb-head{
  display:flex;align-items:center;gap:8px;
  padding:10px 10px 8px;flex:none;
}
.favicon{ /* ProjectFavicon 风格 */
  width:22px;height:22px;border-radius:var(--r-md);flex:none;
  display:flex;align-items:center;justify-content:center;
  background:var(--accent-surface);color:var(--accent-surface-fg);
  font-size:11px;font-weight:700;letter-spacing:.02em;
}
.sb-brand{min-width:0;flex:1;line-height:1.15;white-space:nowrap}
.sb-brand b{font-size:13px;font-weight:600;color:var(--sidebar-fg);display:block;overflow:hidden;text-overflow:ellipsis}
.sb-brand span{font-size:12px;color:var(--sidebar-muted);opacity:.8}
.icon-btn{
  width:28px;height:28px;border-radius:var(--r-md);flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--sidebar-muted);transition:background .12s,color .12s;
}
.icon-btn:hover{background:var(--sidebar-ctrl);color:var(--sidebar-fg)}
.icon-btn svg{width:16px;height:16px}

.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 8px 12px;min-height:0}
.sb-sec{
  font-size:12px;font-weight:500;color:var(--sidebar-muted);
  padding:12px 10px 4px;letter-spacing:.01em;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.sb-sec .cnt{margin-left:auto;font-size:12px;color:var(--sidebar-muted);opacity:.7;font-variant-numeric:tabular-nums}

/* nav 行（T3 行语法：min-h-9 rounded-md px-2.5 gap-2.5） */
.nav-row{
  display:flex;align-items:center;gap:10px;min-height:40px;width:100%;
  padding:4px 10px;border-radius:var(--r-md);
  font-size:14px;color:var(--sidebar-muted);
  transition:background .1s,color .1s;white-space:nowrap;
}
.nav-row svg{width:16px;height:16px;flex:none;opacity:.85}
.nav-row:hover{background:var(--sidebar-hover);color:var(--sidebar-fg)}
.nav-row.on{background:var(--sidebar-active);color:var(--sidebar-fg)}
.nav-row .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-row .bdg{
  flex:none;min-width:20px;height:18px;padding:0 6px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;
  background:var(--secondary);color:var(--secondary-fg);
}
.nav-row .bdg.hot{background:var(--accent);color:var(--accent-fg)}

/* Active run = RICH CARD（标题行 + 状态 pill 行 + meta 行） */
.run-card{
  width:100%;border-radius:var(--r-md);padding:6px 10px 7px;
  display:flex;flex-direction:column;gap:2px;position:relative;
  transition:background .1s;white-space:nowrap;
}
.run-card:hover{background:var(--sidebar-hover)}
.run-card.on{background:var(--sidebar-active)}
.run-card .r1{display:flex;align-items:center;gap:6px;min-height:20px}
.run-card .ttl{font-size:14px;font-weight:500;color:var(--sidebar-fg);overflow:hidden;text-overflow:ellipsis}
.run-card .meta{font-size:12px;color:var(--sidebar-muted);overflow:hidden;text-overflow:ellipsis;opacity:.85}
.run-card .meta b{font-weight:500;color:var(--secondary-fg)}

/* 状态 pill —— resolveThreadStatusPill 的颜色/脉冲语义 */
.pill{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  font-size:12px;font-weight:500;line-height:1;
}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.working{color:var(--st-working)} .pill.working i{animation:t3pulse 1.6s ease-in-out infinite}
.pill.input{color:var(--st-input)}
.pill.approval{color:var(--st-approval)}
.pill.done{color:var(--st-done)}
.pill.failed{color:var(--st-failed)}
.pill.plan{color:var(--st-plan)}
.pill.plain{color:var(--sidebar-muted)}
@keyframes t3pulse{0%,100%{opacity:1}50%{opacity:.35}}
.dur{margin-left:auto;font-size:12px;color:var(--sidebar-muted);font-variant-numeric:tabular-nums;flex:none}

/* Settled = 紧凑退行（灰阶 favicon + receded 标题 + 相对时间） */
.set-row{
  display:flex;align-items:center;gap:10px;min-height:36px;width:100%;
  padding:3px 10px;border-radius:var(--r-md);font-size:14px;
  color:var(--sidebar-muted);opacity:.78;
  transition:background .1s,color .1s,opacity .1s;white-space:nowrap;
}
.set-row:hover{background:var(--sidebar-hover);color:var(--sidebar-fg);opacity:1}
.set-row .fv{width:14px;height:14px;border-radius:4px;flex:none;background:var(--muted);filter:grayscale(1);opacity:.5}
.set-row:hover .fv{filter:none;opacity:.9}
.set-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.set-row .tm{flex:none;font-size:12px;color:var(--sidebar-muted);opacity:.6;font-variant-numeric:tabular-nums}

/* hover tooltip（CSS-only, T3 ThreadHoverCard 的简化版） */
[data-tip]{position:relative}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);
  background:var(--surface-overlay);color:var(--text);border:1px solid var(--border);
  font-size:12px;font-weight:400;padding:5px 9px;border-radius:var(--r-md);
  white-space:nowrap;z-index:60;box-shadow:0 8px 24px rgb(0 0 0/.4);pointer-events:none;
}

.sb-foot{
  flex:none;border-top:1px solid var(--sidebar-border);
  padding:8px 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.env-dot{width:7px;height:7px;border-radius:50%;background:var(--st-done);flex:none}
.sb-foot .env{font-size:12px;color:var(--sidebar-muted);display:flex;align-items:center;gap:6px;min-width:0}
.sb-foot .env b{font-weight:500;color:var(--sidebar-fg)}
#collapseBtn{margin-left:auto}

/* 折叠态（56px 图标栏） */
#app.sb-closed{grid-template-columns:56px minmax(0,1fr) var(--rp-w)}
#app.sb-closed #sidebar{width:56px}
#app.sb-closed .sb-brand,#app.sb-closed .nav-row .lab,#app.sb-closed .nav-row .bdg,
#app.sb-closed .run-card .meta,#app.sb-closed .run-card .ttl,#app.sb-closed .dur,
#app.sb-closed .set-row .t,#app.sb-closed .set-row .tm,#app.sb-closed .sb-sec .txt,
#app.sb-closed .sb-sec .cnt,#app.sb-closed .env{display:none}
#app.sb-closed .nav-row,#app.sb-closed .set-row{justify-content:center;padding:4px 0}
#app.sb-closed .run-card{align-items:center;padding:8px 0}
#app.sb-closed .run-card .r1{justify-content:center}
#app.sb-closed .favicon{margin:0 auto}
#app.sb-closed .sb-head{justify-content:center;padding:10px 4px}
#app.sb-closed .sb-scroll{padding:2px 4px 12px}
#app.sb-closed .sb-foot{justify-content:center;padding:8px 4px}
#app.sb-closed #newBtn{display:none}
#app.sb-closed #collapseBtn{margin:0}
#collapseBtn svg{transition:transform .24s var(--ease-drawer)}
#app.sb-closed #collapseBtn svg{transform:rotate(180deg)}

/* ============ 中栏：thread / stream ============ */
#center{display:flex;flex-direction:column;min-width:0;background:var(--canvas)}
.th-head{
  flex:none;min-height:44px;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--toolbar-border);
  background:var(--toolbar);
}
.crumb{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.crumb b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.crumb i{font-style:normal;opacity:.45}
.th-head .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.model-tag{
  font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;
  display:inline-flex;align-items:center;gap:5px;
}
.model-tag .sep{opacity:.4}

.thread-scroll{flex:1;overflow-y:auto;min-height:0;padding:18px 22px 8px}
.col-inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* user bubble — messageSurface，右对齐圆角泡 */
.urow{display:flex;justify-content:flex-end}
.ububble{
  max-width:78%;background:var(--message-surface);color:var(--message-fg);
  border-radius:var(--r-2xl) var(--r-2xl) var(--r-sm) var(--r-2xl);
  padding:8px 14px;font-size:14px;line-height:1.55;
}
.uchips{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.uchip{font-size:12px;color:var(--text-muted);border:1px solid var(--border);border-radius:var(--r-md);padding:2px 8px;background:var(--surface)}

/* assistant 文本（markdown 正文，无气泡） */
.atext{font-size:14px;line-height:1.7;color:var(--text)}
.atext .mk{font-size:12px;color:var(--text-muted);margin-top:6px;display:block}

/* 根卡 — surface raised */
.root-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:16px 18px 14px;
}
.root-meta{font-size:12px;color:var(--text-muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.root-meta .id{font-family:var(--font-mono);color:var(--secondary-fg)}
.root-title{font-family:var(--font-serif);font-size:22px;font-weight:600;color:var(--text);margin:6px 0 4px;letter-spacing:.01em}
.root-obj{font-size:14px;line-height:1.65;color:var(--text-muted);max-width:62ch}
.rollup{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  font-size:12px;font-weight:500;color:var(--st-approval);
  background:color-mix(in srgb,var(--warning-surface) 55%,transparent);
  border:1px solid color-mix(in srgb,var(--warning) 28%,transparent);
  padding:3px 9px;border-radius:999px;
}
.rollup i{width:6px;height:6px;border-radius:50%;background:currentColor}
.rollup.clear{color:var(--st-done);background:transparent;border-color:var(--border)}

/* accept 芯片 */
.accept{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.accept .lb{font-size:12px;color:var(--text-muted);margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:7px;min-height:28px;
  border:1px solid var(--border);border-radius:var(--r-md);
  padding:3px 10px;font-size:13px;color:var(--secondary-fg);
  background:var(--surface-raised);transition:border-color .12s,background .12s;
}
.chip:hover{border-color:var(--input);background:var(--secondary)}
.chip .g{width:7px;height:7px;border-radius:50%;flex:none}
.chip[data-s="verified"] .g{background:var(--st-done)}
.chip[data-s="failed"] .g{background:var(--st-failed)}
.chip[data-s="pending"] .g{background:transparent;border:1.5px solid var(--placeholder)}
.chip[data-s="human"] .g{background:var(--st-input)}
.chip .cls{font-size:12px;color:var(--text-muted)}
.chip.delta{border-style:dashed;color:var(--text-muted)}
.chip.delta .plus{color:var(--accent-fg);font-weight:600}

/* 分区标签（WorkLog group header 的密度） */
.sec-lab{
  font-size:12px;font-weight:500;color:var(--text-muted);
  display:flex;align-items:center;gap:8px;margin:6px 0 -6px;
}
.sec-lab .ln{flex:1;height:1px;background:var(--border)}
.sec-lab .r{font-variant-numeric:tabular-nums;opacity:.7}
.flt{
  font-size:12px;color:var(--text-muted);border:1px solid var(--border);
  border-radius:999px;padding:2px 9px;transition:all .12s;
}
.flt:hover{color:var(--text);border-color:var(--input)}
.flt.on{background:var(--secondary);color:var(--secondary-fg);border-color:transparent}

/* WorkLog 工具调用行 — icon 24px 列 + label + chevron，可展开 mono 体 */
.wl{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.wl-row{
  display:flex;align-items:center;gap:8px;width:100%;min-height:34px;
  padding:4px 10px 4px 6px;font-size:14px;color:var(--secondary-fg);
  transition:background .1s;
}
.wl-row:hover{background:var(--sidebar-hover)}
.wl-ic{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.wl-ic svg{width:15px;height:15px}
.wl-row .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-row .lb code{font-family:var(--font-mono);font-size:.92em;color:var(--code-fg)}
.wl-row .st{font-size:12px;color:var(--text-muted);flex:none;font-variant-numeric:tabular-nums}
.wl-row .st.ok{color:var(--st-done)}
.wl-row .st.err{color:var(--st-failed)}
.wl-row .chev{width:14px;height:14px;flex:none;color:var(--text-muted);transition:transform .18s var(--ease-drawer)}
.wl.open .chev{transform:rotate(90deg)}
.wl-body{display:none;border-top:1px solid var(--border);background:var(--code-bg)}
.wl.open .wl-body{display:block}
.wl-body pre{
  max-height:240px;overflow:auto;padding:10px 14px;
  font-family:var(--font-mono);font-size:12px;line-height:1.6;
  color:var(--code-fg);white-space:pre-wrap;word-break:break-word;cursor:text;
}
.wl-body pre .k{color:var(--st-input)} .wl-body pre .ok{color:var(--st-done)} .wl-body pre .err{color:var(--st-failed)}

/* lineage 任务树 — SubagentTimelineLink 语法（avatar + status dot + title + detail + elapsed + ›） */
.tree{display:flex;flex-direction:column}
.tnode{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:5px 8px;border-radius:var(--r-md);min-height:38px;
  transition:background .1s;position:relative;
}
.tnode:hover{background:var(--sidebar-hover)}
.tnode.sel{background:var(--sidebar-active);box-shadow:inset 0 0 0 1px var(--input)}
.tnode.l2{padding-left:8px;min-height:40px}
.tnode.l3{padding-left:34px;min-height:34px}
#tree>.tnode.l3::before{ /* 层级引导线 */
  content:"";position:absolute;left:19px;top:-4px;bottom:50%;width:1px;background:var(--border);
}
#tree>.tnode.l3::after{content:"";position:absolute;left:19px;top:50%;width:9px;height:1px;background:var(--border)}
.av{
  width:24px;height:24px;border-radius:50%;flex:none;position:relative;
  display:flex;align-items:center;justify-content:center;
  background:var(--muted);border:1px solid var(--border);color:var(--secondary-fg);
}
.av svg{width:13px;height:13px}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;border:2px solid var(--canvas)}
.dot.working{background:var(--st-working)} .dot.input{background:var(--st-input)}
.dot.done{background:var(--st-done)} .dot.queued{background:var(--placeholder)}
.dot.dep{background:var(--st-approval)} .dot.failed{background:var(--st-failed)}
.tn-main{flex:1;min-width:0}
.tn-t{display:flex;align-items:baseline;gap:8px;min-width:0}
.tn-t .nm{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tn-t .nm.deep{color:var(--st-input)}
.tn-d{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.wb{ /* waits_on badge */
  flex:none;font-size:12px;font-weight:500;padding:1px 7px;border-radius:999px;
  border:1px solid var(--border);color:var(--text-muted);background:var(--surface);
}
.wb.person{color:var(--st-input);border-color:color-mix(in srgb,var(--st-input) 40%,transparent);background:color-mix(in srgb,var(--st-input) 10%,transparent)}
.wb.dep{color:var(--st-approval);border-color:color-mix(in srgb,var(--st-approval) 35%,transparent)}
.wb.queued{color:var(--text-muted)}
.tn-st{flex:none;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.tn-st.await{color:var(--st-input);font-weight:500}
.tnode .chev{width:14px;height:14px;flex:none;color:var(--text-muted);opacity:.5}
.tnode:hover .chev{opacity:1}
.prog{width:52px;height:4px;border-radius:2px;background:var(--muted);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--st-working);border-radius:2px}

/* L4+ 聚合折叠卡（若干 subagent 折为一张 collapsible card） */
.fold-card{margin-left:34px;border:1px dashed var(--border);border-radius:var(--r-lg)}
.fold-h{
  display:flex;align-items:center;gap:8px;width:100%;min-height:32px;
  padding:4px 10px;font-size:12px;color:var(--text-muted);transition:color .1s;
}
.fold-h:hover{color:var(--text)}
.fold-h .chev{width:12px;height:12px;transition:transform .18s var(--ease-drawer)}
.fold-card.open .fold-h .chev{transform:rotate(90deg)}
.fold-body{display:none;padding:2px 6px 6px}
.fold-card.open .fold-body{display:block}
.fold-body .tnode{min-height:30px;padding:3px 8px}
.fold-body .av{width:18px;height:18px}
.fold-body .av svg{width:10px;height:10px}
.fold-body .tn-t .nm{font-size:12px;font-weight:400;color:var(--secondary-fg)}

/* 事实卡 / 产物行 */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;
}
.fact .fk{font-size:12px;font-weight:600;color:var(--st-input);font-variant-numeric:tabular-nums}
.fact p{font-size:13px;line-height:1.55;color:var(--secondary-fg)}
.fact p code{font-family:var(--font-mono);font-size:.9em;color:var(--code-fg);background:var(--code-bg);padding:0 4px;border-radius:3px}
.fact .src{font-size:12px;color:var(--text-muted);margin-top:auto}
.art{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;min-width:0;
}
.art .ah{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);background:var(--surface-raised)}
.art .fn{font-family:var(--font-mono);font-size:12px;color:var(--secondary-fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .ft{font-size:12px;font-weight:600;color:var(--text-muted);flex:none}
.art .bd{padding:8px 10px;font-family:var(--font-mono);font-size:12px;line-height:1.65;color:var(--code-fg);min-height:74px}
.art .bd .hh{color:var(--text);font-weight:600}
.art .bd .p{color:var(--st-done)} .art .bd .m{color:var(--st-failed)}
.art .st{padding:6px 10px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border)}
.art .st .p{color:var(--st-done)} .art .st .m{color:var(--st-failed)}
.pagemock{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:74px;background:var(--code-bg)}
.pagemock .b{height:7px;border-radius:3px;background:var(--muted)}
.pagemock .hero{height:22px;border-radius:4px;background:var(--accent-surface)}
.pagemock .cols{display:flex;gap:5px}
.pagemock .cols i{flex:1;height:16px;border-radius:3px;background:var(--secondary)}
.w40{width:40%}.w70{width:70%}.w55{width:55%}

/* 折叠证据流 */
.stream{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.stream-h{
  display:flex;align-items:center;gap:8px;width:100%;min-height:36px;
  padding:6px 12px;font-size:13px;font-weight:500;color:var(--secondary-fg);
  background:var(--surface);transition:background .1s;
}
.stream-h:hover{background:var(--surface-raised)}
.stream-h .chev{width:14px;height:14px;color:var(--text-muted);transition:transform .18s var(--ease-drawer)}
.stream.open .stream-h .chev{transform:rotate(90deg)}
.stream-h .n{margin-left:auto;font-size:12px;font-weight:400;color:var(--text-muted);font-variant-numeric:tabular-nums}
.stream-body{display:none;border-top:1px solid var(--border);background:var(--code-bg)}
.stream.open .stream-body{display:block}
.stream-body pre{padding:10px 14px;font-family:var(--font-mono);font-size:12px;line-height:1.7;color:var(--code-fg);white-space:pre-wrap}
.stream-body .t{color:var(--text-muted)} .stream-body .hi{color:var(--st-input)} .stream-body .err{color:var(--st-failed)}

/* ============ composer：T3 bottom bar ============ */
.composer-zone{flex:none;padding:0 22px 14px;max-width:804px;margin:0 auto;width:100%}
/* ComposerBanner：attached surface，tuck under composer（rounded-t-2xl + overlap） */
.cb-banner{
  position:relative;margin:0 10px -13px;padding:6px 8px 19px;
  font-size:12px;line-height:16px;border-radius:var(--r-2xl) var(--r-2xl) 0 0;
  background:var(--surface-raised);
  border:1px solid color-mix(in srgb,var(--warning) 28%,transparent);border-bottom:0;
  box-shadow:0 -1px 0 color-mix(in srgb,var(--warning) 8%,transparent) inset;
  display:flex;align-items:center;gap:0;z-index:2;
}
.cb-banner .ic{width:24px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--warning-fg)}
.cb-banner .ic svg{width:14px;height:14px}
.cb-banner .ct{flex:1;min-width:0;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-banner .ct b{color:var(--warning-fg);font-weight:600}
.cb-banner .ac{display:flex;gap:6px;flex:none}
.cb-btn{
  font-size:12px;font-weight:500;color:var(--secondary-fg);
  border:1px solid var(--border);border-radius:var(--r-md);padding:3px 10px;min-height:26px;
  background:var(--surface);transition:all .12s;
}
.cb-btn:hover{background:var(--secondary);color:var(--text)}
.cb-btn.ghost{border-color:transparent;color:var(--text-muted)}
.cb-banner.info{border-color:color-mix(in srgb,var(--input) 60%,transparent)}
.cb-banner.info .ic{color:var(--st-input)}
.cb-banner.info .ct b{color:var(--st-input)}
.cb-banner.resolved{border-color:var(--border)}
.cb-banner.resolved .ic{color:var(--st-done)}
.cb-banner.resolved .ct b{color:var(--st-done)}

/* composer 卡：rounded-2xl，glass surface */
.composer{
  position:relative;z-index:3;
  background:var(--surface-raised);border:1px solid var(--border);
  border-radius:var(--r-2xl);
  box-shadow:0 8px 28px rgb(0 0 0/.28);
}
.c-input{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;min-height:44px}
.c-input textarea{
  flex:1;background:none;border:0;outline:none;resize:none;
  font:inherit;font-size:14px;color:var(--text);line-height:1.5;height:22px;
}
.c-input textarea::placeholder{color:var(--placeholder)}
.c-foot{display:flex;align-items:center;gap:6px;padding:6px 10px 10px}
.dial{
  display:inline-flex;align-items:center;gap:5px;min-height:28px;
  padding:3px 9px;border-radius:var(--r-md);font-size:12px;
  color:var(--text-muted);transition:background .12s,color .12s;
}
.dial:hover{background:var(--secondary);color:var(--secondary-fg)}
.dial b{font-weight:500;color:var(--secondary-fg)}
.dial svg{width:12px;height:12px;opacity:.6}
.dial.warn b{color:var(--warning-fg)}
.send{

  display:flex;align-items:center;justify-content:center;
  background:var(--message-action);color:var(--message-action-fg);
  transition:background .12s,opacity .12s;
}
.send:hover{background:oklch(0.458754 0.184639 3.857)} /* messageActionHover 实值 */
.send svg{width:15px;height:15px}
.send:disabled{opacity:.5;cursor:default}

/* ============ 右栏：RightPanel — 需要你 inbox ============ */
#right{

}
.rp-tabs{

}
.rp-tab{

}
.rp-tab:hover{color:var(--text)}
.rp-tab.on{color:var(--text);border-bottom-color:var(--accent)}
.rp-tab .bdg{font-size:12px;font-weight:600;min-width:18px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.rp-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.rp-pane{display:none;flex-direction:column;gap:10px}
.rp-pane.on{display:flex}

/* inbox 卡 */
.incard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;
  transition:opacity .25s,border-color .2s;
}
.incard.err{border-color:color-mix(in srgb,var(--error) 45%,transparent);background:color-mix(in srgb,var(--error-surface) 60%,var(--surface))}
.incard.res{opacity:.55}
.incard .tag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}

.k.err{background:var(--error);color:var(--error-fg)}
.k.ask{background:var(--update-surface);color:var(--st-input)}
.k.acc{background:color-mix(in srgb,var(--st-plan) 18%,transparent);color:var(--st-plan)}
.k.deep{background:var(--update-surface);color:var(--st-input)}
.k.fail{background:color-mix(in srgb,var(--st-failed) 15%,transparent);color:var(--st-failed)}
.k.done{background:var(--secondary);color:var(--text-muted)}
.incard .tag .path{margin-left:auto;font-family:var(--font-mono);font-size:12px;font-weight:400;color:var(--text-muted)}
.incard h3{font-size:14px;font-weight:600;color:var(--text);line-height:1.4}
.incard .desc{font-size:13px;line-height:1.55;color:var(--text-muted)}
.incard .desc code{font-family:var(--font-mono);font-size:.92em;color:var(--code-fg)}
.icrumb{ /* 深层 gate 面包屑 */
  font-size:12px;color:var(--text-muted);display:flex;gap:5px;align-items:center;flex-wrap:wrap;
  background:var(--code-bg);border:1px solid var(--border);border-radius:var(--r-md);padding:5px 8px;
}
.icrumb i{font-style:normal;opacity:.4}
.icrumb b{color:var(--st-input);font-weight:500}
.clauses{display:flex;gap:6px;flex-wrap:wrap}
.clause{font-size:12px;color:var(--secondary-fg);border:1px solid var(--border);border-radius:var(--r-md);padding:2px 8px;background:var(--surface-raised);font-variant-numeric:tabular-nums}
.opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.opt{
  font-size:12px;font-weight:500;color:var(--secondary-fg);min-height:36px;
  border:1px solid var(--border);border-radius:var(--r-md);padding:6px 13px;
  background:var(--surface-raised);transition:all .12s;
}
.opt:hover{background:var(--secondary);color:var(--text);border-color:var(--input)}
.opt.danger{color:var(--st-failed);border-color:color-mix(in srgb,var(--error) 40%,transparent)}
.opt.danger:hover{background:var(--error-surface)}
.opt.solid{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.opt.solid:hover{filter:brightness(1.12)}
.verdict{display:none;font-size:12px;color:var(--st-done);align-items:center;gap:6px;padding-top:2px}
.incard.res .verdict{display:flex}
.incard.res .opts{display:none}
.verdict::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--st-done)}

/* 节点 inspector pane */
.insp{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:12px}
.insp .ih{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.insp h4{font-size:14px;font-weight:600;margin-bottom:4px}
.insp .row{display:flex;font-size:12px;padding:5px 0;border-top:1px solid var(--border);gap:8px}
.insp .row .k{width:72px;flex:none;color:var(--text-muted)}
.insp .row .v{color:var(--secondary-fg);font-family:var(--font-mono);font-size:12px;word-break:break-all}
.insp .hint{font-size:12px;color:var(--text-muted);text-align:center;padding:20px 0}

.fadein{animation:fade .28s var(--ease-drawer)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

function showInspector(d){
  $("#inspBox").innerHTML =
    '<div class="ih">节点详情 · inspector</div><h4>'+d.nm+'</h4>'+
    '<div class="row"><span class="k">状态</span><span class="v">'+d.st+'</span></div>'+
    '<div class="row"><span class="k">waits_on</span><span class="v">'+d.wb+'</span></div>'+
    '<div class="row"><span class="k">耗时</span><span class="v">'+d.el+'</span></div>'+
    '<div class="row"><span class="k">摘要</span><span class="v" style="font-family:var(--font-sans)">'+d.d+'</span></div>'+
    '<div class="row"><span class="k">路径</span><span class="v">'+RUNS[currentRun].id+' › '+d.nm+'</span></div>';
}
function switchPane(name){
  Array.prototype.forEach.call(document.querySelectorAll(".rp-tab"),function(t){
    t.classList.toggle("on", t.dataset.pane===name);
  });
  $("#pane-inbox").classList.toggle("on", name==="inbox");
  $("#pane-node").classList.toggle("on", name==="node");
}
Array.prototype.forEach.call(document.querySelectorAll(".rp-tab"),function(t){
  t.addEventListener("click",function(){ switchPane(t.dataset.pane); });
});

/* ================= inbox ================= */
function renderInbox(){
  $("#pane-inbox").innerHTML = INBOX.map(function(c){
    var h = '<article class="incard'+(c.k==="err"?" err":"")+(c.resolved?" res":"")+'" id="'+c.id+'">';
    h += '<div class="tag"><span class="k '+c.k+'">'+c.kl+'</span><span class="path">'+c.path+'</span></div>';
    if(c.crumb) h += '<div class="icrumb">'+c.crumb.map(function(x,i){return (i?'<i>›</i>':'')+(i===c.crumb.length-1?'<b>'+x+'</b>':x);}).join("")+'</div>';
    h += '<h3>'+c.t+'</h3>';
    if(c.clause) h += '<div class="clauses">'+c.clause.map(function(x){return '<span class="clause">'+x+'</span>';}).join("")+'</div>';
    h += '<p class="desc">'+c.d+'</p>';
    if(c.opts) h += '<div class="opts">'+c.opts.map(function(o){
      return '<button class="opt '+o[1]+'" data-v="'+o[2]+'">'+o[0]+'</button>';
    }).join("")+'</div>';
    h += '<div class="verdict">'+(c.verdict||"")+'</div></article>';
    return h;
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("#pane-inbox .opt"),function(el){
    el.addEventListener("click",function(){ resolveCard(el.closest(".incard"), el.dataset.v); });
  });
}
function resolveCard(card, verdict){
  if(card.classList.contains("res")) return;
  card.classList.add("res");
  card.querySelector(".verdict").textContent = verdict;
  inboxLeft = Math.max(0, inboxLeft-1);
  $("#navInboxBdg").textContent = inboxLeft;
  $("#rpInboxBdg").textContent = inboxLeft;
  if(inboxLeft===0){ $("#navInboxBdg").classList.remove("hot"); }
  if(card.id==="c4") resolveDeepGate();   /* 深层 gate → 祖先上卷解除 */
}
function resolveDeepGate(){
  pendingDeep = 0;
  RUNS[0].status = "working";
  /* 树内徽章：L2 祖先 pill 与「1 待处理」上卷撤下 */
  Array.prototype.forEach.call(document.querySelectorAll("#tree .anc-roll"),function(el){ el.remove(); });
  var deep = document.querySelector('#tree .tnode[data-nm="抓取 openclaudeui token 值"]');
  if(deep){
    deep.dataset.st = "working";
    deep.querySelector(".dot").className = "dot working";
    deep.querySelector(".wb").remove();
    deep.querySelector(".tn-st").className = "tn-st";
    deep.querySelector(".tn-st").textContent = "Running · 00:03";
    deep.querySelector(".nm").classList.remove("deep");
    deep.querySelector(".tn-d").textContent = "已回复 · 恢复执行";
  }
  var anc = document.querySelector('#tree .tnode[data-nm="调研 Claude Desktop"]');
  if(anc){
    anc.dataset.st = "working";
    anc.querySelector(".dot").className = "dot working";
    anc.querySelector(".tn-st").className = "tn-st";
    anc.querySelector(".tn-st").textContent = "Running · 04:15";
  }
  var rb = $("#rollupBadge");
  if(rb){ rb.className = "rollup clear"; rb.innerHTML = "<i></i>祖先上卷 · 全部畅通"; }
  $("#thPill").className = "pill working"; $("#thPill").innerHTML = "<i></i>Working";
  /* banner 归卷：0 节点等待回复 */
  var b = $("#gateBanner");
  b.className = "cb-banner resolved";
  $("#gateBannerText").innerHTML = "<b>0 节点等待回复</b> · 深层 gate 已裁决，L3-2 恢复执行";
  $("#gateLocate").style.display = "none";
  renderSidebar();
}
$("#gateLocate").addEventListener("click",function(){
  var n = document.querySelector('#tree .tnode[data-nm="抓取 openclaudeui token 值"]');
  if(!n){ selectRun(0); n = document.querySelector('#tree .tnode[data-nm="抓取 openclaudeui token 值"]'); }
  if(n){ n.scrollIntoView({block:"center"}); n.classList.add("sel"); showInspector(n.dataset); switchPane("node"); }
});
$("#gateDismiss").addEventListener("click",function(){ $("#gateBanner").style.display="none"; });

/* ================= composer ================= */
Array.prototype.forEach.call(document.querySelectorAll(".dial"),function(el){
  el.addEventListener("click",function(){
    var opts = el.dataset.cycle.split("|"), b = el.querySelector("b");
    b.textContent = opts[(opts.indexOf(b.textContent)+1)%opts.length];
    if(b.textContent==="受限"||b.textContent==="开放") el.classList.add("warn"); else el.classList.remove("warn");
    $("#thModel").textContent = document.querySelectorAll(".dial b")[2].textContent;
  });
});
$("#sendBtn").addEventListener("click",function(){
  var t = $("#cText"), v = t.value.trim();
  if(!v){ t.focus(); return; }
  var ci = $("#colInner");
  var div = document.createElement("div");
  div.className = "urow";
  div.innerHTML = '<div class="ububble"></div>';
  div.querySelector(".ububble").textContent = v;
  ci.appendChild(div);
  var ack = document.createElement("div");
  ack.className = "atext";
  ack.innerHTML = '已收到，排入当前任务队列。<span class="mk">qwen3-32b · high · queued</span>';
  ci.appendChild(ack);
  t.value = "";
  $("#threadScroll").scrollTop = $("#threadScroll").scrollHeight;
});
$("#cText").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("#sendBtn").click(); }
});

/* ================= nav / collapse ================= */
Array.prototype.forEach.call(document.querySelectorAll(".nav-row"),function(el){
  el.addEventListener("click",function(){
    Array.prototype.forEach.call(document.querySelectorAll(".nav-row"),function(x){x.classList.remove("on");});
    el.classList.add("on");
    if(el.dataset.nav==="inbox") switchPane("inbox");
    if(el.dataset.nav==="runs") selectRun(0);
  });
});
$("#collapseBtn").addEventListener("click",function(){
  $("#app").classList.toggle("sb-closed");
});

/* ================= boot ================= */
renderSidebar();
renderInbox();
renderRun();
</script>
</body>
</html>
